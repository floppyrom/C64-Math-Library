name: Issue39 PR100 historical replay and publication reseal
on:
  push:
    branches: [issue39-v1-3216-ool-source-trial]
    paths:
      - 'tools/finalize_issue39_3216_historical_replay.py'
      - '.github/workflows/issue39-v1-3216-historical-reseal.yml'
permissions:
  contents: write
jobs:
  checked-archive-reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-v1-3216-ool-source-trial
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Seal exact V1/V2 historical replay evidence and public checksum ledger
        run: python3 tools/finalize_issue39_3216_historical_replay.py
      - name: Commit fully sealed historical compatibility evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: seal SHA-pinned historical DIV/MOD replay and release audits'
          git push origin HEAD:issue39-v1-3216-ool-source-trial
