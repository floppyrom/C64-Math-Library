name: Apply ATAN2 release patch

on:
  push:
    branches: [atan2-fast-final-2026-09-17]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage ATAN2 release payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated release delta
        shell: bash
        run: |
          set -euo pipefail
          cat .github/atanfinal_* | base64 -d | gzip -dc > /tmp/atan2-final.diff
          git apply --binary --index /tmp/atan2-final.diff
          rm -f .github/atanpart_* .github/atanfinal_* .github/ATAN2_TRIGGER .github/workflows/apply-atan2-release.yml
          git add -A
          git config user.name 'floppyrom'
          git config user.email 'mihaibn@gmail.com'
          git commit -m 'Apply final ATAN2 tree'
          git push origin HEAD:atan2-fast-final-2026-09-17
