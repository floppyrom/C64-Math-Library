name: Historical V3 signed24 relocatable source proof

on:
  pull_request:
    paths:
      - routines/divide/sdiv24_v3_relocated.asm
      - tools/selective_linker.py
      - tools/test_selective_sdiv24_v3.py
      - tools/native_selective_sdiv24_v3.py
      - docs/SDIV24_V3_TRANSPLANT.md
      - .github/workflows/sdiv24-v3-transplant.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-cpu-public:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source syntax
        run: python3 -m compileall -q tools/selective_linker.py tools/test_selective_sdiv24_v3.py tools/native_selective_sdiv24_v3.py
      - name: Historical V3 signed24 private producer public-ABI, SMC isolation and cycle pairs
        run: python3 -m unittest discover -s tools -p 'test_selective_sdiv24_v3.py' -v

  pinned-vice-native:
    needs: paired-cpu-public
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install upstream VICE r46284 headless build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned VICE r46284
        env:
          VICE_JOBS: "2"
        run: bash tools/vice/build_headless.sh
      - name: Both V3 signed24 entries at two independent source relocations
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_sdiv24_v3.py
