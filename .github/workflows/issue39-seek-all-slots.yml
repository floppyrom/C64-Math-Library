name: Issue39 eight-slot SEEK family public ABI research
on:
  push:
    branches: [issue39-seek-all-slots-public-audit-20261014]
    paths:
      - tools/validate_issue39_seek_all_slots.py
      - .github/workflows/issue39-seek-all-slots.yml
  pull_request:
    branches: [main]
    paths:
      - tools/validate_issue39_seek_all_slots.py
      - .github/workflows/issue39-seek-all-slots.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  all-slots-five-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-seek-all-slots-public-audit-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical generated SEEK sources
        run: |
          python3 -m py_compile tools/validate_issue39_seek_all_slots.py
          python3 tools/generate_seek_sources.py --check
      - name: Build all five profiles in reference and alternate relocation
        run: |
          python3 tools/generate_sources.py
          for kind in reference alternate; do
            python3 tools/assemble_sources.py --profile all --config-kind "$kind"
            python3 tools/build_hybrid.py --config-kind "$kind"
          done
      - name: Interleave eight SEEK8/16 objects across all four public entries
        run: |
          python3 tools/validate_issue39_seek_all_slots.py
      - name: Verify mixed DIV/MOD coexistence and no write into other islands
        run: |
          python3 tools/validate_issue136_seek_divmod_mixed.py
          python3 tools/validate_seek_placement.py
      - name: Seal evidence, both changelogs and deterministic package manifests
        run: python3 tools/stage_issue39_seek_all_slots_research.py
      - name: Commit green research audit only
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SHA256SUMS.txt validation/PACKAGE_AUDIT.json \
            validation/review/ISSUE39_SEEK_ALL_SLOTS_RESEARCH_2026-10-14.json \
            docs/ISSUE39_SEEK_ALL_SLOTS_RESEARCH_2026-10-14.md \
            CHANGELOG.md CSDB_CHANGELOG.txt
          git diff --cached --quiet || git commit -m 'issue39: publish green eight-slot SEEK-family research evidence'
          git push origin HEAD:issue39-seek-all-slots-public-audit-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-seek-eight-slots-research
          if-no-files-found: warn
          path: validation/review/ISSUE39_SEEK_ALL_SLOTS_RESEARCH_2026-10-14.json
