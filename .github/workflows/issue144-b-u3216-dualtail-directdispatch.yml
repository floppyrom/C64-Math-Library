name: Issue144 B all-domain dual low-divisor direct-dispatch screen
on:
  push:
    branches: [issue144-b-lowd32-dualtail-directdispatch-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble production highD and no-overflow lowD engines, compare public DIV MOD
        run: python3 tools/issue144_u3216_dualtail_direct_dispatch_screen.py
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check real normal-resident source-owned vacancy before D8 core
        run: python3 tools/issue144_u3216_dualtail_resident_geometry.py
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SHA256-pinned native headless 6510 VICE
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Real native Q R C inputs stack across 2 public APIs, 3 profiles and 2 maps
        run: python3 tools/native_issue144_u3216_dualtail_direct_dispatch.py
