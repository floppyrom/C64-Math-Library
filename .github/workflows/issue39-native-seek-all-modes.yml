name: Issue39 native all SEEK public modes, V1-V5
on:
  push:
    branches: [issue39-native-seek-all-steppers-20261014]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-seek:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm canonical public source and native test syntax
        run: |
          python3 -m py_compile tools/native_issue39_seek_all_modes.py
          python3 tools/generate_seek_sources.py --check
      - name: Install SHA-256-pinned headless VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Execute all eight public SEEK8/16 modes in hardware-level x64sc
        run: python3 tools/native_issue39_seek_all_modes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-native-seek-all-modes
          if-no-files-found: warn
          path: validation/review/ISSUE39_SEEK_ALL_MODES_NATIVE_VICE_2026-10-14.json
