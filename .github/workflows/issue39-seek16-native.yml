name: Issue39 SEEK16 Euclidean init native VICE candidate proof
on:
  push:
    branches: [issue39-seek16-euclid-scale-source-release-20261014]
    paths:
      - tools/native_issue39_seek16_scale.py
      - tools/seek_kernel.py
      - .github/workflows/issue39-seek16-native.yml
  pull_request:
    branches: [main]
    paths:
      - tools/native_issue39_seek16_scale.py
      - tools/seek_kernel.py
      - .github/workflows/issue39-seek16-native.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-public-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate source and candidate reference PRGs
        run: |
          python3 tools/generate_seek_sources.py
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference
          python3 tools/build_hybrid.py --config-kind reference
      - name: Install pinned native x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Run paired native VICE public SEEK16 INIT across V1-V5
        run: python3 tools/native_issue39_seek16_scale.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-seek16-native-proof
          if-no-files-found: warn
          path: validation/review/ISSUE39_SEEK16_SCALE_NATIVE_2026-10-14.json
