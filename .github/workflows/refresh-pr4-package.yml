name: Refresh PR4 package contract

on:
  push:
    branches:
      - smul32-compact126-final-integration

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smul32-compact126-final-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove one-shot workflow
        run: rm .github/workflows/refresh-pr4-package.yml
      - name: Validate generated public indexes remain canonical
        run: |
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          git diff --exit-code -- benchmarks routines/SOURCE_CATALOG.csv validation/PUBLIC_SOURCE_CATALOG_AUDIT.json validation/STANDALONE_API_CONSISTENCY_AUDIT.json
      - name: Refresh package manifest and audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
      - name: Commit refreshed PR4 tree
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refresh compact126 optional overlay package contract"
          git push origin HEAD:smul32-compact126-final-integration
