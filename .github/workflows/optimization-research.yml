name: Optimization research

on:
  push:
    branches:
      - opt/mod-isqrt-fast24-turbo-20261007
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build reference and alternate maps
        run: |
          python3 tools/generate_sources.py
          make reference
          make alternate
          make hybrid
      - name: Validate remainder-only division family
        run: |
          python3 tools/validate_remainder_source_ab.py
          python3 tools/validate_signed_remainder_source_ab.py
      - name: Validate UMUL24 direct-output path
        run: python3 tools/validate_umul24_directout.py
      - name: Validate Turbo lifecycle
        run: |
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py
      - name: Validate V4 ISQRT32 prefix accelerator
        run: python3 tools/validate_isqrt32_reu_prefix_ab.py
      - name: Benchmark shifted134 Turbo16 candidate
        run: python3 tools/research_turbo16_shifted134.py
