name: Issue39 V1/V5 UMUL24 private tailcall native proof
on:
  push:
    branches: [issue39-v1v5-umul24-tailcall-screen]
    paths:
      - tools/native_issue39_v1v5_umul24_tailcall.py
      - tools/finalize_issue39_v1v5_umul24_native.py
      - .github/workflows/issue39-v1v5-umul24-native.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-old-new:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-v1v5-umul24-tailcall-screen
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install SHA-pinned headless VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Execute 384 V1 V5 old/new real VICE UMUL24 and SMUL24 public calls
        run: python3 tools/native_issue39_v1v5_umul24_tailcall.py
      - name: Validate native proof and reseal V1/V5 resident metadata
        run: python3 tools/finalize_issue39_v1v5_umul24_native.py
      - name: Commit native evidence after all seal checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: certify native V1 V5 UMUL24 private tailcall and seal package'
          git push origin HEAD:issue39-v1v5-umul24-tailcall-screen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-v1v5-umul24-native-proof
          path: validation/review/ISSUE39_V1V5_UMUL24_TAILCALL_NATIVE_2026-10-13.json
