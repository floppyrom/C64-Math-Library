name: Issue144 UDIV32-16 complete public-call source transplant screen

on:
  push:
    branches:
      - 'issue144-u3216-fullcall-source-transplant-*'
  pull_request:
    paths:
      - 'tools/issue144_u3216_fullcall_source_transplant_screen.py'
      - '.github/workflows/issue144-u3216-fullcall-transplant.yml'
  workflow_dispatch:

jobs:
  model-full-public:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native VICE emulator
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Real source-built V2 V3 V4 public DIV MOD after temporary source transplant
        run: python tools/issue144_u3216_fullcall_source_transplant_screen.py
      - name: Native x64sc public DIV MOD baseline-vs-transplant verification
        run: python tools/issue144_u3216_fullcall_native.py
