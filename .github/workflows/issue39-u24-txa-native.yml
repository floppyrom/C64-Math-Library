name: Issue39 native VICE U24 TXA full-resident release proof
on:
  push:
    branches: [issue39-u24-live-x-resident-integration]
    paths:
      - '.github/workflows/issue39-u24-txa-native.yml'
      - 'tools/native_issue39_u24_txa_resident.py'
      - 'tools/finalize_issue39_u24_txa_native.py'
  pull_request:
    paths:
      - '.github/workflows/issue39-u24-txa-native.yml'
      - 'tools/native_issue39_u24_txa_resident.py'
      - 'tools/finalize_issue39_u24_txa_native.py'
permissions:
  contents: write
jobs:
  native-old-new-five-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-u24-live-x-resident-integration
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch pinned official headless VICE release and verify its SHA256
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          command -v x64sc
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Single baseline and candidate native VICE smoke test
        run: python3 tools/native_issue39_u24_txa_resident.py --smoke-profile v1_balanced --smoke-operation MATH_UDIV24 --out /tmp/issue39_u24_vice_smoke.json
      - name: Full V1–V5 960 old/new actual emulator public-entry calls
        run: python3 tools/native_issue39_u24_txa_resident.py --out /tmp/issue39_u24_vice.json
      - name: Seal native proof and package metadata on the integration branch
        if: github.event_name == 'push'
        run: python3 tools/finalize_issue39_u24_txa_native.py /tmp/issue39_u24_vice.json
      - name: Commit native-qualified report only when it passes
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: publish native VICE verified U24 TXA resident integration'
          git push origin HEAD:issue39-u24-live-x-resident-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-native-vice-old-new-u24
          path: |
            /tmp/issue39_u24_vice_smoke.json
            /tmp/issue39_u24_vice.json
