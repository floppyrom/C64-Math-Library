name: Issue39 one-shot V5 narrow 32/32 release
on:
  push:
    branches:
      - issue39-v5-3232-narrow-delegate
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[issue39-v5-3232-published]')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic source, V5 hybrid reference and alternate images
        shell: bash
        run: |
          set -euo pipefail
          make reference
          make alternate
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          cp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg
          cmp v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg
      - name: Recompute all-profile exact arithmetic, same-input and old/new performance
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_unsigned_division.py
          python3 tools/validate_signed_division.py
          python3 tools/benchmark_unsigned_common_corpus.py
          python3 tools/benchmark_unsigned_3216_workloads.py
          python3 tools/audit_v5_3232_narrow_delegate.py
          python3 tools/audit_issue39_zero_high_bypass.py
          python3 tools/validate_v1_3216_unroll.py
          python3 tools/validate_udiv32_qone_bound.py
          python3 tools/validate_udiv32_q23_bound.py
      - name: Relocation, hybrid mixed-call and publication catalogs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_source_build.py all --build build_source/alternate --out validation/source_relocation
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_hybrid.py
          python3 tools/finalize_issue39_v5_3232_narrow.py
          python3 tools/publish_standalone_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
      - name: Seal package and remove temporary publication workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_source build_hybrid build_hybrid_repeat build_pareto tools/__pycache__
          rm -f .github/workflows/issue39-v5-3232-publish.yml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib
          paths=[Path(s) for s in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if s]
          paths += [Path('validation/review/ISSUE39_V5_32_32_NARROW_DELEGATION.json')]
          def seal():
              available=sorted({p for p in paths if p.is_file() and p.name!='SHA256SUMS.txt'},key=str)
              Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n' for p in available))
          seal()
          subprocess.run(['python3','tools/package_audit.py'],check=True)
          seal()
          saved=Path('validation/PACKAGE_AUDIT.json').read_bytes()
          subprocess.run(['python3','tools/package_audit.py'],check=True)
          assert saved==Path('validation/PACKAGE_AUDIT.json').read_bytes(),'unstable package seal'
          PY
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[issue39-v5-3232-published] Qualify and publish V5 narrow 32/32 delegation"
          git push origin HEAD:issue39-v5-3232-narrow-delegate
