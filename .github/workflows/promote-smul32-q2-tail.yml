name: Promote SMUL32 q2 tail correction

on:
  push:
    branches:
      - optimize/smul32-q2-tail-correction

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  promote:
    if: github.event.head_commit.message == 'trigger q2 tail promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize/smul32-q2-tail-correction
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build reference and alternate artifacts
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source

      - name: Promote V2-V4 reference resident images
        run: |
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          cp build_source/reference/v3_reu_512k/math_v3_reu_512k_source_built.prg v3_reu_512k/resident/math_v3_reu_512k_game_math.prg
          cp build_source/reference/v4_reu_16m/math_v4_reu_16m_source_built.prg v4_reu_16m/resident/math_v4_reu_16m_game_math.prg
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu v4_reu_16m/reu/c64_math_v4_16m_game_math.reu

      - name: Regenerate mirrors and validation evidence
        run: |
          python3 tools/generate_sources.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/publish_standalone_sources.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Write q2 tail-correction evidence and docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root=Path('.')
          sm=json.loads((root/'validation/review/SIGNED_MULTIPLY_VALIDATION.json').read_text())
          mr=json.loads((root/'validation/multiply_refresh/MULTIPLY_REFRESH_BENCHMARK.json').read_text())
          ps=('v2_pareto_fast','v3_reu_512k','v4_reu_16m')
          canon={p:sm['profiles'][p]['SMUL32'] for p in ps}
          ready={p:sm['profiles'][p]['SMUL32_READY'] for p in ps}
          shr={p:mr['profiles'][p]['MATH_SMUL32_SHR16'] for p in ps}

          evidence={
            'status':'PASS',
            'date':'2026-10-06',
            'optimization':'Tail-place the shared q2 signed upper-half correction after the alternate bounded-carry continuation, so the hot no-final-carry q2 path branches directly into correction and the carry path falls through. The four-row producer, q0/q1/NN arithmetic, public ABI and resource contract are unchanged.',
            'resource_contract':{
              'zp_bytes':31,
              'persistent_stack_page_bytes':0,
              'producer_changed':False,
              'public_abi_changed':False,
              'q2_block_bytes':291
            },
            'canonical':canon,
            'shared_20324_case_corpus':{
              'description':'361 signed edge pairs plus 19,963 deterministic random pairs, identical across V2/V3/V4.',
              'baseline_mean_cycles':720.5663747293839,
              'candidate_mean_cycles':720.2233320212557,
              'delta_cycles':-0.34304270812822324,
              'min_cycles':630,
              'baseline_max_cycles':841,
              'candidate_max_cycles':838,
              'errors':0,
              'cycle_vectors_identical_across_v2_v3_v4':True
            },
            'q2_profile_20070':{
              'description':'70 structured q2 edge pairs plus 20,000 deterministic random X<0,Y>=0 pairs.',
              'baseline_mean_cycles':727.560538,
              'candidate_mean_cycles':726.469507,
              'delta_cycles':-1.091031,
              'min_cycles':668,
              'baseline_max_cycles':840,
              'candidate_max_cycles':838,
              'errors':0
            },
            'shifted_derivative':shr,
            'ready':ready,
            'validation':{
              'signed_multiply_calls':264999,
              'multiply_refresh_calls':415078,
              'turbo_relocation':'PASS',
              'turbo_boundary_sweep':'PASS'
            }
          }
          (root/'validation/review/SMUL32_Q2_TAIL_CORRECTION.json').write_text(json.dumps(evidence,indent=2)+'\n')

          new_triple=' / '.join(f"{canon[p]['mean_cycles']:.6f}" for p in ps)
          old_triple='712.935243 / 713.365297 / 713.431714'
          new_ready=' / '.join(f"{ready[p]['mean_cycles']:.6f}" for p in ps)
          new_shr=f"{shr['v2_pareto_fast']['mean_cycles']:.6f}"
          new_shr_range=f"{shr['v2_pareto_fast']['min_cycles']}–{shr['v2_pareto_fast']['max_cycles']}"

          p=root/'docs/SMUL32_FAST31_V2.md'
          t=p.read_text()
          t=t.replace(old_triple,new_triple)
          t=t.replace('**V2: 712.935243 cycles**',f"**V2: {canon['v2_pareto_fast']['mean_cycles']:.6f} cycles**")
          t=t.replace('**V3: 713.365297 cycles**',f"**V3: {canon['v3_reu_512k']['mean_cycles']:.6f} cycles**")
          t=t.replace('**V4: 713.431714 cycles**',f"**V4: {canon['v4_reu_16m']['mean_cycles']:.6f} cycles**")
          t=t.replace('**720.566375 cycles in V2, V3 and V4**','**720.223332 cycles in V2, V3 and V4**')
          t=t.replace('**782.219674 cycles mean (695–906)**',f"**{new_shr} cycles mean ({new_shr_range})**")
          t=t.replace('**725.257812 / 725.672852 / 723.503906**',f"**{new_ready}**")
          marker='The fixed-point derivative'
          para=(
            'A further **q2 tail-placement follow-up** moves the shared signed upper-half correction '
            'after the alternate bounded-carry continuation. This removes the hot alternate-path jump '
            'and converts its final carry test into a same-page fall-through without changing the '
            'producer or correction arithmetic. On the same shared 20,324-case corpus the mean falls '
            'from **720.566375 to 720.223332 cycles** (−0.343043), with identical cycle vectors in '
            'V2/V3/V4 and worst case **841 → 838**. A focused 20,070-case q2 corpus improves from '
            '**727.560538 to 726.469507 cycles** (−1.091031). The block remains 291 bytes and the '
            '31-ZP / zero-persistent-stack contract is unchanged.\n\n'
          )
          if 'q2 tail-placement follow-up' not in t:
            loc=t.find(marker)
            if loc>=0: t=t[:loc]+para+t[loc:]
          p.write_text(t)

          living=[
            root/'PERFORMANCE.md',
            root/'docs/SMUL32_COMPACT126.md',
            root/'docs/VERSION_SELECTION.md',
            root/'docs/SIGNED_IMPLEMENTATIONS.md',
            root/'v2_pareto_fast/README.md',
            root/'v3_reu_512k/README.md',
            root/'v4_reu_16m/README.md',
          ]
          for p in living:
            if not p.exists(): continue
            t=p.read_text().replace(old_triple,new_triple)
            t=t.replace('720.566375 cycles','720.223332 cycles')
            p.write_text(t)

          p=root/'PERFORMANCE.md'
          t=p.read_text()
          start=t.find('**Cross-profile note:**')
          if start>=0:
            end=t.find('\n\n| Typed routine |',start)
            if end>=0:
              note=(
                '**Cross-profile note:** the small V2/V3/V4 spread in the canonical SMUL32 means '
                'comes from profile-specific deterministic random seeds. On one identical '
                '**20,324-case** corpus, all three current implementations are cycle-identical at '
                '**720.223332 cycles**, with identical per-call cycle vectors. The spread is not '
                'a relocation or REU penalty.'
              )
              t=t[:start]+note+t[end:]
          p.write_text(t)

          p=root/'CHANGELOG.md'
          t=p.read_text()
          entry=(
            '## 2026-10-06 — SMUL32 q2 correction tail-placement\n\n'
            '- Tail-placed the shared FAST31 q2 signed correction after the alternate bounded-carry continuation in V2/V3/V4; the four-row producer and q0/q1/NN paths are unchanged.\n'
            f'- Canonical SMUL32 means improve to **{new_triple} cycles**; min remains **630** and max improves **841 → 838**.\n'
            '- On the identical 20,324-case corpus all three profiles remain cycle-identical at **720.223332 cycles**, another **0.343043 cycles/call** below the previous q2-bounded release.\n'
            f'- MATH_SMUL32_SHR16 is **{new_shr} cycles mean ({new_shr_range})**; the 31-ZP / zero-persistent-stack contract and 291-byte q2 block are unchanged.\n'
            '- Full signed-multiply, multiply-refresh, published-source, deterministic rebuild, Turbo relocation/boundary and package gates pass.\n\n'
          )
          if 'SMUL32 q2 correction tail-placement' not in t:
            p.write_text(entry+t)

          p=root/'CSDB_CHANGELOG.txt'
          t=p.read_text()
          entry=(
            '2026-10-06 SMUL32 Q2 CORRECTION TAIL-PLACEMENT\n'
            '- V2/V3/V4 move the q2 signed upper-half correction behind the alternate bounded-carry continuation, removing its hot-path jump.\n'
            f'- Canonical SMUL32 means: {new_triple}; min 630, max 838.\n'
            '- Shared 20,324-case mean: 720.223332 in all three profiles (-0.343043 versus the previous q2-bounded release).\n'
            f'- SMUL32_SHR16: {new_shr} ({new_shr_range}); q2 remains 291 bytes, 31 ZP, zero persistent stack.\n\n'
          )
          if 'SMUL32 Q2 CORRECTION TAIL-PLACEMENT' not in t:
            p.write_text(entry+t)
          PY

      - name: Regenerate indexes after documentation and evidence update
        run: |
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py

      - name: Refresh release hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads((root/'RELEASE_STATUS.json').read_text())
          for p in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              s['reference_prg_sha256'][p]=sha(root/'build_source/reference'/p/f'math_{p}_source_built.prg')
              s['alternate_prg_sha256'][p]=sha(root/'build_source/alternate'/p/f'math_{p}_source_built.prg')
          for p in ('v3_reu_512k','v4_reu_16m'):
              s['reference_reu_sha256'][p]=sha(root/'build_source/reference'/p/f'c64_math_{p}_source_built.reu')
              s['alternate_reu_sha256'][p]=sha(root/'build_source/alternate'/p/f'c64_math_{p}_source_built.reu')
          s['date']='2026-10-06'
          (root/'RELEASE_STATUS.json').write_text(json.dumps(s,indent=2)+'\n')
          PY

      - name: Verify promoted binaries and public signed sources
        run: |
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Remove promotion scaffolding
        run: |
          rm -f .github/workflows/research-smul32-q2-tail.yml
          rm -f .github/workflows/promote-smul32-q2-tail.yml
          rm -f tools/bench_smul32_q2_tail_candidate.py
          rm -rf build_source

      - name: Refresh package manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py

      - name: Commit promoted q2 tail artifacts
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No promotion changes to commit"
          else
            git commit -m "Promote SMUL32 q2 correction tail-placement"
            git push origin HEAD:optimize/smul32-q2-tail-correction
          fi
