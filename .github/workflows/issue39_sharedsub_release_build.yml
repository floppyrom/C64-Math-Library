name: Issue39 one-shot V1 24by8 shared-subtraction release build
on:
  push:
    branches: [issue39-v1-24by8-sharedsub-integrated-release]
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and certify source-backed V1 public DIV/MOD
        shell: bash
        run: |
          set -euxo pipefail
          make reference
          cp build_source/reference/v1_balanced/math_v1_balanced_source_built.prg v1_balanced/resident/math_v1_balanced_game_math.prg
          make alternate
          python3 tools/validate_source_build.py all --build build_source/alternate --out validation/source_relocation
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def h(p):return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          assert h('v1_balanced/resident/math_v1_balanced_game_math.prg')=='28c7039614f77a2b3c9dd4d3b6ea4743b4e839eaee280bf6ee12285b18cad4b0'
          assert h('v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg')=='5191e44263c24c617a4d5ddc490b3d5fbe7f87c5ac0835af28294fdbc6f9d222'
          print('EXACT RELEASE SOURCE BUILD HASHES MATCH',flush=True)
          PY
          python3 tools/screen_issue39_v1_24by8_shared_subtraction.py --out validation/review/ISSUE39_V1_24BY8_SHARED_SUBTRACTION_PAIRED.json
          python3 tools/benchmark_unsigned_common_corpus.py
          python3 tools/audit_issue39_unsigned_small_workloads.py
          python3 tools/validate_unsigned_division.py
          python3 tools/validate_signed_division.py
          python3 tools/publish_standalone_sources.py
          python3 tools/finalize_issue39_v1_24by8_sharedsub_release.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
      - name: Seal lean release package and commit verified artifacts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          rm .github/workflows/issue39_sharedsub_release_build.yml
          make clean
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          audit=root/'validation/PACKAGE_AUDIT.json'
          manifest=root/'SHA256SUMS.txt'
          data=json.loads(audit.read_text())
          # The audit JSON is itself part of the sealed lean package, so
          # iterate byte totals to a fixed point before regenerating SHA256SUMS.
          for _ in range(10):
              all_files=[p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
              data['summary']['file_count_excluding_checksum']=len(all_files)-1
              data['summary']['uncompressed_bytes_excluding_checksum']=sum(p.stat().st_size for p in all_files if p!=manifest)
              target=next(c for c in data['checks'] if c['check']=='sha256_manifest_current')
              target['detail']={'bad':[],'missing':[],'extra':[],'entries':len(all_files)-1}
              new_text=json.dumps(data,indent=2)+'\n'
              if audit.read_text()==new_text:break
              audit.write_text(new_text)
          all_files=sorted([p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p!=manifest],key=lambda p:p.as_posix())
          manifest.write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n' for p in all_files))
          assert len(all_files)==data['summary']['file_count_excluding_checksum']
          PY
          python3 tools/package_audit.py
          # package_audit refreshes its own JSON. The manifest must be
          # re-sealed *after* that write, then the final audit rechecked.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          manifest=root/'SHA256SUMS.txt'
          entries=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p!=manifest),key=lambda p:p.as_posix())
          manifest.write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n' for p in entries))
          print('SEALED SHA256SUMS',len(entries),'files',flush=True)
          PY
          python3 tools/package_audit.py
          git add -A
          git status --short
          git commit -m "issue39: publish integrated V1 shared-subtract 69-byte 24/8 core, benchmarks, catalogs and checksums"
          git push origin HEAD:issue39-v1-24by8-sharedsub-integrated-release
