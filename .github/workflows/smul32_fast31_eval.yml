name: Debug FAST31 persistent-ZP trace
on:
  push:
    branches: [smul32-fast31-v3-profile-integration]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smul32-fast31-persistent-zp-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make reference
      - name: Find static-trace predecessor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0,'tools')
          from mini6502 import REV,SIZE,CPU
          ps=['v2_pareto_fast','v3_reu_512k','v4_reu_16m']
          for p in ps:
              d=Path('build_source/reference')/p
              m=json.loads((d/'source_build_manifest.json').read_text())
              b=(d/m['output_prg']).read_bytes(); ld=b[0]|b[1]<<8
              mem=bytearray(65536);mem[ld:ld+len(b)-2]=b[2:]
              reu=bytearray((d/m['reu_image']['file']).read_bytes()) if m.get('reu_image') else None
              c=CPU(mem,reu=reu);c.d=0;c.call(int(m['math_init'][1:],16),2_000_000);mem=c.mem
              for name,h in m['public_entries'].items():
                  start=int(h[1:],16); todo=[(start,None)]; seen=set()
                  bad=False
                  while todo:
                      pc,prev=todo.pop()
                      if pc in seen: continue
                      seen.add(pc); oc=mem[pc]
                      if oc not in REV:
                          print('BAD',p,name,'pc=%04X'%pc,'op=%02X'%oc,'prev=%04X'%prev if prev is not None else 'prev=None')
                          if prev is not None: print('PREVBYTES',bytes(mem[prev:prev+8]).hex())
                          bad=True;break
                      op,mode=REV[oc]; sz=SIZE[mode]; nxt=(pc+sz)&0xffff
                      if mode=='rel':
                          dlt=mem[(pc+1)&0xffff];dlt=dlt-256 if dlt&128 else dlt;t=(nxt+dlt)&0xffff
                          if pc in (0x4124,0x41AC): todo.append((t,pc))
                          else: todo.extend(((nxt,pc),(t,pc)))
                      elif op=='jmp':
                          if mode=='abs': todo.append((mem[pc+1]|mem[pc+2]<<8,pc))
                      elif op=='jsr':
                          todo.extend(((nxt,pc),(mem[pc+1]|mem[pc+2]<<8,pc)))
                      elif op not in ('rts','rti','brk'): todo.append((nxt,pc))
                  if bad: break
          PY
