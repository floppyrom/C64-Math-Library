name: Diagnose SMUL32 V2-V4 timing
on:
  push:
    branches: [smul32-fast31-v3-profile-integration]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smul32-fast31-v2-arithmetic-transplant
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make reference
      - name: Promote candidate PRGs in workspace
        run: |
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          cp build_source/reference/v3_reu_512k/math_v3_reu_512k_source_built.prg v3_reu_512k/resident/math_v3_reu_512k_game_math.prg
          cp build_source/reference/v4_reu_16m/math_v4_reu_16m_source_built.prg v4_reu_16m/resident/math_v4_reu_16m_game_math.prg
      - name: Compare identical SMUL32 input corpus
        run: |
          python3 - <<'PY'
          import random,sys
          sys.path.insert(0,'tools')
          import validate_signed_multiply as v
          profiles=['v2_pareto_fast','v3_reu_512k','v4_reu_16m']
          e=v.edge_values(32)
          rng=random.Random(0x5A170020)
          pairs=[(x,y) for x in e for y in e]+[(rng.randrange(1<<32),rng.randrange(1<<32)) for _ in range(2048)]
          allcy={}
          for p in profiles:
              cpu,api=v.load_profile(p)
              out=v.test_entry(cpu,api['MATH_SMUL32'],32,pairs)
              print('SHARED',p,out)
              cy=[]
              for x,y in pairs:
                  v.wr(cpu.mem,0xC000,x,4);v.wr(cpu.mem,0xC004,y,4)
                  cy.append(cpu.call(api['MATH_SMUL32'],2_000_000))
              allcy[p]=cy
          base=allcy[profiles[0]]
          for p in profiles[1:]:
              ds=[b-a for a,b in zip(base,allcy[p])]
              from collections import Counter
              print('DELTA',p,'mean',sum(ds)/len(ds),'counts',sorted(Counter(ds).items()),'different',sum(d!=0 for d in ds))
          PY
