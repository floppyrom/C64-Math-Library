name: Finalize FAST31 persistent-ZP metadata
on:
  push:
    branches: [smul32-fast31-v3-profile-integration]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smul32-fast31-persistent-zp-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate public indexes
        run: |
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
      - name: Refresh package metadata and checksums
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          def rewrite():
              rows=[]
              for p in subprocess.check_output(['git','ls-files'],text=True).splitlines():
                  if p=='SHA256SUMS.txt': continue
                  q=Path(p)
                  if q.is_file(): rows.append(f"{hashlib.sha256(q.read_bytes()).hexdigest()}  {p}")
              Path('SHA256SUMS.txt').write_text('\n'.join(sorted(rows))+'\n')
          rewrite()
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          rows=[]
          for p in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              if p=='SHA256SUMS.txt': continue
              q=Path(p)
              if q.is_file(): rows.append(f"{hashlib.sha256(q.read_bytes()).hexdigest()}  {p}")
          Path('SHA256SUMS.txt').write_text('\n'.join(sorted(rows))+'\n')
          PY
          python3 tools/package_audit.py
      - name: Commit final metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Finalize FAST31 persistent-pointer metadata"
          git push origin HEAD:smul32-fast31-persistent-zp-integration
