name: Finalize FAST31 documentation metadata
on:
  push:
    branches: [smul32-fast31-v3-profile-integration]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smul32-fast31-persistent-zp-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh checksum and package audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          def refresh():
              rows=[]
              for p in subprocess.check_output(['git','ls-files'],text=True).splitlines():
                  if p=='SHA256SUMS.txt': continue
                  q=Path(p)
                  if q.is_file(): rows.append(f"{hashlib.sha256(q.read_bytes()).hexdigest()}  {p}")
              Path('SHA256SUMS.txt').write_text('\n'.join(sorted(rows))+'\n')
          refresh()
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          rows=[]
          for p in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              if p=='SHA256SUMS.txt': continue
              q=Path(p)
              if q.is_file(): rows.append(f"{hashlib.sha256(q.read_bytes()).hexdigest()}  {p}")
          Path('SHA256SUMS.txt').write_text('\n'.join(sorted(rows))+'\n')
          PY
          python3 tools/package_audit.py
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.txt validation/PACKAGE_AUDIT.json
          if git diff --cached --quiet; then
            echo "No metadata changes needed"
          else
            git commit -m "Refresh FAST31 documentation metadata"
            git push origin HEAD:smul32-fast31-persistent-zp-integration
          fi
