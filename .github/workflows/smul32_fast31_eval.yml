name: SMUL32 FAST31 persistent-ZP evaluation
# rerun after persistent-init generator fix
on:
  push:
    branches: [smul32-fast31-v3-profile-integration]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smul32-fast31-persistent-zp-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reference and alternate maps
        run: |
          make reference
          make alternate
      - name: Validate alternate public API and mixed calls
        run: python3 tools/validate_source_build.py all --build build_source/alternate --out validation/fast31_persistent_eval
      - name: Validate Turbo ZP restore
        run: python3 tools/validate_turbo_relocation.py
      - name: Benchmark affected multiply entries
        run: python3 tools/evaluate_smul32_fast31_persistent.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast31-persistent-zp-eval
          path: |
            validation/review/SMUL32_FAST31_PERSISTENT_ZP_EVAL.json
            validation/fast31_persistent_eval/
            validation/turbo_relocation/
            build_source/reference/v2_pareto_fast/*.prg
            build_source/reference/v3_reu_512k/*.prg
            build_source/reference/v4_reu_16m/*.prg
            relocatable_source/v2_pareto_fast/math_relocatable.asm
            relocatable_source/v3_reu_512k/math_relocatable.asm
            relocatable_source/v4_reu_16m/math_relocatable.asm
