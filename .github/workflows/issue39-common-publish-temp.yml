name: One-shot common-input unsigned publication
on:
  push:
    branches: [issue39-common-input-unsigned-rankings]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the common-input evidence against current binaries
        run: |
          python3 tools/benchmark_unsigned_common_corpus.py
          python3 tools/publish_unsigned_common_ranking.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          git diff --exit-code -- validation/review/UNSIGNED_DIVMOD_COMMON_CORPUS.json benchmarks/UNSIGNED_COMMON_PROFILE_RESULTS.csv
      - name: Remove one-shot job and seal package
        run: |
          rm .github/workflows/issue39-common-publish-temp.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          root=Path('.')
          def seal():
            paths=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=str)
            (root/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n' for p in paths))
          for _ in range(6):
            seal()
            subprocess.run(['python3','tools/package_audit.py'],check=True)
          seal()
          PY
          python3 tools/package_audit.py
      - name: Commit synchronized documentation, benchmarks and seal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish 11-routine common-corpus rankings and sealed release evidence'
          git push origin HEAD:issue39-common-input-unsigned-rankings
