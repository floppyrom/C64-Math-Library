name: Issue39 UMUL24 no-carry CLC native VICE production qualification
on:
  push:
    branches: [issue39-v2v4-umul24-nocarry-clc-production]
    paths:
      - tools/native_issue39_v2v4_umul24_nocarry_clc_release.py
      - tools/finalize_issue39_v2v4_umul24_nocarry_clc_native.py
      - .github/workflows/issue39-umul24-nocarry-clc-native.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resident-native-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-v2v4-umul24-nocarry-clc-production
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SHA256 pinned native x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Execute 576 old/new native VICE UMUL24 and SMUL24 public calls
        run: python3 tools/native_issue39_v2v4_umul24_nocarry_clc_release.py
      - name: Seal native evidence, docs, statuses and checksum package
        run: python3 tools/finalize_issue39_v2v4_umul24_nocarry_clc_native.py
      - name: Commit native-qualified source release only after proof succeeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: seal native VICE V2-V4 UMUL24 CLC source release'
          git push origin HEAD:issue39-v2v4-umul24-nocarry-clc-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-umul24-nocarry-clc-native
          path: validation/review/ISSUE39_V2V4_UMUL24_NOCARRY_CLC_NATIVE_2026-10-13.json
