name: Temporary repository export

on:
  push:
    branches:
      - tmp-chatgpt-export-20260920

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact current main snapshot
        run: |
          git fetch origin c99dfdff15077b2b908f91246ab2ddfe363e5d98
          git archive --format=zip --output=c64ml-main.zip c99dfdff15077b2b908f91246ab2ddfe363e5d98
      - uses: actions/upload-artifact@v4
        with:
          name: c64ml-main-snapshot-c99dfdff
          path: c64ml-main.zip
