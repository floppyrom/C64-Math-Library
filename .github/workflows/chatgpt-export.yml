name: Temporary repository export

on:
  push:
    branches:
      - tmp-chatgpt-export-20260920

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact current main snapshot
        run: |
          git fetch origin cfc89cfc2f0208a2ea4f21b10de02974b9ee65bb
          git archive --format=zip --output=c64ml-main.zip cfc89cfc2f0208a2ea4f21b10de02974b9ee65bb
      - uses: actions/upload-artifact@v4
        with:
          name: c64ml-main-snapshot-cfc89cfc
          path: c64ml-main.zip
