name: Turbo16 REU swap source experiment
on:
  pull_request:
    paths:
      - 'relocatable_source/turbo/turbo16_swap_controller.asm'
      - 'tools/reu_turbo16_swap_experiment.py'
      - 'tools/test_reu_turbo16_swap_experiment.py'
      - 'docs/REU_TURBO16_SWAP_PROOF.md'
      - '.github/workflows/reu-turbo16-swap-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-assembled-swap-two-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove REU SWAP with caller ZP restored and correct math
        run: python3 -m unittest discover -s tools -p 'test_reu_turbo16_swap_experiment.py' -v
      - name: Export test evidence (not native hardware qualification)
        run: |
          python3 tools/reu_turbo16_swap_experiment.py --out build/turbo16-swap-proof
          python3 -c 'import json,pathlib; p=json.loads(pathlib.Path("build/turbo16-swap-proof/turbo16_reu_swap_cpu_model.json").read_text()); assert p["arithmetic_calls"]==224 and not p["native_vice_qualified"]'
      - uses: actions/upload-artifact@v4
        with:
          name: turbo16-reu-swap-cpu-model-not-native
          path: build/turbo16-swap-proof/
          retention-days: 14
      - name: Verify locked source package
        run: |
          rm -rf build/turbo16-swap-proof
          python3 tools/package_audit.py
          git diff --exit-code -- validation/PACKAGE_AUDIT.json
