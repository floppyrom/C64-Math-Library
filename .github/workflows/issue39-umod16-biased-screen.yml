name: Issue39 UMOD16 biased donor independent screen

on:
  push:
    branches:
      - issue39-umod16-biased-resident-screen
    paths:
      - '.github/workflows/issue39-umod16-biased-screen.yml'
      - 'tools/screen_issue39_umod16_biased_standalone.py'
  pull_request:
    paths:
      - 'tools/screen_issue39_umod16_biased_standalone.py'
      - '.github/workflows/issue39-umod16-biased-screen.yml'

permissions:
  contents: write

jobs:
  same-input-resident-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare original OptiSearch-derived UMOD16 against V2-V5 APIs
        run: python3 tools/screen_issue39_umod16_biased_standalone.py --out /tmp/issue39_umod16_biased.json
      - uses: actions/upload-artifact@v4
        with:
          name: issue39-umod16-biased-current-main-screen
          path: /tmp/issue39_umod16_biased.json
      - name: Publish qualified research finding and seal source package
        run: python3 tools/finalize_issue39_umod16_biased_screen.py /tmp/issue39_umod16_biased.json
      - name: Independently verify package and source catalogs
        run: |
          python3 tools/package_audit.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
      - name: Commit qualified research assets to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "issue39: certify UMOD16 biased current-main no-default screen"
            git push origin HEAD:issue39-umod16-biased-resident-screen
          fi
