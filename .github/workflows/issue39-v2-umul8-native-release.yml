name: Issue39 V2 UMUL8 installed native VICE source release
on:
  push:
    branches: [issue39-umul8-direct-output-public-screen]
    paths:
      - tools/native_issue39_v2_umul8_source_release.py
      - tools/finalize_issue39_v2_umul8_native.py
      - .github/workflows/issue39-v2-umul8-native-release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-paired-public-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-umul8-direct-output-public-screen
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Pin native x64sc headless VICE image and SHA
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Native source-installed old/new V2 UMUL8 full resident and public ABI proof
        run: python3 tools/native_issue39_v2_umul8_source_release.py
      - name: Seal native evidence, both changelogs, documentation, SHA256 and package status
        run: python3 tools/finalize_issue39_v2_umul8_native.py
      - name: Commit only after real native VICE and package proof both pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: seal V2 UMUL8 native old/new ABI and source-release evidence'
          git push origin HEAD:issue39-umul8-direct-output-public-screen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-v2-umul8-native-repro
          path: validation/review/ISSUE39_V2_UMUL8_DIRECTOUT_NATIVE.json
