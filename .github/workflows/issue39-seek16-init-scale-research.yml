name: Issue39 SEEK16 Euclidean init scaler research
on:
  push:
    branches: [issue39-seek16-init-scale-loop-research-20261014]
    paths:
      - .github/workflows/issue39-seek16-init-scale-research.yml
      - tools/seek_kernel.py
      - tools/research_issue39_seek16_scale_loop.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare-seek-init-five-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-seek16-init-scale-loop-research-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate candidate seek kernels and both source maps
        run: |
          python3 tools/generate_seek_sources.py
          python3 tools/generate_sources.py
          for kind in reference alternate; do
            python3 tools/assemble_sources.py --profile all --config-kind "$kind"
            python3 tools/build_hybrid.py --config-kind "$kind"
          done
      - name: Compare old and new SEEK16 init state, flags, slot, resources and cycles
        run: python3 tools/research_issue39_seek16_scale_loop.py
      - name: Validate source generator and representative seek movement correctness
        run: |
          python3 tools/generate_seek_sources.py --check
          python3 tools/test_mini6502_illegal.py
      - name: Seal research evidence with unchanged published residents
        run: |
          python3 - <<'PY'
          import subprocess,sys
          from tools.stage_issue39_v1_3216_ool_release import reseal
          subprocess.run(["make","clean"],check=True)
          for _ in range(3):
              reseal()
              subprocess.run([sys.executable,"tools/package_audit.py"],check=True)
          PY
      - name: Commit generated candidate sources and research evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: save qualified SEEK16 Euclidean init scaler research'
          git push origin HEAD:issue39-seek16-init-scale-loop-research-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-seek16-scaler-research
          path: validation/review/ISSUE39_SEEK16_SCALE_LOOP_RESEARCH_2026-10-14.json
