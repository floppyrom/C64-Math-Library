name: Research SMUL32 q2 tail correction

on:
  push:
    branches:
      - optimize/smul32-q2-tail-correction

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all source profiles
        run: |
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source
      - name: Benchmark V2-V4 q2 tail candidate
        run: python3 tools/bench_smul32_q2_tail_candidate.py
