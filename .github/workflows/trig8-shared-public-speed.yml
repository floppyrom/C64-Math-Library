name: Historical shared V1-V5 trig public-speed qualification

on:
  pull_request:
    paths:
      - 'tools/selective_speed_trig8.py'
      - 'tools/test_selective_trig8_speed.py'
      - 'tools/native_selective_trig8_speed.py'
      - 'tools/selective_linker.py'
      - '.github/workflows/trig8-shared-public-speed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all 256 phases for all three V1-V5 source-locked public kernels
        run: |
          python3 -m compileall -q tools/selective_speed_trig8.py tools/test_selective_trig8_speed.py tools/native_selective_trig8_speed.py tools/selective_linker.py
          python3 tools/selective_speed_trig8.py
          python3 -m unittest discover -s tools -p 'test_selective_trig8.py' -v
          python3 -m unittest discover -s tools -p 'test_selective_trig8_speed.py' -v

  native-vice:
    needs: public-model
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install pinned headless VICE r46284 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned native VICE
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Confirm all six complete public entries share one immutable sine table
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_trig8_speed.py
