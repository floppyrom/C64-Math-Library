name: Finish MULDIV16 relocation fix

on:
  push:
    branches: [ promote/muldiv16-stable-20261007 ]
    paths:
      - '.github/workflows/muldiv16-finish-relocation.yml'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/muldiv16-stable-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate canonical fixed-profile configs and sources
        run: |
          rm -f .github/workflows/muldiv16-finish-relocation.yml
          rm -f .github/workflows/muldiv16-reloc-survey.yml
          python3 tools/generate_sources.py
      - name: Add relocatable SMUL8 sum planes to V5 configs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('relocatable_source/v5_hybrid_lowzp')
          for name,val in (
              ('math_config.inc','$9C00'),
              ('math_config_reference.inc','$9C00'),
              ('math_config_alternate.inc','$1000')):
              p=root/name
              s=p.read_text()
              line=f'SMUL8_SUM_BASE = {val}'
              if 'SMUL8_SUM_BASE' in s:
                  import re
                  s=re.sub(r'^SMUL8_SUM_BASE\s*=.*$',line,s,flags=re.M)
              else:
                  import re
                  s,n=re.subn(r'^(TURBO32_ZP_BASE\s*=.*)
          PY
      - name: Build reference and alternate maps
        run: |
          rm -rf build_source build_hybrid
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
      - name: Validate both maps and MULDIV16
        run: |
          python3 tools/validate_source_build.py all --build build_source/reference --out /tmp/ref
          python3 tools/validate_source_build.py all --build build_source/alternate --out /tmp/alt
          python3 tools/validate_muldiv16.py
          python3 tools/validate_hybrid.py --random-per-family 500 --mixed 500
      - name: Commit relocation-safe generated state
        run: |
          rm -rf build_source build_hybrid build_hybrid_repeat build_pareto
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finish relocation-safe MULDIV16 and SMUL8 mapping"
          git push origin HEAD:promote/muldiv16-stable-20261007
