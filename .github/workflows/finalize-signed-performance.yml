name: Finalize signed performance table

on:
  push:
    branches:
      - opt/signed-divmod-campaign-20261008

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update PERFORMANCE signed division rows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,re
          profiles=['v1_balanced','v2_pareto_fast','v3_reu_512k','v4_reu_16m','v5_hybrid_lowzp']
          wanted={'MATH_SDIV8','MATH_SDIV16','MATH_SDIV24','MATH_SDIV32_16','MATH_SDIV32_32','MATH_SMOD8','MATH_SMOD16','MATH_SMOD24','MATH_SMOD32_16','MATH_SMOD32_32','MATH_SDIV16_SHL8'}
          rows=list(csv.DictReader(open('docs/CONSOLIDATED_ROUTINE_TABLE.csv',newline='')))
          by={(r['profile'],r['routine']):r for r in rows if r['api_class']=='stable'}
          p=Path('PERFORMANCE.md'); out=[]
          pat=re.compile(r'^\\| `(MATH_[A-Z0-9_]+)` \\| `([^`]+)` \\|')
          for line in p.read_text().splitlines():
              m=pat.match(line)
              if m and m.group(1) in wanted:
                  n,canon=m.group(1),m.group(2)
                  vals=[f"{float(by[(prof,n)]['mean_cycles']):.6f}" for prof in profiles]
                  line='| `'+n+'` | `'+canon+'` | '+' | '.join(vals)+' |'
              out.append(line)
          p.write_text('\n'.join(out)+'\n')
          PY
          rm .github/workflows/finalize-signed-performance.yml
      - name: Refresh checksum package contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          files=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          with open('SHA256SUMS.txt','w') as out:
              for p in files:
                  out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n")
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          files=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          with open('SHA256SUMS.txt','w') as out:
              for p in files:
                  out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n")
          PY
          python3 tools/package_audit.py
      - name: Commit performance publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish signed DIV/MOD performance table"
          git push
