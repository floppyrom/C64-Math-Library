name: Issue39 one-shot V1 32/16 publication
on:
  push:
    branches:
      - issue39-v1-3216-unroll
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[issue39-3216-published]')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-overlay candidate from unchanged main and determinism
        shell: bash
        run: |
          set -euo pipefail
          make reference
          make alternate
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          cp build_source/reference/v1_balanced/math_v1_balanced_source_built.prg v1_balanced/resident/math_v1_balanced_game_math.prg
          cp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg
          make reference
          make alternate
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          cmp v1_balanced/resident/math_v1_balanced_game_math.prg build_source/reference/v1_balanced/math_v1_balanced_source_built.prg
          cmp v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg
      - name: All-profile correctness, comparable cycles, workloads and permanent paired test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_unsigned_division.py
          python3 tools/validate_signed_division.py
          python3 tools/benchmark_unsigned_common_corpus.py
          python3 tools/benchmark_unsigned_3216_workloads.py
          python3 tools/validate_v1_3216_unroll.py
          python3 tools/validate_udiv32_qone_bound.py
          python3 tools/validate_udiv32_q23_bound.py
      - name: Alternate relocation, mixed-call V5 and publication sources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_source_build.py all --build build_source/alternate --out validation/source_relocation
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_hybrid.py
          python3 tools/finalize_issue39_3216_unroll.py
          python3 tools/publish_standalone_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
      - name: Remove one-shot workflow, verify all hashes and push exact published branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_source build_hybrid build_hybrid_repeat build_pareto tools/__pycache__
          rm -f .github/workflows/issue39-3216-publish.yml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib
          paths=[Path(s) for s in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if s]
          paths.append(Path('validation/review/V1_UDIV32_16_DUAL_UNROLL.json'))
          def seal():
              available=sorted({p for p in paths if p.is_file() and p.name!='SHA256SUMS.txt'},key=str)
              Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n' for p in available))
          seal()
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib
          paths=[Path(s) for s in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if s]
          paths.append(Path('validation/review/V1_UDIV32_16_DUAL_UNROLL.json'))
          avail=sorted({p for p in paths if p.is_file() and p.name!='SHA256SUMS.txt'},key=str)
          Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n' for p in avail))
          saved=Path('validation/PACKAGE_AUDIT.json').read_bytes()
          subprocess.run(['python3','tools/package_audit.py'],check=True)
          assert saved==Path('validation/PACKAGE_AUDIT.json').read_bytes(),'unstable package seal'
          PY
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[issue39-3216-published] Publish validated V1 32/16 dual-loop unroll"
          git push origin HEAD:issue39-v1-3216-unroll
