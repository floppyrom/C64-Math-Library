name: Issue39 ISQRT16/32 manual seed-table research
on:
  push:
    branches: [issue39-integer-roots-seedtable-screen]
    paths:
      - 'tools/screen_issue39_isqrt16_seed_square.py'
      - 'tools/research_issue39_root_memory_pages.py'
      - '.github/workflows/issue39-isqrt-seed-square.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  square-root-public-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan zero-filled resident pages for potential table/code relocation
        run: python3 tools/research_issue39_root_memory_pages.py
      - name: Verify published square planes, public ISQRT16 and ISQRT32 caller composition
        run: |
          python3 tools/screen_issue39_isqrt16_seed_square.py --out /tmp/issue39_root_seed_screen.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-root-seed-screen
          path: /tmp/issue39_root_seed_screen.json

  exhaustive-v2-isqrt16:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustively compare 65536 rooted operands on exact V2 resident public entry
        run: |
          python3 tools/screen_issue39_isqrt16_seed_square.py --profile v2_pareto_fast --exhaustive16 --random32 0 --out /tmp/issue39_isqrt16_exhaustive_v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-isqrt16-exhaustive-v2
          path: /tmp/issue39_isqrt16_exhaustive_v2.json
