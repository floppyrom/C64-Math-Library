name: Issue144 all-signed SHR16 exclusive direct-slice
on:
  push:
    branches: [issue144-signed-full-domain-exclusive-20261015, issue144-signed-exclusive-five-profiles-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cpu-native-public-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full unrestricted signed 2409 pairs each V2 V3 V4 with actual assembled BEGIN END
        run: python3 tools/issue144_signed_full_exclusive.py --limit 2409
      - name: Install checksum-pinned headless VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Native VICE exact original and patched public signed SHR16 for all sign quadrants
        run: python3 tools/native_issue144_signed_full_exclusive.py
      - name: Stage optional-only research with both changelogs and 30-check checksum seal
        if: github.event_name == 'push'
        run: python3 tools/stage_issue144_signed_full_exclusive.py
      - name: Commit verified evidence and assembly sources to branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue144: seal unrestricted signed SHR16 exclusive producer and native proofs'
          git push origin HEAD:"$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue144-all-signed-shr16-exclusive-model-native
          path: |
            validation/review/ISSUE144_SIGNED_SHR16_FULL_EXCLUSIVE_MODEL.json
            validation/review/ISSUE144_SIGNED_SHR16_FULL_EXCLUSIVE_INSTALLER.json
            validation/review/ISSUE144_SIGNED_SHR16_FULL_EXCLUSIVE_NATIVE_VICE.json
