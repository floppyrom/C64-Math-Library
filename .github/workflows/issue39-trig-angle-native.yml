name: Issue39 trig-angle installed native VICE public ABI
on:
  push:
    branches: [issue39-trig-angle-family-20261014]
    paths:
      - tools/native_issue39_trig_angle.py
      - .github/workflows/issue39-trig-angle-native.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-five-profile-trig:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-trig-angle-family-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SHA-pinned VICE x64sc headless
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Verify 480 installed five-profile trig calls against independent CPU model
        run: python3 tools/native_issue39_trig_angle.py
      - name: Commit native proof only after every product/phase, carry and stack check
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/review/ISSUE39_TRIG_ANGLE_NATIVE_2026-10-14.json
          git diff --cached --quiet || git commit -m 'issue39: record native VICE five-profile trig/angle public ABI proof'
          git push origin HEAD:issue39-trig-angle-family-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-trig-native-public-abi
          path: validation/review/ISSUE39_TRIG_ANGLE_NATIVE_2026-10-14.json
