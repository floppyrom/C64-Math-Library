name: Issue39 V1-V5 UMUL24 rare-carry CLC protected source staging
on:
  push:
    branches: [issue39-v1v5-umul24-rarecarry-production-20261014]
    paths:
      - relocatable_source/v1_balanced/umul24_fast24_shared.inc
      - tools/stage_issue39_v1v5_umul24_rarecarry_release.py
      - .github/workflows/issue39-v1v5-umul24-rarecarry-stage.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-release-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-v1v5-umul24-rarecarry-production-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild every profile, validate public ABI, performance and full release package
        run: python3 tools/stage_issue39_v1v5_umul24_rarecarry_release.py
      - name: Commit validated source release to staging branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: stage validated V1-V5 UMUL24 rare-carry source release'
          git push origin HEAD:issue39-v1v5-umul24-rarecarry-production-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-v1v5-umul24-rarecarry-source-stage
          path: validation/review/ISSUE39_V1V5_UMUL24_RARECARRY_RELEASE_2026-10-14.json
