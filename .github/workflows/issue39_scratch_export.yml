name: Issue39 scratch source export
on:
  push:
    branches: [issue39-v1-div24-scratch-export]
permissions:
  contents: write
jobs:
  export-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify branch write permission
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          echo "Issue39 scratch GitHub Actions write capability verified" > .github/ISSUE39_SCRATCH_WRITE_PROOF.txt
          git add .github/ISSUE39_SCRATCH_WRITE_PROOF.txt
          git commit -m "scratch: check CI branch write permission"
          git push origin HEAD:issue39-v1-div24-scratch-export
