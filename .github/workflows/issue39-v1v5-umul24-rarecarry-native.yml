name: Issue39 V1/V5 UMUL24 rare-carry production native VICE
on:
  push:
    branches: [issue39-v1v5-umul24-rarecarry-production-20261014]
    paths:
      - tools/native_issue39_v1v5_umul24_rarecarry_release.py
      - tools/finalize_issue39_v1v5_umul24_rarecarry_native.py
      - validation/review/ISSUE39_V1V5_UMUL24_RARECARRY_RELEASE_2026-10-14.json
      - .github/workflows/issue39-v1v5-umul24-rarecarry-native.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installed-public-resident-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-v1v5-umul24-rarecarry-production-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum pinned native x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Execute 384 old/new native UMUL24 and SMUL24 public calls across V1/V5
        run: python3 tools/native_issue39_v1v5_umul24_rarecarry_release.py
      - name: Seal native qualification and reproducible package
        run: python3 tools/finalize_issue39_v1v5_umul24_rarecarry_native.py
      - name: Commit only native-validated artifacts to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: certify V1 V5 UMUL24 rare-carry production native VICE'
          git push origin HEAD:issue39-v1v5-umul24-rarecarry-production-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-v1v5-umul24-rarecarry-native
          path: validation/review/ISSUE39_V1V5_UMUL24_RARECARRY_NATIVE_2026-10-14.json
