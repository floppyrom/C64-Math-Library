name: V5 division import proof
on:
  push:
    branches: [ opt/udiv32-16-latency-20261007 ]
  workflow_dispatch:
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate donor source
        run: python3 tools/generate_sources.py
      - name: Build V5 reference and alternate
        run: |
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
      - name: Validate V5 hybrid
        run: python3 tools/validate_hybrid.py
      - name: Check optimized division calls directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys,json
          sys.path.insert(0,'tools')
          import validate_hybrid as H
          # validate_hybrid already checks V2 cycle parity for imported paths.
          d=json.loads(Path('validation/hybrid_validation/HYBRID_VALIDATION.json').read_text())
          print(json.dumps(d.get('tests',{}).get('v2_cycle_parity',{}),indent=2))
          PY
