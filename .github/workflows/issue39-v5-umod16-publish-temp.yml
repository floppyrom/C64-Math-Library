name: One-shot issue39 V5 UMOD16 packed remainder-only publication
on:
  push:
    branches: [issue39-v5-umod16-remainder-front]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact V5 reference and alternate source build
        run: |
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          python3 - <<'PY'
          from pathlib import Path
          import shutil,hashlib
          root=Path('.')
          src=root/'build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg'
          dst=root/'v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg'
          assert src.stat().st_size==dst.stat().st_size
          assert hashlib.sha256(src.read_bytes()).hexdigest()=='6aff56fc151a2bf6037323764f2317c6f3416cf8c181332a5592e31f2cf91f1d'
          shutil.copy2(src,dst)
          PY
          python3 tools/assemble_sources.py --profile all --config-kind alternate
          python3 tools/validate_source_build.py all --build build_source/alternate --out validation/source_relocation
          python3 tools/verify_deterministic_rebuild.py
      - name: Republish all source mirrors and signed/unsigned family proof
        run: |
          python3 tools/publish_standalone_sources.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/validate_unsigned_division.py
          python3 tools/validate_signed_division.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
      - name: Republish same-input ranking and cross-profile source evidence
        run: |
          python3 tools/benchmark_unsigned_common_corpus.py
          python3 tools/validate_v5_umod24_frontend.py
          python3 tools/validate_v5_umod16_frontend.py
          python3 tools/validate_hybrid.py --random-per-family 50 --mixed 50
          python3 tools/finalize_issue39_v5_umod16.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
      - name: Delete disposable workflow, clean and seal package
        run: |
          rm .github/workflows/issue39-v5-umod16-publish-temp.yml
          rm -rf build_source build_hybrid build_hybrid_repeat build_pareto
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          root=Path('.')
          def seal():
            paths=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=str)
            (root/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n' for p in paths))
          for _ in range(5):
            seal()
            subprocess.run(['python3','tools/package_audit.py'],check=True)
          seal()
          PY
          python3 tools/package_audit.py
      - name: Commit fully published V5 source and validation artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish issue39 V5 UMOD16 packed remainder frontend and same-input proof'
          git push origin HEAD:issue39-v5-umod16-remainder-front
