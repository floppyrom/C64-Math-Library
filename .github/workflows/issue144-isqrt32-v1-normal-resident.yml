name: Issue144 V1 ISQRT32 normal resident direct highword research
on:
  push:
    branches: [issue144-isqrt32-v1-normal-resident-research-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-model-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test V1 original normal root resident slot on both memory maps, full 32-bit inputs
        run: python3 tools/issue144_isqrt32_v1_normal_resident_screen.py --count 1200

      - name: Install SHA256-pinned native VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: V1 native source-built normal resident root in both relocated memory maps
        run: python3 tools/native_issue144_isqrt32_v1_normal_resident.py
