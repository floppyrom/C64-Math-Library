name: Signed historical V2 32/16 shared builder qualification

on:
  pull_request:
    paths:
      - 'tools/selective_linker.py'
      - 'tools/selective_speed_s3216.py'
      - 'tools/test_selective_speed_s3216.py'
      - 'tools/native_selective_signed_v2_3216_builder.py'
      - 'tools/research_signed_v2_u3216.py'
      - 'tools/selective_v2_fast_u3216.py'
      - 'v2_pareto_fast/resident/modules/pareto_udiv32_16.a'
      - '.github/workflows/signed-v2-3216-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-public-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and prove speed, fallback, shared source, public ABI
        run: |
          python3 -m compileall -q tools/selective_linker.py tools/selective_speed_s3216.py tools/test_selective_speed_s3216.py tools/native_selective_signed_v2_3216_builder.py
          python3 -m unittest discover -s tools -p 'test_selective_speed_s3216.py' -v

  native-vice:
    needs: paired-public-model
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install VICE r46284 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned headless VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Qualify both signed public entry aliases in the linker at two placements
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_signed_v2_3216_builder.py
