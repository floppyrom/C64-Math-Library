name: Validate library

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  source-and-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Immutable pre-root main commit needed by exact old/new provenance tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standalone fast-kernel 7163-call source validation
        run: python3 routines/standalone_lab/verify.py
      - name: Five standalone kernels x three RAM maps, 16095 machine-code calls
        run: python3 routines/standalone_lab/portable/verify.py
      - name: Repose 0-ZP UMOD32 donor byte parity and 3410 full-corpus calls
        run: python3 routines/standalone_lab/portable/verify_umod32_common.py
      - name: Repose zero-ZP UDIV32 byte parity and 8187 identical-corpus calls
        run: python3 routines/standalone_lab/portable/verify_aligned_udiv32_common.py
      - name: Zero-ZP direct-chain UMOD16 three-map 5115-call source qualification
        run: python3 routines/standalone_lab/portable/verify_umod16_direct_zerozp.py
      - name: Issue39 V1 24/8 shared-subtraction paired public-entry screen
        run: python3 tools/screen_issue39_v1_24by8_shared_subtraction.py
      - name: Lean package and checksum contract
        run: |
          python3 tools/package_audit.py
          git diff --exit-code -- validation/PACKAGE_AUDIT.json
      - name: Emulator unintended-opcode semantics and generated seek sources
        run: |
          python3 tools/test_mini6502_illegal.py
          python3 tools/generate_seek_sources.py --check
      - name: Public source and benchmark contract
        run: |
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          git diff --exit-code -- benchmarks routines/SOURCE_CATALOG.csv validation/PUBLIC_SOURCE_CATALOG_AUDIT.json validation/STANDALONE_API_CONSISTENCY_AUDIT.json
      - name: Deterministic source builds
        run: |
          make reference
          make alternate
      - name: Build V5 hybrid reference/alternate maps
        run: |
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
      - name: All-profile UMUL16 and SHR8 register-return validation
        run: |
          python3 tools/validate_umul16_directout.py
          python3 tools/validate_mul16_shr8_register.py
          git diff --exit-code -- validation/multiply_refresh/UMUL16_DIRECTOUT_VALIDATION.json validation/multiply_refresh/MUL16_SHR8_REGISTER_VALIDATION.json
      - name: All-profile UMUL24 direct-output validation
        run: |
          python3 tools/validate_umul24_directout.py
          git diff --exit-code -- validation/multiply_refresh/UMUL24_DIRECTOUT_VALIDATION.json
      - name: All-profile SMUL24 direct-output validation
        run: |
          python3 tools/validate_smul24_directout.py
          git diff --exit-code -- validation/multiply_refresh/SMUL24_DIRECTOUT_VALIDATION.json
      - name: Exhaustive ATAN2 dispatch and output compatibility
        run: |
          python3 tools/validate_atan2_dispatch.py
          git diff --exit-code -- validation/ATAN2_DISPATCH_VALIDATION.json
      - name: Exhaustive REU UDIV8 hybrid validation
        run: python3 tools/validate_reu_udiv8_hybrid.py
      - name: Unsigned division and modulo family validation
        run: |
          python3 tools/validate_unsigned_division.py
          git diff --exit-code -- validation/review/UNSIGNED_DIVISION_VALIDATION.json
      - name: Signed division and modulo family validation
        run: |
          python3 tools/validate_signed_division.py
          git diff --exit-code -- validation/review/SIGNED_DIVISION_VALIDATION.json
      - name: ISQRT32 deterministic correctness and performance
        run: |
          python3 tools/benchmark_isqrt32_fast.py
          git diff --exit-code -- validation/review/ISQRT32_FAST_PERFORMANCE_4130.json

      - name: Four-ZP UDIV32 ABI and relocation validation
        run: |
          python3 tools/validate_udiv32_live_high.py
          git diff --exit-code -- validation/review/UDIV32_LIVE_HIGH_VALIDATION.json
