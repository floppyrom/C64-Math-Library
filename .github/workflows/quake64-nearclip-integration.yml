name: Quake64 near-clip integration

on:
  push:
    paths:
      - 'research/mul_div/generate_quake64_prepared_fraction_smc.py'
      - 'research/mul_div/generate_quake64_prepared_fraction_smc_compact.py'
      - 'research/mul_div/export_quake64_prepared_fraction.py'
      - 'research/mul_div/apply_quake64_nearclip_experiment.py'
      - 'research/mul_div/build_quake64_experiment.sh'
      - '.github/workflows/quake64-nearclip-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-game-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout C64 Math Library
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ACME and Python image dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y acme
          python -m pip install --disable-pip-version-check pillow

      - name: Syntax-check integration tooling
        run: |
          python -m py_compile \
            research/mul_div/generate_quake64_prepared_fraction_smc.py \
            research/mul_div/generate_quake64_prepared_fraction_smc_compact.py \
            research/mul_div/export_quake64_prepared_fraction.py \
            research/mul_div/apply_quake64_nearclip_experiment.py

      - name: Checkout three audited Quake64 snapshots
        run: |
          for variant in baseline unrolled compact; do
            git clone https://github.com/Kweepa/Quake64.git /tmp/quake64-$variant
            git -C /tmp/quake64-$variant checkout --detach 7c84654946a60314568b709e7e7b97467fed69df
            test "$(git -C /tmp/quake64-$variant rev-parse HEAD)" = "7c84654946a60314568b709e7e7b97467fed69df"
          done

      - name: Build untouched baseline through heap gate
        run: |
          chmod +x research/mul_div/build_quake64_experiment.sh
          research/mul_div/build_quake64_experiment.sh \
            /tmp/quake64-baseline \
            /tmp/quake64-evidence/baseline

      - name: Export and patch unrolled nearest candidate
        run: |
          python research/mul_div/export_quake64_prepared_fraction.py \
            --prep unrolled --rounding nearest \
            --output /tmp/prepared-unrolled.asm
          python research/mul_div/apply_quake64_nearclip_experiment.py \
            /tmp/quake64-unrolled \
            --prepared-source /tmp/prepared-unrolled.asm

      - name: Build unrolled experiment through heap gate
        run: |
          research/mul_div/build_quake64_experiment.sh \
            /tmp/quake64-unrolled \
            /tmp/quake64-evidence/unrolled

      - name: Export and patch compact nearest candidate
        run: |
          python research/mul_div/export_quake64_prepared_fraction.py \
            --prep compact --rounding nearest \
            --output /tmp/prepared-compact.asm
          test -s /tmp/prepared-compact.asm
          ! grep -q '^\.org ' /tmp/prepared-compact.asm
          ! grep -Eq '^[[:space:]]*(asl|lsr|rol|ror)[[:space:]]+a([[:space:]]|$)' /tmp/prepared-compact.asm
          python research/mul_div/apply_quake64_nearclip_experiment.py \
            /tmp/quake64-compact \
            --prepared-source /tmp/prepared-compact.asm
          # Shared generic clipping helper must remain untouched.
          grep -A2 '^\.nlrun' /tmp/quake64-compact/src/cube.asm | grep -q 'jsr scale_nd'
          test "$(grep -c 'jsr qfrac_prep' /tmp/quake64-compact/src/cube.asm)" -eq 2
          test "$(grep -c 'jsr qfrac_apply_s16' /tmp/quake64-compact/src/cube.asm)" -eq 4

      - name: Build compact experiment through heap gate
        run: |
          research/mul_div/build_quake64_experiment.sh \
            /tmp/quake64-compact \
            /tmp/quake64-evidence/compact

      - name: Summarize real-build Pareto comparison
        run: |
          {
            echo '--- BASELINE ---'
            cat /tmp/quake64-evidence/baseline/build-provenance.txt
            echo
            echo '--- UNROLLED NEAREST ---'
            cat /tmp/quake64-evidence/unrolled/build-provenance.txt
            echo
            echo '--- COMPACT NEAREST ---'
            cat /tmp/quake64-evidence/compact/build-provenance.txt
          } | tee /tmp/quake64-evidence/BASELINE_VS_UNROLLED_VS_COMPACT.txt

      - name: Upload real-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quake64-nearclip-real-build
          path: /tmp/quake64-evidence
          if-no-files-found: warn
