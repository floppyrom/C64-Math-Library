name: Source-linked signed16 quarter-square full public qualification

on:
  pull_request:
    paths:
      - 'tools/selective_smul16_quartersquare.py'
      - 'tools/selective_speed_smul16.py'
      - 'tools/test_selective_smul16_quartersquare.py'
      - 'tools/test_smul16_qs_paired_frame.py'
      - 'tools/native_selective_smul16_quartersquare.py'
      - 'tools/selective_linker.py'
      - '.github/workflows/smul16-signed-qs-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve canonical unsigned QS while qualifying exact signed public entry
        run: |
          python3 -m compileall -q tools/selective_smul16_quartersquare.py tools/selective_speed_smul16.py tools/test_selective_smul16_quartersquare.py tools/test_smul16_qs_paired_frame.py tools/native_selective_smul16_quartersquare.py tools/selective_linker.py
          python3 tools/selective_smul16_quartersquare.py
          python3 -m unittest discover -s tools -p 'test_selective_smul16_quartersquare.py' -v
          python3 -m unittest discover -s tools -p 'test_smul16_qs_paired_frame.py' -v

  pinned-native-vice:
    needs: source-model
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install native headless VICE dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned native VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Verify two full public signed QS16 images with native VICE
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_smul16_quartersquare.py
