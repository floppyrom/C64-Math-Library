name: Issue144 V5 derived root ISQRT32 inheritance screen
on:
  push:
    branches: [issue144-v5-isqrt32-inheritance-screen-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build V5 reference+alternate and prove V1 resident ownership and paired ordinary-call roots
        run: python3 tools/issue144_v5_isqrt32_inheritance_screen.py
      - name: Install SHA256-pinned headless VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Run paired V5 inherited root on actual NMOS 6510 for both memory maps
        run: python3 tools/native_issue144_v5_isqrt32_inheritance.py
