name: One-shot issue39 current-tree handoff
on:
  push:
    branches: [issue39-analysis-snapshot-20261011]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export exact checkout
        run: |
          git rev-parse HEAD > CURRENT_HEAD_SHA.txt
          python3 - <<'PY'
          import zipfile, pathlib
          root=pathlib.Path('.')
          with zipfile.ZipFile('/tmp/c64math-current-issue39.zip','w',zipfile.ZIP_DEFLATED,compresslevel=4) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and '.git' not in p.parts:
                      z.write(p,p.as_posix())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c64-math-issue39-current-tree
          path: /tmp/c64math-current-issue39.zip
          retention-days: 7
