name: Issue39 temporary source snapshot
on:
  push:
    branches:
      - issue39-q23-zero-bypass
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact candidate checkout
        run: |
          python3 - <<'PY'
          import subprocess,zipfile
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('issue39_checkout.zip','w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for path in paths:
                  if path:z.write(path)
          print('Archived',len(paths)-1,'tracked files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: issue39-candidate-source-snapshot
          path: issue39_checkout.zip
          retention-days: 1
