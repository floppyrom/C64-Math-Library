name: Division tail probe
on:
  push:
    branches: [ opt/udiv32-16-latency-20261007 ]
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[tail-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all optimized source maps
        run: |
          python3 tools/generate_sources.py
          for kind in reference alternate; do
            for p in v2_pareto_fast v3_reu_512k v4_reu_16m; do
              python3 tools/assemble_sources.py --profile "$p" --config-kind "$kind" --out build_u3216
            done
          done
      - name: Prove reclaimed-island fit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'tools')
          from mini6502 import Assembler
          import assemble_sources as A
          for p in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              src=Path('relocatable_source')/p/'math_relocatable.asm'
              cfg=Path('relocatable_source')/p/'math_config_reference.inc'
              _,lab,_=Assembler().assemble(A.preprocess(src,cfg))
              print(p,
                    'D17',hex(lab['DIVLAT_UD32_D17']),hex(lab['DIVLAT_D17_END']),
                    'legacy',hex(lab['UD32_OLD_C28A']),hex(lab['UD32_MAIN_END']),
                    'helper_end',hex(lab['DIVLAT_END']),'legacy_d8_end',hex(lab['UD32_OLD_C289']))
              assert lab['DIVLAT_UD32_D17']==lab['UD32_OLD_C28A']
              assert lab['DIVLAT_D17_END']<=lab['UD32_MAIN_END']
              assert lab['DIVLAT_END']<=lab['UD32_OLD_C289']
          PY
      - name: Validate UDIV32-16 and all latency escapes
        run: |
          python3 tools/validate_udiv32_16_integrated.py
          python3 tools/validate_division_latency_escape.py
# D17 rerun after bounded wide-dispatch gate
