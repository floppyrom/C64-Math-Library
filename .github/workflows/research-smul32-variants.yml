name: Research SMUL32 variant split

on:
  push:
    branches:
      - research/smul32-bounded-sum-v1

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh main ref
        run: git fetch origin main:refs/remotes/origin/main
      - name: Benchmark q1/q2 variants
        run: python3 tools/bench_smul32_variant_split.py
