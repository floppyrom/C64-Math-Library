name: Issue39 UMUL24 no-carry CLC source production stage
on:
  push:
    branches: [issue39-v2v4-umul24-nocarry-clc-production]
    paths:
      - tools/stage_issue39_v2v4_umul24_nocarry_clc.py
      - .github/workflows/issue39-umul24-nocarry-clc-stage.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-source-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-v2v4-umul24-nocarry-clc-production
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild candidate from source and run cross-library qualification
        run: python3 tools/stage_issue39_v2v4_umul24_nocarry_clc.py
      - name: Commit release only after source and qualification checks pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: stage public V2-V4 UMUL24 no-carry CLC release'
          git push origin HEAD:issue39-v2v4-umul24-nocarry-clc-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-umul24-nocarry-clc-release-stage
          path: validation/review/ISSUE39_V2V4_UMUL24_NOCARRY_CLC_RELEASE.json
