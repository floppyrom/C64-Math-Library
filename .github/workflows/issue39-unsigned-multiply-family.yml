name: Issue39 unsigned multiply family public ABI and OptiSearch resource gate
on:
  push:
    branches: [issue39-v1v5-umul24-rarecarry-production-20261014]
    paths:
      - tools/issue39_unsigned_multiply_completion_audit.py
      - docs/ISSUE39_UNSIGNED_MULTIPLY_FAMILY_REVIEW_2026-10-14.md
      - .github/workflows/issue39-unsigned-multiply-family.yml
  pull_request:
    paths:
      - tools/issue39_unsigned_multiply_completion_audit.py
      - docs/ISSUE39_UNSIGNED_MULTIPLY_FAMILY_REVIEW_2026-10-14.md
      - .github/workflows/issue39-unsigned-multiply-family.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-profile-public-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run five-profile source and READY mixed-call qualification
        run: python3 tools/issue39_unsigned_multiply_completion_audit.py --exercise --output /tmp/issue39_unsigned_multiply_family.json
      - name: Confirm tracked public baseline measurements remain deterministic
        run: git diff --exit-code -- validation/multiply_refresh/UMUL16_DIRECTOUT_VALIDATION.json validation/multiply_refresh/UMUL24_DIRECTOUT_VALIDATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-unsigned-multiply-family-audit
          path: /tmp/issue39_unsigned_multiply_family.json
