name: Research SDIV16 late-copy promotion
on:
  push:
    branches: [opt/sdiv16-late-copy-v1]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate V2-V4 SDIV16 late-copy candidate
        run: |
          python3 tools/bench_sdiv16_late_copy_profiles.py
          python3 tools/diag_sdiv16_promotion_v2.py
