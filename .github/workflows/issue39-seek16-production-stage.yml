name: Issue39 SEEK16 guarded production stage
on:
  push:
    branches: [issue39-seek16-euclid-scale-source-release-20261014]
    paths:
      - tools/stage_issue39_seek16_scale_release.py
      - .github/workflows/issue39-seek16-production-stage.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guarded-seek16-production:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-seek16-euclid-scale-source-release-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate SEEK canonical source and public candidate reference images
        run: |
          python3 tools/generate_seek_sources.py
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference
          python3 tools/build_hybrid.py --config-kind reference
      - name: Install SHA256-pinned x64sc headless
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Independently rerun real VICE public baseline/candidate verification
        run: python3 tools/native_issue39_seek16_scale.py
      - name: Guardedly stage all-source production, public benchmark and release seal
        run: python3 tools/stage_issue39_seek16_scale_release.py
      - name: Commit only after every release gate passed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: source-publish optimized SEEK16 Euclidean INIT across five profiles'
          git push origin HEAD:issue39-seek16-euclid-scale-source-release-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-seek16-production-release
          if-no-files-found: warn
          path: |
            validation/review/ISSUE39_SEEK16_SCALE_NATIVE_2026-10-14.json
            validation/review/ISSUE39_SEEK16_SCALE_PRODUCTION_2026-10-14.json
            docs/ISSUE39_SEEK16_EUCLIDEAN_INIT_RELEASE_2026-10-14.md
