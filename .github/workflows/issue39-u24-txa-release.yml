name: Issue39 U24 TXA source-built resident release staging
on:
  push:
    branches: [issue39-u24-live-x-resident-integration]
    paths:
      - '.github/workflows/issue39-u24-txa-release.yml'
      - 'tools/stage_issue39_u24_txa_release.py'
permissions:
  contents: write
jobs:
  source-resident-release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env: {PYTHONDONTWRITEBYTECODE: '1'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-u24-live-x-resident-integration
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build, install, validate, regenerate and seal all V1–V5 candidate residents
        run: python3 tools/stage_issue39_u24_txa_release.py
      - name: Commit complete validated source-based release candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: stage all five generic U24 TXA resident images and package'
          git push origin HEAD:issue39-u24-live-x-resident-integration
