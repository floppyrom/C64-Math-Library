name: Finalize MULDIV16 release state
# publication rerun 6

on:
  push:
    branches: [ promote/muldiv16-stable-20261007 ]
    paths:
      - '.github/workflows/muldiv16-finalize-release.yml'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/muldiv16-stable-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check release tools
        run: |
          python3 -m py_compile tools/assemble_sources.py tools/source_relocation.py tools/build_hybrid.py tools/publish_standalone_sources.py tools/validate_public_catalog.py tools/generate_consolidated_routine_table.py

      - name: Remove helper and regenerate canonical source
        run: |
          rm -f .github/workflows/muldiv16-finalize-release.yml
          python3 tools/generate_sources.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('relocatable_source/v5_hybrid_lowzp')
          for name,val in (
              ('math_config.inc','$9C00'),
              ('math_config_reference.inc','$9C00'),
              ('math_config_alternate.inc','$1000')):
              p=root/name
              s=p.read_text()
              line=f'SMUL8_SUM_BASE = {val}'
              if 'SMUL8_SUM_BASE' in s:
                  s=re.sub(r'^SMUL8_SUM_BASE\s*=.*$',line,s,flags=re.M)
              else:
                  s,n=re.subn(r'^(TURBO32_ZP_BASE\s*=.*)$',lambda m:m.group(1)+'\n'+line,s,count=1,flags=re.M)
                  if n != 1:
                      raise RuntimeError(f'could not place SMUL8_SUM_BASE in {p}')
              p.write_text(s)
          PY

      - name: Build all maps and V5
        run: |
          rm -rf build_source build_hybrid build_hybrid_repeat build_pareto
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate

      - name: Promote reference resident artifacts
        run: |
          for p in v1_balanced v2_pareto_fast v3_reu_512k v4_reu_16m; do
            cp "build_source/reference/$p/math_${p}_source_built.prg" "$p/resident/math_${p}_game_math.prg"
            cp "build_source/reference/$p/math_api.inc" "$p/resident/math_api.inc"
          done
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu v4_reu_16m/reu/c64_math_v4_16m_game_math.reu
          cp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg
          cp build_hybrid/reference/v5_hybrid_lowzp/math_api.inc v5_hybrid_lowzp/resident/math_api.inc
          cp build_hybrid/reference/v5_hybrid_lowzp/source_build_manifest.json v5_hybrid_lowzp/resident/HYBRID_BUILD_MANIFEST.json

      - name: Regenerate from promoted binaries and rebuild
        run: |
          python3 tools/generate_sources.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('relocatable_source/v5_hybrid_lowzp')
          for name,val in (
              ('math_config.inc','$9C00'),
              ('math_config_reference.inc','$9C00'),
              ('math_config_alternate.inc','$1000')):
              p=root/name; s=p.read_text(); line=f'SMUL8_SUM_BASE = {val}'
              if 'SMUL8_SUM_BASE' in s:
                  s=re.sub(r'^SMUL8_SUM_BASE\s*=.*$',line,s,flags=re.M)
              else:
                  s=re.sub(r'^(TURBO32_ZP_BASE\s*=.*)$',lambda m:m.group(1)+'\n'+line,s,count=1,flags=re.M)
              p.write_text(s)
          PY
          rm -rf build_source build_hybrid
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          for p in v1_balanced v2_pareto_fast v3_reu_512k v4_reu_16m; do
            cmp "build_source/reference/$p/math_${p}_source_built.prg" "$p/resident/math_${p}_game_math.prg"
          done
          cmp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg

      - name: Publish sources and public indexes
        run: |
          python3 tools/publish_native_signed_sources.py
          python3 tools/publish_standalone_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          python3 tools/validate_published_signed_sources.py

      - name: Validate source maps MULDIV V5 and deterministic rebuilds
        run: |
          python3 tools/validate_source_build.py all --build build_source/reference --out validation/source_relocation/reference_current
          python3 tools/validate_source_build.py all --build build_source/alternate --out validation/source_relocation/alternate_current
          python3 tools/validate_muldiv16.py
          python3 tools/validate_hybrid.py
          python3 tools/verify_deterministic_rebuild.py

      - name: Validate signed multiplication Turbo and configuration
        run: |
          python3 tools/validate_signed_multiply.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py
          python3 tools/test_config_validation.py

      - name: Validate Custom Pareto with 56-entry API
        run: |
          python3 tools/validate_pareto.py

      - name: Run repository publication regression validators
        run: |
          python3 tools/test_mini6502_illegal.py
          python3 tools/generate_seek_sources.py --check
          python3 tools/validate_umul16_directout.py
          python3 tools/validate_mul16_shr8_register.py
          python3 tools/validate_umul24_directout.py
          python3 tools/validate_smul24_directout.py
          python3 tools/validate_atan2_dispatch.py
          python3 tools/validate_reu_udiv8_hybrid.py
          python3 tools/validate_unsigned_division.py
          python3 tools/benchmark_isqrt32_fast.py
          python3 tools/validate_udiv32_live_high.py

      - name: Refresh release status hashes and current API counts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads((root/'RELEASE_STATUS.json').read_text())
          s['date']='2026-10-07'
          s['stable_api_entries']=56
          s['source_relocation']['entries_executed']=224
          s['source_relocation']['machine_calls']=21678*4
          for p in ('v1_balanced','v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              s['reference_prg_sha256'][p]=sha(root/p/'resident'/f'math_{p}_game_math.prg')
              m=json.loads((root/'build_source/alternate'/p/'source_build_manifest.json').read_text())
              s['alternate_prg_sha256'][p]=m['output_sha256']
          for p in ('v3_reu_512k','v4_reu_16m'):
              rm=json.loads((root/'build_source/reference'/p/'source_build_manifest.json').read_text())
              am=json.loads((root/'build_source/alternate'/p/'source_build_manifest.json').read_text())
              s['reference_reu_sha256'][p]=rm['reu_image']['sha256']
              s['alternate_reu_sha256'][p]=am['reu_image']['sha256']
          hr=json.loads((root/'build_hybrid/reference/v5_hybrid_lowzp/source_build_manifest.json').read_text())
          ha=json.loads((root/'build_hybrid/alternate/v5_hybrid_lowzp/source_build_manifest.json').read_text())
          s['reference_prg_sha256']['v5_hybrid_lowzp']=hr['output_sha256']
          s['alternate_prg_sha256']['v5_hybrid_lowzp']=ha['output_sha256']
          h=s['hybrid_v5']
          h['reference_prg_sha256']=hr['output_sha256']
          h['alternate_prg_sha256']=ha['output_sha256']
          hv=json.loads((root/'validation/hybrid/HYBRID_VALIDATION.json').read_text())
          h['common_public_entries_per_map']=hv['tests']['common_reference']['public_entries']
          h['common_machine_calls_per_map']=hv['tests']['common_reference']['machine_calls']
          h['direct_import_cases']=sum(x['cases'] for x in hv['tests']['direct_v2_parity'].values())
          if 'custom_pareto' in s:
              s['custom_pareto']['stable_api_entries']=56
              pv=json.loads((root/'validation/pareto/PARETO_SELECTOR_VALIDATION.json').read_text())
              s['custom_pareto']['common_api_machine_calls']=pv['common_api_machine_calls']
          if 'documentation' in s:
              s['documentation']['manual_scope']=s['documentation'].get('manual_scope','').replace('54-entry','56-entry')
          s['notes']=[x.replace('54-entry','56-entry').replace('54 entries','56 entries') for x in s.get('notes',[])]
          (root/'RELEASE_STATUS.json').write_text(json.dumps(s,indent=2)+'\n')
          PY

      - name: Refresh lean package manifest and audit
        run: |
          rm -rf build_source build_hybrid build_hybrid_repeat build_pareto
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py

      - name: Commit finalized MULDIV16 release state
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize MULDIV16 release artifacts and validation"
          git push origin HEAD:promote/muldiv16-stable-20261007
