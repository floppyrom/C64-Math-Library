name: Historical shared V1 SDIV8 SMOD8 full-public speed qualification

on:
  pull_request:
    paths:
      - 'tools/selective_speed_sdiv8_shared.py'
      - 'tools/test_selective_speed_sdiv8_shared.py'
      - 'tools/selective_linker.py'
      - '.github/workflows/sdiv8-smod8-shared-speed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-and-builder:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-certify exact historical V1 signed8 public cycles and shared exports
        run: |
          python3 -m compileall -q tools/selective_speed_sdiv8_shared.py tools/test_selective_speed_sdiv8_shared.py tools/selective_linker.py
          python3 -m unittest discover -s tools -p 'test_selective_speed_sdiv8_shared.py' -v
          python3 -m unittest discover -s tools -p 'test_selective_sdiv8.py' -v

  pinned-native-vice:
    needs: model-and-builder
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install native VICE dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned native VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Confirm unchanged signed 8-bit Q/R native public producer in VICE
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_sdiv8.py
