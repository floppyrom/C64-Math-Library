name: Refresh UMUL16 final package contract

on:
  push:
    branches:
      - optimize-umul16-public

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-umul16-public
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/refresh-umul16-final.yml
      - name: Refresh package manifest and audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
      - name: Commit refreshed package contract
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refresh final UMUL16 package contract"
          git push origin HEAD:optimize-umul16-public
