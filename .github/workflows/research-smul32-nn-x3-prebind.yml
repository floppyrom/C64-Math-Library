name: Research SMUL32 NN X3 prebind

on:
  push:
    branches:
      - research/smul32-nn-x3-prebind-v1

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benchmark NN X3 prebind candidate
        run: python3 tools/bench_smul32_nn_x3_prebind.py
