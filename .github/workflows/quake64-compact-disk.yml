name: Quake64 compact prepared disk

on:
  push:
    paths:
      - 'research/mul_div/generate_quake64_prepared_fraction_smc.py'
      - 'research/mul_div/generate_quake64_prepared_fraction_smc_compact.py'
      - 'research/mul_div/export_quake64_prepared_fraction.py'
      - 'research/mul_div/apply_quake64_nearclip_experiment.py'
      - 'research/mul_div/build_quake64_experiment.sh'
      - 'research/mul_div/package_quake64_experiment.sh'
      - '.github/workflows/quake64-compact-disk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compact-d64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout C64 Math Library
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ACME, VICE disk tools and image dependency
        run: |
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y acme vice
          python -m pip install --disable-pip-version-check pillow
          acme --version
          c1541 -version || true

      - name: Checkout audited Quake64 snapshot
        run: |
          git clone https://github.com/Kweepa/Quake64.git /tmp/quake64
          git -C /tmp/quake64 checkout --detach 7c84654946a60314568b709e7e7b97467fed69df
          test "$(git -C /tmp/quake64 rev-parse HEAD)" = "7c84654946a60314568b709e7e7b97467fed69df"

      - name: Export and apply compact-nearest prepared fraction
        run: |
          python research/mul_div/export_quake64_prepared_fraction.py \
            --prep compact --rounding nearest \
            --output /tmp/prepared-compact.asm
          python research/mul_div/apply_quake64_nearclip_experiment.py \
            /tmp/quake64 --prepared-source /tmp/prepared-compact.asm

      - name: Build GAME and pass heap gate
        run: |
          chmod +x research/mul_div/build_quake64_experiment.sh
          research/mul_div/build_quake64_experiment.sh \
            /tmp/quake64 /tmp/quake64-build

      - name: Package KERNAL-load D64
        run: |
          chmod +x research/mul_div/package_quake64_experiment.sh
          research/mul_div/package_quake64_experiment.sh \
            /tmp/quake64 /tmp/quake64-disk

      - name: Upload compact D64 and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quake64-prepared-compact-d64
          path: |
            /tmp/quake64-disk
            /tmp/quake64-build/build-provenance.txt
            /tmp/quake64-build/checkheap.txt
            /tmp/quake64-build/source.diff
            /tmp/quake64-build/game.lbl
          if-no-files-found: warn
