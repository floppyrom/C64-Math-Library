name: Issue136 mixed SEEK/DIVMOD source-map stress
on:
  push:
    branches: [issue136-seek-divmod-mixed-stress-20261014]
  pull_request:
    branches: [issue39-seek16-euclid-scale-source-release-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixed-state:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both relocation maps and all five resident profiles
        run: |
          python3 tools/generate_seek_sources.py
          python3 tools/generate_sources.py
          for kind in reference alternate; do
            python3 tools/assemble_sources.py --profile all --config-kind "$kind"
            python3 tools/build_hybrid.py --config-kind "$kind"
          done
      - name: Verify every mixed public SEEK/DIVMOD state and result
        run: python3 tools/validate_issue136_seek_divmod_mixed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue136-mixed-seek-divmod
          if-no-files-found: warn
          path: validation/review/ISSUE136_SEEK_DIVMOD_MIXED_PROOF.json
