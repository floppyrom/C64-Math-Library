name: UMUL24 layout diagnostic

on:
  push:
    branches: [opt/mod-isqrt-fast24-turbo-20261007]
    paths:
      - '.github/workflows/umul24-layout-diagnostic.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce promotion trace
        run: |
          python3 tools/generate_sources.py
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'tools')
          from assemble_sources import preprocess
          from mini6502 import Assembler
          src=Path('relocatable_source/v2_pareto_fast/math_relocatable.asm')
          cfg=Path('relocatable_source/v2_pareto_fast/math_config_reference.inc')
          mem,labels,const=Assembler().assemble(preprocess(src,cfg))
          print('AFTER_GENERATE_MEM',hex(mem.get(0x5780,0)),hex(mem.get(0x5784,0)),'MIN',hex(min(mem)),'MAX',hex(max(mem)))
          for k in ('R24_c0_1','R24_umult','R24_init','R24_public_impl','R24_public_tail'):
              print('FINAL_LABEL',k,hex(labels.get(k,-1)))
          from assemble_sources import source_dependencies
          cfgtext=cfg.read_text()
          for dep in source_dependencies(src):
              try:
                  dm,dl,dc=Assembler().assemble(cfgtext+'\n'+dep.read_text())
              except Exception as e:
                  continue
              hits=[a for a in range(0x577e,0x5785) if a in dm]
              if hits:
                  print('WRITER',dep.as_posix(),[(hex(a),hex(dm[a])) for a in hits])
          # Show every expanded-source line whose assembled bytes overlap $5780.
          import re
          from mini6502 import OPS,SIZE
          asm=Assembler(); full=preprocess(src,cfg); fm,fl,fc=asm.assemble(full)
          pc=0
          for s0 in asm._clean(full):
              s=s0
              if re.fullmatch(r'([A-Za-z_.][\\w.]*)\\s*=\\s*(.+)',s) and not s.startswith('*='):
                  continue
              meq=re.fullmatch(r'([A-Za-z_.][\\w.]*)\\s*=\\s*\\*\\s*([+-])\\s*(\\d+|\\$[0-9A-Fa-f]+)',s)
              if meq: continue
              mo=re.fullmatch(r'(?:\\*|\\.org)\\s*=*\\s*(.+)',s,re.I)
              if mo:
                  pc=asm.expr(mo.group(1),fl); continue
              if ':' in s:
                  left,right=s.split(':',1)
                  if re.fullmatch(r'[A-Za-z_.][\\w.]*',left.strip()):
                      s=right.strip()
                      if not s: continue
              elif re.fullmatch(r'[A-Za-z_.][\\w.]*',s) and s.lower() not in OPS:
                  continue
              start=pc
              if s.lower().startswith(('!byte','.byte')):
                  vals=s.split(None,1)[1].split(','); pc+=len(vals)
              else:
                  parts=s.split(None,1); op=parts[0].lower(); op=op[:-2] if op.endswith('+1') else op
                  arg=parts[1].strip() if len(parts)>1 else None
                  mode,_=asm._mode(op,arg,fl); pc+=SIZE[mode]
              if start <= 0x5780 < pc:
                  print('OVERLAP5780',hex(start),hex(pc),s0)
          PY
          python3 tools/assemble_sources.py --profile v2_pareto_fast --config-kind reference --out build_source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg')
          b=p.read_bytes(); load=b[0]|(b[1]<<8)
          print('PRG_LOAD',hex(load),'LEN',len(b),'B5780',hex(b[2+0x5780-load]),'B5784',hex(b[2+0x5784-load]))
          PY
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          import source_relocation as sr
          raw,tm=sr.load_reference('v2_pareto_fast')
          print('RAW5780',hex(raw[0x5780]),'TM5780',hex(tm[0x5780]))
          print('RAW5784',hex(raw[0x5784]),'TM5784',hex(tm[0x5784]))
          try:
              seen=sr.trace('v2_pareto_fast',tm)
              print('TRACE PASS',len(seen))
          except Exception as e:
              print('TRACE FAIL',repr(e))
              raise
          PY
      - name: Assemble and dump FAST24 layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'tools')
          from assemble_sources import preprocess
          from mini6502 import Assembler,REV,SIZE
          src=Path('relocatable_source/v2_pareto_fast/math_relocatable.asm')
          cfg=Path('relocatable_source/v2_pareto_fast/math_config_reference.inc')
          mem,labels,const=Assembler().assemble(preprocess(src,cfg))
          for k in sorted(x for x in labels if x.startswith('R24_')):
              print(k,hex(labels[k]))
          print('HEX')
          for a in range(0x5750,0x5791,16):
              print(hex(a), ' '.join(f'{mem.get(x,0):02x}' for x in range(a,a+16)))
          print('POST_INIT')
          from mini6502 import CPU
          raw=bytearray(65536)
          for a,v in mem.items(): raw[a]=v
          cpu=CPU(bytearray(raw)); cpu.d=0; cpu.call(labels.get('MATH_INIT',const.get('MATH_INIT')),2_000_000)
          for a in range(0x5770,0x5790,16):
              print(hex(a), ' '.join(f'{cpu.mem[x]:02x}' for x in range(a,a+16)))
          print('LINEAR')
          pc=0x5750
          while pc<0x5791:
              oc=mem.get(pc,0)
              if oc not in REV:
                  print(hex(pc),'UNKNOWN',hex(oc)); pc+=1; continue
              op,mode=REV[oc]; sz=SIZE[mode]
              print(hex(pc),op,mode,' '.join(f'{mem.get(x,0):02x}' for x in range(pc,pc+sz)))
              pc+=sz
          PY
