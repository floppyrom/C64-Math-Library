name: Pareto 60 diagnostic
on:
  push:
    branches: [ promote/muldiv16-stable-20261007 ]
    paths: [ '.github/workflows/pareto60-diagnostic.yml' ]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'tools')
          import validate_pareto as vp
          from assemble_sources import preprocess
          from mini6502 import Assembler
          src=Path('relocatable_source/v2_pareto_fast/math_relocatable.asm')
          cfg=Path('relocatable_source/v2_pareto_fast/math_config_reference.inc')
          mem,labels,const=Assembler().assemble(preprocess(src,cfg))
          for n in ('U16_PUBLIC','U16_UMULT','U16_UMULT_AX1','U16_CARRY0','U16_CARRY1','U16_INIT'):
              print(n,hex(labels.get(n,const.get(n,0))))
          out,man=vp.build_point(60,'reference',outname='diag60_reference')
          print('packs',man['selected_packs'])
          print(vp.common_validate(out))
          PY
