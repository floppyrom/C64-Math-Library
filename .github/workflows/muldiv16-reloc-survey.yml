name: MULDIV16 relocation smoke

on:
  push:
    branches: [ promote/muldiv16-stable-20261007 ]
    paths:
      - '.github/workflows/muldiv16-reloc-survey.yml'
      - 'relocatable_source/v2_pareto_fast/**'
      - 'relocatable_source/game_math/muldiv16_fast.inc'
      - 'tools/source_relocation.py'
      - 'tools/assemble_sources.py'

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate canonical sources
        run: python3 tools/generate_sources.py
      - name: Build reference and alternate source maps
        run: |
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source
      - name: Validate all 56-entry source maps
        run: |
          python3 tools/validate_source_build.py all --build build_source/reference --out /tmp/ref
          python3 tools/validate_source_build.py all --build build_source/alternate --out /tmp/alt
      - name: Verify V2 SMUL8 sum-plane geometry
        run: |
          python3 - <<'PY'
          from tools.assemble_sources import parse_config, validate_config
          from pathlib import Path
          for kind,expected in [('reference',0x9c00),('alternate',0x8c00)]:
              p=Path('relocatable_source/v2_pareto_fast')/f'math_config_{kind}.inc'
              v=parse_config(p); claims=validate_config('v2_pareto_fast',v)
              assert v['SMUL8_SUM_BASE']==expected,(kind,v['SMUL8_SUM_BASE'])
              claim=[x for x in claims if x[0]=='SMUL8_SUM']
              assert claim==[('SMUL8_SUM',expected,expected+0x3fe,'main')],claim
              print(kind,hex(expected),hex(expected+0x3fe),'PASS')
          PY
