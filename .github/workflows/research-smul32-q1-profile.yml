name: Research SMUL32 q1 profile

on:
  push:
    branches:
      - research/smul32-q1-layout-v1

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  q1-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Map q1 nearby executable space
        run: python3 tools/map_smul32_q1_nearby.py
      - name: Profile V2 q1 path
        run: python3 tools/profile_smul32_q1.py
