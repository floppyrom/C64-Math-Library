name: Research SMUL32 q1 bounded tail

on:
  push:
    branches:
      - research/smul32-q1-bounded-tail-v1

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benchmark q1 bounded plus correction tail
        run: python3 tools/bench_smul32_q1_bounded_tail.py
