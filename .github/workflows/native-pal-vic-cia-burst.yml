name: Experimental native PAL VIC/CIA seven-API busy-burst probe
on:
  pull_request:
    paths:
      - 'tools/native_pal_vic_cia_probe.py'
      - 'tools/test_native_pal_vic_cia_probe.py'
      - 'tools/native_seven_frame_installer.py'
      - '.github/workflows/native-pal-vic-cia-burst.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pal-native-cia:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated 6510 call harness, exact source operand history and timer rollover
        run: |
          python3 -m compileall -q tools/native_pal_vic_cia_probe.py tools/test_native_pal_vic_cia_probe.py
          python3 -m unittest discover -s tools -p 'test_native_pal_vic_cia_probe.py' -v
      - name: Install pinned VICE dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned x64sc r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Measure paired display-off/display-on CIA wall slots on exact linked seven-API project
        run: |
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_pal_vic_cia_probe.py --frame 0 --out build/pal-vic-cia/native-burst.json
      - name: Upload experimental, non-release PAL probe result
        uses: actions/upload-artifact@v4
        with:
          name: experimental-pal-vic-cia-burst
          path: build/pal-vic-cia/native-burst.json
          if-no-files-found: error
          retention-days: 14
