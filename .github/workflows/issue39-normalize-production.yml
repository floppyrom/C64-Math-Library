name: Issue39 normalize guarded source production
on:
  push:
    branches: [issue39-normalize-source-production-20261014]
    paths:
      - .github/workflows/issue39-normalize-production.yml
      - tools/stage_issue39_normalize_branch_release.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-signed-q88-normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-normalize-source-production-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify and stage source-based normalization binary publication
        run: python3 tools/stage_issue39_normalize_branch_release.py
      - name: Commit resident sources, 5-profile performance, provenance and both changelogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: publish source-backed stock normalization branch collapse after proof'
          git push origin HEAD:issue39-normalize-source-production-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-normalize-staged-release
          path: |
            validation/review/ISSUE39_NORMALIZE_BRANCH_PRODUCTION_2026-10-14.json
            validation/review/ISSUE39_NORMALIZE_PREVIOUS_PRG_BYTES_2026-10-14.json
