name: Finalize shifted DIV reciprocal campaign

on:
  push:
    branches:
      - opt/shifted-div-recip-campaign-20261008
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild reference residents
        run: |
          make reference
          python3 tools/build_hybrid.py --config-kind reference
          for p in v1_balanced v2_pareto_fast v3_reu_512k v4_reu_16m; do
            cp "build_source/reference/$p/math_${p}_source_built.prg" "$p/resident/math_${p}_game_math.prg"
            cp "build_source/reference/$p/math_api.inc" "$p/resident/math_api.inc"
          done
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu v4_reu_16m/reu/c64_math_v4_16m_game_math.reu
          cp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg
          cp build_hybrid/reference/v5_hybrid_lowzp/math_api.inc v5_hybrid_lowzp/resident/math_api.inc

      - name: Regenerate division validation and source publication
        run: |
          python3 tools/validate_unsigned_division.py
          python3 tools/validate_signed_division.py
          python3 tools/publish_standalone_sources.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/validate_signed_layout.py

      - name: Regenerate performance and public indexes
        run: |
          python3 tools/generate_consolidated_routine_table.py
          python3 - <<'PY'
          from pathlib import Path
          import csv,re
          profiles=['v1_balanced','v2_pareto_fast','v3_reu_512k','v4_reu_16m','v5_hybrid_lowzp']
          wanted={'MATH_UDIV16_SHL8','MATH_SDIV16_SHL8','MATH_URECIP16_Q16'}
          rows=list(csv.DictReader(open('docs/CONSOLIDATED_ROUTINE_TABLE.csv',newline='')))
          by={(r['profile'],r['routine']):r for r in rows if r['api_class']=='stable'}
          p=Path('PERFORMANCE.md')
          out=[]
          pat=re.compile(r'^\| `(MATH_[A-Z0-9_]+)` \| `([^`]+)` \|')
          for line in p.read_text().splitlines():
              m=pat.match(line)
              if m and m.group(1) in wanted:
                  n,canon=m.group(1),m.group(2)
                  vals=[f"{float(by[(prof,n)]['mean_cycles']):.6f}" for prof in profiles]
                  line='| `'+n+'` | `'+canon+'` | '+' | '.join(vals)+' |'
              out.append(line)
          p.write_text('\n'.join(out)+'\n')
          PY
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py

      - name: Remove temporary campaign workflows
        run: |
          rm -f .github/workflows/shifted-div-candidate.yml
          rm -f .github/workflows/finalize-shifted-div-recip.yml

      - name: Clean transient builds
        run: make clean

      - name: Regenerate package checksum and audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          def write_manifest():
              files=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
              with open('SHA256SUMS.txt','w') as out:
                  for p in files:
                      out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n")
          write_manifest()
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          files=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          with open('SHA256SUMS.txt','w') as out:
              for p in files:
                  out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n")
          PY
          python3 tools/package_audit.py

      - name: Commit final publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No publication changes to commit"
          else
            git commit -m "Finalize shifted DIV reciprocal publication"
            git push
          fi
