name: Research SDIV16 PP late copy
on:
  push:
    branches: [research/sdiv16-pp-late-copy-v1]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 tools/map_sdiv16_signed_region.py
      - run: python3 tools/map_sdiv16_api_gap.py
      - run: python3 tools/bench_sdiv16_pp_late_copy.py
