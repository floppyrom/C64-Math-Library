name: Issue144 V1 V5 canonical source root promotion qualification
on:
  push:
    branches: [issue144-v15-isqrt32-highword-canonical-source-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V1/V5 both maps 56-entry full ABI, V5 inheritance and paired source-model proof
        run: python3 tools/issue144_v15_isqrt32_canonical_source_qualification.py
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SHA256-pinned headless VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: V1 96 original-versus-promoted public NMOS 6510 root calls across two maps
        run: python3 tools/native_issue144_v1_isqrt32_normal_resident.py
      - name: V5 96 original-versus-promoted public NMOS 6510 root calls across two maps
        run: python3 tools/native_issue144_v5_isqrt32_inheritance.py
