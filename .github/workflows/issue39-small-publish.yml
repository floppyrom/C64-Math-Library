name: Issue39 one-shot small-width audit publication
on:
  push:
    branches:
      - issue39-small-width-workload-screen
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[issue39-small-published]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce seven workload classes and rejected V1 24-bit candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/audit_issue39_unsigned_small_workloads.py
          python3 tools/audit_issue39_v1_24narrow_rejection.py
          python3 tools/benchmark_unsigned_common_corpus.py
          git diff --exit-code -- validation/review/UNSIGNED_DIVMOD_COMMON_CORPUS.json benchmarks/UNSIGNED_COMMON_PROFILE_RESULTS.csv
      - name: Publish both changelogs and documentation
        run: |
          python3 tools/finalize_issue39_small_width_audit.py
      - name: Remove temporary workflow, seal package, verify, commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/issue39-small-publish.yml
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,hashlib
          tracked=[Path(s) for s in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if s]
          tracked.extend([Path('validation/review/ISSUE39_UNSIGNED_SMALL_WORKLOAD_AUDIT.json'),
                          Path('validation/review/ISSUE39_V1_UDIV24_NARROW_REJECTION.json'),
                          Path('benchmarks/ISSUE39_UNSIGNED_SMALL_WORKLOAD_AUDIT.csv')])
          def seal():
              paths=sorted({p for p in tracked if p.is_file() and p.name!='SHA256SUMS.txt'},key=str)
              Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n' for p in paths))
          seal()
          subprocess.run(['python3','tools/package_audit.py'],check=True)
          seal()
          saved=Path('validation/PACKAGE_AUDIT.json').read_bytes()
          subprocess.run(['python3','tools/package_audit.py'],check=True)
          assert saved==Path('validation/PACKAGE_AUDIT.json').read_bytes(),'unstable package certificate'
          PY
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[issue39-small-published] Publish 8/16/24 workload and rejection audits"
          git push origin HEAD:issue39-small-width-workload-screen
