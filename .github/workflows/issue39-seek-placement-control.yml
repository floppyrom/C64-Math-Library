name: Issue39 SEEK placement baseline-versus-candidate diagnosis
on:
  push:
    branches: [issue39-seek16-scale-loop-research-20261014]
    paths:
      - .github/workflows/issue39-seek-placement-control.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-place-with-identical-library-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-seek16-scale-loop-research-20261014
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare placement with shipped-source control
        run: |
          cp tools/seek_kernel.py /tmp/seek_kernel_candidate.py
          git show origin/main:tools/seek_kernel.py > tools/seek_kernel.py
          python3 tools/generate_seek_sources.py
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference
          python3 tools/assemble_sources.py --profile all --config-kind alternate
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          set +e
          python3 tools/validate_seek_placement.py > /tmp/control-placement.log 2>&1
          base=$?
          cp /tmp/seek_kernel_candidate.py tools/seek_kernel.py
          python3 tools/generate_seek_sources.py
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference
          python3 tools/assemble_sources.py --profile all --config-kind alternate
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          python3 tools/validate_seek_placement.py > /tmp/candidate-placement.log 2>&1
          cand=$?
          set -e
          echo "BASELINE_PLACEMENT_EXIT=$base"
          tail -n 16 /tmp/control-placement.log
          echo "CANDIDATE_PLACEMENT_EXIT=$cand"
          tail -n 16 /tmp/candidate-placement.log
          if [ "$base" -ne 0 ]; then
            echo 'Baseline also fails placement: shared preexisting guard issue'
          elif [ "$cand" -ne 0 ]; then
            echo 'Candidate-only placement failure: research rejected'
            exit 1
          else
            echo 'Both baseline and candidate pass placement'
          fi
