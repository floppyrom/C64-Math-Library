name: Original V1-V5 VEC2 full public speed provenance

on:
  pull_request:
    paths:
      - 'tools/selective_speed_vec2_stock.py'
      - 'tools/test_selective_vec2_stock_speed.py'
      - 'tools/selective_linker.py'
      - '.github/workflows/vec2-stock-public-speed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Two relocated original VEC2 public speed models, 512 pairs each
        run: |
          python3 -m compileall -q tools/selective_speed_vec2_stock.py tools/test_selective_vec2_stock_speed.py tools/selective_linker.py
          python3 -m unittest discover -s tools -p 'test_selective_vec2_stock_speed.py' -v
          python3 -m unittest discover -s tools -p 'test_selective_vec2_normalize.py' -v

  native-vice:
    needs: source-model
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install pinned VICE headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build r46284 x64sc native
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Verify original SMC source and full signed Q1.15 in VICE both RAM maps
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_vec2_normalize.py
