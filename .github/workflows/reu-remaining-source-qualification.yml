name: REU remaining services source qualification

on:
  push:
    paths:
      - 'tools/reu_remaining_source_modules.py'
      - 'tools/reu_turbo32_standalone_package.py'
      - 'tools/test_reu_turbo32_standalone_package.py'
      - 'tools/test_reu_remaining_source_modules.py'
      - 'relocatable_source/turbo/turbo32_*'
      - 'relocatable_source/v4_reu_16m/v4_qs16_relocatable.asm'
      - '.github/workflows/reu-remaining-source-qualification.yml'
  pull_request:
    paths:
      - 'tools/reu_remaining_source_modules.py'
      - 'tools/reu_turbo32_standalone_package.py'
      - 'tools/test_reu_turbo32_standalone_package.py'
      - 'tools/test_reu_remaining_source_modules.py'
      - 'relocatable_source/turbo/turbo32_*'
      - 'relocatable_source/v4_reu_16m/v4_qs16_relocatable.asm'
      - '.github/workflows/reu-remaining-source-qualification.yml'

jobs:
  source-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute relocated Turbo32 and source-backed QS16 REU arithmetic
        run: |
          python3 -m unittest discover -s tools -p 'test_reu_remaining_source_modules.py' -v
          python3 -m unittest discover -s tools -p 'test_reu_turbo32_standalone_package.py' -v
