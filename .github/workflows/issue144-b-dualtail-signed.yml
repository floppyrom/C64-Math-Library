name: Issue144 B dual-tail signed DIV and MOD interoperability
on:
  push:
    branches: [issue144-b-dualtail-signed-integration-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-signed-cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check signed quadrants, extrema and zero-divisor on 3 profiles 2 relocation layouts
        run: python3 tools/issue144_dualtail_signed_public_regression.py
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-pinned headless VICE 3.10+r46274
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Original and candidate signed DIV MOD V2 V3 V4 reference and alternate map
        run: python3 tools/native_issue144_dualtail_signed32_public.py
