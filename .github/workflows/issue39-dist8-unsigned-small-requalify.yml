name: Issue39 DIST8 unsigned small-width provenance requalification
on:
  push:
    branches: [issue39-dist8-source-transplant-20261014]
    paths:
      - .github/workflows/issue39-dist8-unsigned-small-requalify.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rerun-numeric-corpus-and-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-dist8-source-transplant-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-qualify entire frozen unsigned small-width corpus
        run: python3 tools/revalidate_issue39_unsigned_small_provenance.py
      - name: Reseal SHA and package audit after verified identical metrics
        run: |
          python3 - <<'PY'
          import subprocess,sys
          from tools.stage_issue39_v1_3216_ool_release import reseal
          subprocess.run(["make","clean"],check=True)
          for _ in range(3):
              reseal()
              subprocess.run([sys.executable,"tools/package_audit.py"],check=True)
          PY
      - name: Commit rebenchmarked proof without editing production PRGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'ci(issue39): refresh 53760-call unsigned proof hashes with identical numeric metrics'
          git push origin HEAD:issue39-dist8-source-transplant-20261014
