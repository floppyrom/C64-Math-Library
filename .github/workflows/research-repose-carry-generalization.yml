name: Research Repose carry generalization

on:
  push:
    branches:
      - opt/repose-carry-generalization

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benchmark SMUL16 V1-V4
        run: python3 tools/bench_smul16_live_x1.py
      - name: Benchmark SMUL16 V5 hybrid
        run: python3 tools/bench_smul16_v5_hybrid.py
      - name: Benchmark SMUL32 NN carry reuse
        run: python3 tools/bench_smul32_nn_carry_reuse.py
