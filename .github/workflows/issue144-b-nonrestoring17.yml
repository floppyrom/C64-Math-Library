name: Issue144 B nonrestoring 17-bit 6510 low-tail screen
on:
  push:
    branches: [issue144-b-nonrestoring17-lowtail-screen-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble both real 6510 tails and check arithmetic and paired cycles
        run: python3 tools/issue144_u3216_nonrestoring17_screen.py --random-extra 10000
