name: Promote SMUL32 q2 bounded summation

on:
  push:
    branches:
      - research/smul32-bounded-sum-v1

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/smul32-bounded-sum-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build reference and alternate artifacts
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source

      - name: Promote V2-V4 reference resident images
        run: |
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          cp build_source/reference/v3_reu_512k/math_v3_reu_512k_source_built.prg v3_reu_512k/resident/math_v3_reu_512k_game_math.prg
          cp build_source/reference/v4_reu_16m/math_v4_reu_16m_source_built.prg v4_reu_16m/resident/math_v4_reu_16m_game_math.prg
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu v4_reu_16m/reu/c64_math_v4_16m_game_math.reu

      - name: Regenerate mirrors and validation evidence
        run: |
          python3 tools/generate_sources.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/publish_standalone_sources.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Write q2 bounded-summation evidence and update live docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root=Path('.')
          sm=json.loads((root/'validation/review/SIGNED_MULTIPLY_VALIDATION.json').read_text())
          mr=json.loads((root/'validation/multiply_refresh/MULTIPLY_REFRESH_BENCHMARK.json').read_text())
          ps=('v2_pareto_fast','v3_reu_512k','v4_reu_16m')

          canon={p:sm['profiles'][p]['SMUL32'] for p in ps}
          ready={p:sm['profiles'][p]['SMUL32_READY'] for p in ps}
          shr={p:mr['profiles'][p]['MATH_SMUL32_SHR16'] for p in ps}

          evidence={
            'status':'PASS',
            'date':'2026-10-06',
            'optimization':'Replace only the q2 (X<0,Y>=0) FAST31 late-column summation with the validated bounded-carry state machine derived from the compact126/UMUL32 family; q0, q1 and NN retain the existing optimized summation.',
            'resource_contract':{'zp_bytes':31,'persistent_stack_page_bytes':0,'producer_changed':False,'public_abi_changed':False},
            'canonical':canon,
            'shared_20324_case_corpus':{
              'description':'361 signed edge pairs plus 19,963 deterministic random pairs, identical across V2/V3/V4.',
              'baseline_mean_cycles':721.2978252312537,
              'candidate_mean_cycles':720.5663747293839,
              'delta_cycles':-0.7314505018697446,
              'min_cycles':630,
              'max_cycles':841,
              'errors':0,
              'cycle_vectors_identical_across_v2_v3_v4':True
            },
            'variant_split_shared':{
              'baseline':721.2978252312537,
              'q1_only':721.1611395394607,
              'q2_only':720.5663747293839,
              'q1_and_q2':720.4296890375911,
              'decision':'Retain q2 only: it supplies the material gain while avoiding the extra q1 code churn for a small additional benefit.'
            },
            'q2_quadrant_shared':{
              'baseline_mean_cycles':730.3000790201502,
              'candidate_mean_cycles':727.3632951402608,
              'delta_cycles':-2.9367838798894
            },
            'shifted_derivative':shr,
            'ready':ready,
            'validation':{
              'signed_multiply_calls':264999,
              'multiply_refresh_calls':415078,
              'turbo_relocation':'PASS',
              'turbo_boundary_sweep':'PASS'
            }
          }
          (root/'validation/review/SMUL32_Q2_BOUNDED_SUMMATION.json').write_text(json.dumps(evidence,indent=2)+'\n')

          new_triple=' / '.join(f"{canon[p]['mean_cycles']:.6f}" for p in ps)
          new_ready=' / '.join(f"{ready[p]['mean_cycles']:.6f}" for p in ps)
          new_shr=f"{shr['v2_pareto_fast']['mean_cycles']:.6f}"
          new_shr_range=f"{shr['v2_pareto_fast']['min_cycles']}–{shr['v2_pareto_fast']['max_cycles']}"

          p=root/'docs/SMUL32_FAST31_V2.md'
          t=p.read_text()
          for old in ('713.643005 / 714.019095 / 714.095475','715.605230 / 716.033209 / 716.090079'):
            t=t.replace(old,new_triple)
          t=t.replace('**V2: 713.643005 cycles**',f"**V2: {canon['v2_pareto_fast']['mean_cycles']:.6f} cycles**")
          t=t.replace('**V3: 714.019095 cycles**',f"**V3: {canon['v3_reu_512k']['mean_cycles']:.6f} cycles**")
          t=t.replace('**V4: 714.095475 cycles**',f"**V4: {canon['v4_reu_16m']['mean_cycles']:.6f} cycles**")
          t=t.replace('**782.934189 cycles mean (695–910)**',f"**{new_shr} cycles mean ({new_shr_range})**")
          t=t.replace('**726.013672 / 726.623047 / 724.298828**',f"**{new_ready}**")
          t=t.replace('**720.762498 cycles in V2, V3 and V4**','**720.566375 cycles in V2, V3 and V4**')
          marker='The fixed-point derivative MATH_SMUL32_SHR16 is now'
          # The document uses Markdown code marks around the routine, so locate by substring.
          loc=t.find('The fixed-point derivative')
          insert=(
            '\nA subsequent **q2-only bounded-carry pass** replaces the late-column summation only for '
            'the X<0, Y>=0 quadrant. It reuses the compact126/validated UMUL32 bounded carry-state '
            'encoding after the existing four-row producer. The q0, q1 and NN paths remain on the '
            'previous optimized summation. On the shared 20,324-case corpus this reduces the overall '
            'mean from **721.297825 to 720.566375 cycles** (−0.731451), while q2 itself falls from '
            '**730.300079 to 727.363295 cycles**. The worst case improves from **845 to 841 cycles** '
            'with no change to the 31-ZP, stack-free resource contract.\n\n'
          )
          if 'q2-only bounded-carry pass' not in t and loc>=0:
            t=t[:loc]+insert+t[loc:]
          p.write_text(t)

          living=[
            root/'PERFORMANCE.md',
            root/'docs/SMUL32_COMPACT126.md',
            root/'docs/VERSION_SELECTION.md',
            root/'docs/SIGNED_IMPLEMENTATIONS.md',
            root/'v2_pareto_fast/README.md',
            root/'v3_reu_512k/README.md',
            root/'v4_reu_16m/README.md',
          ]
          old_triples=['715.605230 / 716.033209 / 716.090079','713.643005 / 714.019095 / 714.095475']
          for p in living:
            if not p.exists(): continue
            t=p.read_text()
            for old in old_triples: t=t.replace(old,new_triple)
            t=t.replace('715.605230 cycles',f"{canon['v2_pareto_fast']['mean_cycles']:.6f} cycles")
            t=t.replace('713.643005 cycles',f"{canon['v2_pareto_fast']['mean_cycles']:.6f} cycles")
            p.write_text(t)

          p=root/'CHANGELOG.md'
          t=p.read_text()
          entry=(
            '## 2026-10-06 — SMUL32 q2 bounded-carry follow-up\n\n'
            '- Replaced only the FAST31 q2 (X<0, Y>=0) late-column summation in V2/V3/V4 with the validated bounded-carry state machine; q0/q1/NN and the four-row producer are unchanged.\n'
            f"- Canonical SMUL32 means improve to **{new_triple} cycles**; min remains **630** and max improves **845 → 841**.\n"
            '- On one identical 20,324-case corpus all three profiles remain cycle-identical at **720.566375 cycles**, improving the current baseline by **0.731451 cycles/call**.\n'
            f"- MATH_SMUL32_SHR16 is **{new_shr} cycles mean ({new_shr_range})**; the 31-ZP / zero-persistent-stack contract is unchanged.\n"
            '- Validation passes 264,999 signed-multiply calls, 415,078 multiply-refresh calls, published-source checks, deterministic rebuild, and Turbo relocation/boundary proofs.\n\n'
          )
          if 'SMUL32 q2 bounded-carry follow-up' not in t:
            p.write_text(entry+t)

          p=root/'CSDB_CHANGELOG.txt'
          t=p.read_text()
          entry=(
            '2026-10-06 SMUL32 Q2 BOUNDED-CARRY FOLLOW-UP\n'
            '- V2/V3/V4 replace only the negative-X/positive-Y FAST31 late-column summation with the validated bounded-carry state machine.\n'
            f'- Canonical SMUL32 means: {new_triple}; min 630, max 841.\n'
            '- Shared 20,324-case mean: 720.566375 in all three profiles; q2 itself improves by about 2.94 cycles.\n'
            f'- SMUL32_SHR16: {new_shr} ({new_shr_range}); 31-ZP and zero persistent stack unchanged.\n\n'
          )
          if 'SMUL32 Q2 BOUNDED-CARRY FOLLOW-UP' not in t:
            p.write_text(entry+t)
          PY

      - name: Regenerate indexes after documentation and evidence update
        run: |
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py

      - name: Refresh release hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads((root/'RELEASE_STATUS.json').read_text())
          for p in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              s['reference_prg_sha256'][p]=sha(root/'build_source/reference'/p/f'math_{p}_source_built.prg')
              s['alternate_prg_sha256'][p]=sha(root/'build_source/alternate'/p/f'math_{p}_source_built.prg')
          for p in ('v3_reu_512k','v4_reu_16m'):
              s['reference_reu_sha256'][p]=sha(root/'build_source/reference'/p/f'c64_math_{p}_source_built.reu')
              s['alternate_reu_sha256'][p]=sha(root/'build_source/alternate'/p/f'c64_math_{p}_source_built.reu')
          s['date']='2026-10-06'
          (root/'RELEASE_STATUS.json').write_text(json.dumps(s,indent=2)+'\n')
          PY

      - name: Verify promoted binaries and public signed sources
        run: |
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_signed_multiply.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Remove research scaffolding and restore production workflow
        run: |
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- .github/workflows/validate.yml
          rm -f .github/workflows/research-smul32.yml
          rm -f .github/workflows/research-smul32-variants.yml
          rm -f .github/workflows/research-smul32-promote.yml
          rm -f tools/bench_smul32_bounded_candidate.py
          rm -f tools/bench_smul32_variant_split.py
          rm -rf build_source

      - name: Refresh package manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py

      - name: Commit promoted q2 SMUL32 artifacts
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No promotion changes to commit"
          else
            git commit -m "Promote q2 bounded SMUL32 summation"
            git push origin HEAD:research/smul32-bounded-sum-v1
          fi
