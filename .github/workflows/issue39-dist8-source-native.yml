name: Issue39 DIST8 source-transplant native VICE proof
on:
  push:
    branches: [issue39-dist8-source-transplant-20261014]
    paths:
      - .github/workflows/issue39-dist8-source-native.yml
      - tools/native_issue39_dist8_source.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-five-profile-dist8:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-dist8-source-transplant-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble source-backed reference maps and V5 hybrid
        run: |
          python3 tools/assemble_sources.py --profile all --config-kind reference
          python3 tools/build_hybrid.py --config-kind reference
      - name: Install SHA-pinned VICE headless
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Run native DIST8 old-vs-optimized paired proof
        run: python3 tools/native_issue39_dist8_source.py
      - name: Seal research proof without promoting candidate PRGs
        run: |
          python3 - <<'PY'
          import subprocess,sys
          from tools.stage_issue39_v1_3216_ool_release import reseal
          subprocess.run(["make","clean"],check=True)
          for _ in range(3):
              reseal()
              subprocess.run([sys.executable,"tools/package_audit.py"],check=True)
          PY
      - name: Commit native evidence and checksum manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: certify native VICE DIST8 source candidate without binary publication'
          git push origin HEAD:issue39-dist8-source-transplant-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-dist8-source-native
          path: validation/review/ISSUE39_DIST8_SOURCE_NATIVE_2026-10-14.json
