name: Promote SMUL32 NN X3 prebind

on:
  push:
    branches:
      - research/smul32-nn-x3-prebind-v1

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  promote:
    if: github.event.head_commit.message == 'trigger NN X3 prebind promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/smul32-nn-x3-prebind-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build reference and alternate artifacts
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source

      - name: Promote V2-V4 resident images
        run: |
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          cp build_source/reference/v3_reu_512k/math_v3_reu_512k_source_built.prg v3_reu_512k/resident/math_v3_reu_512k_game_math.prg
          cp build_source/reference/v4_reu_16m/math_v4_reu_16m_source_built.prg v4_reu_16m/resident/math_v4_reu_16m_game_math.prg
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu v4_reu_16m/reu/c64_math_v4_16m_game_math.reu

      - name: Regenerate and validate promoted sources
        run: |
          python3 tools/generate_sources.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/publish_standalone_sources.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Write NN X3 prebind evidence and docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          sm=json.loads((root/'validation/review/SIGNED_MULTIPLY_VALIDATION.json').read_text())
          mr=json.loads((root/'validation/multiply_refresh/MULTIPLY_REFRESH_BENCHMARK.json').read_text())
          ps=('v2_pareto_fast','v3_reu_512k','v4_reu_16m')
          canon={p:sm['profiles'][p]['SMUL32'] for p in ps}
          ready={p:sm['profiles'][p]['SMUL32_READY'] for p in ps}
          shr={p:mr['profiles'][p]['MATH_SMUL32_SHR16'] for p in ps}
          evidence={
            'status':'PASS','date':'2026-10-06',
            'optimization':'Pre-bind original X3 table operands on NN dispatcher entry while X3 is already live in A. The common x0!=0 path avoids a later absolute reload; the rare x0==0 carry path overwrites the speculative bindings. Producer, summation, ABI and resource footprint are unchanged.',
            'resource_contract':{'zp_bytes':31,'persistent_stack_page_bytes':0,'producer_changed':False,'summation_changed':False,'public_abi_changed':False},
            'canonical':canon,
            'shared_6361_case_corpus':{
              'description':'361 signed edge pairs plus 6,000 deterministic random pairs, identical across V2/V3/V4.',
              'baseline_mean_cycles':717.7351045433109,
              'candidate_mean_cycles':716.8025467693759,
              'delta_cycles':-0.9325577739349159,
              'min_cycles':630,'max_cycles':838,'errors':0,
              'cycle_vectors_identical_across_v2_v3_v4':True},
            'nn_profile_20025':{
              'baseline_mean_cycles':734.7148064918852,
              'candidate_mean_cycles':730.8076903870162,
              'delta_cycles':-3.907116104868914,
              'baseline_min_cycles':679,'candidate_min_cycles':675,
              'baseline_max_cycles':837,'candidate_max_cycles':833,'errors':0},
            'rare_x0_zero_tradeoff':{'common_delta_cycles':-4,'rare_path_delta_cycles':16},
            'shifted_derivative':shr,'ready':ready,
            'validation':{'signed_multiply_calls':264999,'multiply_refresh_calls':415078,'turbo_relocation':'PASS','turbo_boundary_sweep':'PASS'}
          }
          (root/'validation/review/SMUL32_NN_X3_PREBIND.json').write_text(json.dumps(evidence,indent=2)+'\n')

          old='712.403902 / 712.856787 / 712.948941'
          new=' / '.join(f"{canon[p]['mean_cycles']:.6f}" for p in ps)
          sh=f"{shr['v2_pareto_fast']['mean_cycles']:.6f}"
          shrng=f"{shr['v2_pareto_fast']['min_cycles']}–{shr['v2_pareto_fast']['max_cycles']}"
          for p in [root/'PERFORMANCE.md',root/'docs/SMUL32_COMPACT126.md',root/'docs/VERSION_SELECTION.md',
                    root/'docs/SIGNED_IMPLEMENTATIONS.md',root/'v2_pareto_fast/README.md',
                    root/'v3_reu_512k/README.md',root/'v4_reu_16m/README.md']:
            if p.exists(): p.write_text(p.read_text().replace(old,new))

          p=root/'docs/SMUL32_FAST31_V2.md'; t=p.read_text().replace(old,new)
          t=t.replace('**V2: 712.403902 cycles**',f"**V2: {canon['v2_pareto_fast']['mean_cycles']:.6f} cycles**")
          t=t.replace('**V3: 712.856787 cycles**',f"**V3: {canon['v3_reu_512k']['mean_cycles']:.6f} cycles**")
          t=t.replace('**V4: 712.948941 cycles**',f"**V4: {canon['v4_reu_16m']['mean_cycles']:.6f} cycles**")
          marker='The fixed-point derivative'
          para=(
            'The **NN X3 prebind follow-up** exploits a dispatcher lifetime: on X<0,Y<0 entry, '
            'original X3 is still live in A. The common x0!=0 path installs its X3 table bindings '
            'before low-byte magnitude formation, eliminating the later absolute reload; the rare '
            'x0==0 carry path simply overwrites them. On an identical 6,361-case corpus all three '
            'profiles improve from **717.735105 to 716.802547 cycles** (−0.932558) with identical '
            'cycle vectors. A focused 20,025-case NN corpus improves **734.714806 to 730.807690** '
            '(−3.907116), with max **837 → 833**. Producer, summation, ABI, 31-ZP footprint and '
            'zero persistent stack-page usage are unchanged.\n\n')
          if 'NN X3 prebind follow-up' not in t:
            loc=t.find(marker); t=t[:loc]+para+t[loc:] if loc>=0 else t+'\n\n'+para
          p.write_text(t)

          p=root/'PERFORMANCE.md'; t=p.read_text()
          start=t.find('**Cross-profile note:**')
          if start>=0:
            end=t.find('\n\n| Typed routine |',start)
            if end>=0:
              note=('**Cross-profile note:** the small V2/V3/V4 spread in the canonical SMUL32 means '
                    'comes from profile-specific deterministic random seeds. On one identical '
                    '**6,361-case** corpus, all three current implementations are cycle-identical at '
                    '**716.802547 cycles**, with identical per-call cycle vectors. The spread is not '
                    'a relocation or REU penalty.')
              t=t[:start]+note+t[end:]
          p.write_text(t)

          p=root/'CHANGELOG.md'; t=p.read_text()
          entry=(
            '## 2026-10-06 — SMUL32 NN X3 prebind\n\n'
            '- Pre-bound original X3 table operands on the X<0,Y<0 dispatcher path while X3 is already live in A; common x0!=0 calls avoid a later absolute reload, while the rare carry path overwrites the speculative bindings.\n'
            f'- Canonical SMUL32 means improve to **{new} cycles**; min/max remain **630–838**.\n'
            '- Shared 6,361-case mean improves **717.735105 → 716.802547** in all V2/V3/V4 profiles; focused NN improves **734.714806 → 730.807690**, max **837 → 833**.\n'
            f'- MATH_SMUL32_SHR16 is **{sh} cycles mean ({shrng})**; producer, summation, 31-ZP and zero-persistent-stack contracts are unchanged.\n'
            '- Full signed-multiply, multiply-refresh, deterministic rebuild, published-source, Turbo relocation/boundary and package gates pass.\n\n')
          if 'SMUL32 NN X3 prebind' not in t: p.write_text(entry+t)

          p=root/'CSDB_CHANGELOG.txt'; t=p.read_text()
          entry=(f'2026-10-06 SMUL32 NN X3 PREBIND\n- V2/V3/V4 pre-bind NN X3 operands from the dispatcher A lifetime, saving 4 cycles on the common x0!=0 path.\n- Canonical SMUL32 means: {new}; min 630, max 838.\n- Shared 6,361-case mean: 716.802547; focused NN: 730.807690, max 833.\n- SMUL32_SHR16: {sh} ({shrng}); 31 ZP, zero persistent stack.\n\n')
          if 'SMUL32 NN X3 PREBIND' not in t: p.write_text(entry+t)
          PY

      - name: Regenerate indexes after docs
        run: |
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py

      - name: Refresh release hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads((root/'RELEASE_STATUS.json').read_text())
          for p in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
            s['reference_prg_sha256'][p]=sha(root/'build_source/reference'/p/f'math_{p}_source_built.prg')
            s['alternate_prg_sha256'][p]=sha(root/'build_source/alternate'/p/f'math_{p}_source_built.prg')
          for p in ('v3_reu_512k','v4_reu_16m'):
            s['reference_reu_sha256'][p]=sha(root/'build_source/reference'/p/f'c64_math_{p}_source_built.reu')
            s['alternate_reu_sha256'][p]=sha(root/'build_source/alternate'/p/f'c64_math_{p}_source_built.reu')
          s['date']='2026-10-06'; (root/'RELEASE_STATUS.json').write_text(json.dumps(s,indent=2)+'\n')
          PY

      - name: Verify promoted binaries
        run: |
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Remove promotion scaffolding
        run: |
          rm -f .github/workflows/research-smul32-nn-x3-prebind.yml
          rm -f .github/workflows/promote-smul32-nn-x3-prebind.yml
          rm -f tools/bench_smul32_nn_x3_prebind.py
          rm -rf build_source

      - name: Refresh package manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py

      - name: Commit promoted NN X3 artifacts
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No promotion changes"
          else
            git commit -m "Promote SMUL32 NN X3 prebind"
            git push origin HEAD:research/smul32-nn-x3-prebind-v1
          fi
