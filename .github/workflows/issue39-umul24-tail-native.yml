name: Issue39 UMUL24 V2-V4 native source release proof
on:
  push:
    branches: [issue39-umul24-tail-fallthrough-screen]
    paths:
      - tools/native_issue39_umul24_tail_release.py
      - tools/finalize_issue39_umul24_tail_native.py
      - .github/workflows/issue39-umul24-tail-native.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resident-v2v4-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-umul24-tail-fallthrough-screen
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned VICE headless r46274 for native x64sc proof
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Native VICE 576 source-installed old/new UMUL24 + SMUL24 public calls
        run: |
          python3 tools/native_issue39_umul24_tail_release.py
      - name: Seal native report, status, documentation and package checksum ledger
        run: python3 tools/finalize_issue39_umul24_tail_native.py
      - name: Commit fully audited native release evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: seal 576 VICE 24bit multiply resident calls and checksum manifest'
          git push origin HEAD:issue39-umul24-tail-fallthrough-screen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-umul24-tail-native
          path: validation/review/ISSUE39_UMUL24_TAIL_NATIVE_2026-10-13.json
