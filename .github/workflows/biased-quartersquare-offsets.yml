name: Biased quarter-square offsets — exact identities

on:
  pull_request:
    paths:
      - 'routines/multiply/mul_u16_u16_u32_shifted*.asm'
      - 'tools/test_biased_quartersquare_offsets.py'
      - 'docs/BIASED_QUARTERSQUARE_CARRY_OFFSETS.md'
      - '.github/workflows/biased-quartersquare-offsets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-bias-and-carry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all 65536 byte products, 511 offsets and historical tables
        run: python3 -m unittest discover -s tools -p 'test_biased_quartersquare_offsets.py' -v
      - name: Smoke speed-first installer with measured public-call workloads
        run: |
          make builder-speed OUT=build_bias_speed_smoke
          test -s build_bias_speed_smoke/math_selective.prg
          test -s build_bias_speed_smoke/math_api.inc
          test -s build_bias_speed_smoke/selective_manifest.json
