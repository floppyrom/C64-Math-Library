name: Research SMUL32 q2 profile

on:
  push:
    branches:
      - research/smul32-q2-profile-v2

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  profile-q2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profile q2 branch paths
        run: python3 tools/profile_smul32_q2.py
      - name: Sweep q2 core phase
        run: python3 tools/sweep_smul32_q2_phase.py
