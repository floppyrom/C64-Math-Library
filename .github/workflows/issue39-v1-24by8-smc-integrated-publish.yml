name: Issue39 V1 68-byte RAM SMC integrated release
on:
  push:
    branches: [issue39-v1-24by8-smc-integrated-release]
    paths: ['.github/workflows/issue39-v1-24by8-smc-integrated-publish.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-v1-24by8-smc-integrated-release
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stage verified source-built V1 RAM SMC
        run: python3 tools/stage_issue39_v1_24by8_smc_release.py
      - name: Validate seal and catalogs
        run: |
          python3 tools/package_audit.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
      - name: Commit full source-backed release on branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "issue39: publish qualified V1 68-byte RAM SMC short divisor release"
            git push origin HEAD:issue39-v1-24by8-smc-integrated-release
          fi
