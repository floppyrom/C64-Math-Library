name: Finalize SMUL32 package hashes

on:
  push:
    branches:
      - smul32-bounded-sum-exp

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Finalize SMUL32 docs and package hashes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smul32-bounded-sum-exp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove helper and refresh package manifest
        run: |
          rm .github/workflows/smul32-finalize.yml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
      - name: Commit final package hashes
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize SMUL32 docs and package hashes"
          git push origin HEAD:smul32-bounded-sum-exp
