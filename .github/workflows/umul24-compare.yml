name: UMUL24 old-vs-new comparison

on:
  push:
    branches:
      - optimize-umul24-directout

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build optimized reference
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile v2_pareto_fast --config-kind reference --out build_source
      - name: Compare shipped and optimized V2 on identical corpus
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, random, re, sys
          sys.path.insert(0,'tools')
          from mini6502 import CPU

          def parse_inc(path):
              out={}
              for line in Path(path).read_text().splitlines():
                  m=re.match(r'\s*([A-Z0-9_]+)\s*=\s*\$([0-9A-Fa-f]+)',line)
                  if m: out[m.group(1)]=int(m.group(2),16)
              return out

          def cpu_from_prg(prg_path,api_path):
              b=Path(prg_path).read_bytes(); load=b[0]|b[1]<<8
              mem=bytearray(65536); mem[load:load+len(b)-2]=b[2:]
              api=parse_inc(api_path); cpu=CPU(mem); cpu.d=0; cpu.call(api['MATH_INIT'],2_000_000)
              return cpu,api

          edges=(0,1,2,3,0x7f,0x80,0xff,0x100,0x101,0x7fff,0x8000,0xffff,0x10000,0x10001,0x7fffff,0x800000,0xfffffe,0xffffff)
          cases=[(x,y) for x in edges for y in edges]
          rng=random.Random(0x24240024)
          cases.extend((rng.randrange(1<<24),rng.randrange(1<<24)) for _ in range(10_000))

          old,oa=cpu_from_prg('v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg','v2_pareto_fast/resident/math_api.inc')
          man=json.loads(Path('build_source/reference/v2_pareto_fast/source_build_manifest.json').read_text())
          new,na=cpu_from_prg(Path('build_source/reference/v2_pareto_fast')/man['output_prg'],'build_source/reference/v2_pareto_fast/math_api.inc')

          def run(cpu,api):
              X=api['MATH_X'];Y=api['MATH_Y'];Z=api['MATH_Z'];v=[]
              for x,y in cases:
                  for i in range(3):
                      cpu.mem[X+i]=(x>>(8*i))&255;cpu.mem[Y+i]=(y>>(8*i))&255
                  cy=cpu.call(api['MATH_UMUL24'],20_000)
                  got=sum(cpu.mem[Z+i]<<(8*i) for i in range(6))
                  assert got==x*y and cpu.c==0
                  v.append(cy)
              return v
          ov=run(old,oa);nv=run(new,na)
          dif=[a-b for a,b in zip(ov,nv)]
          print(f'OLD mean={sum(ov)/len(ov):.6f} min={min(ov)} max={max(ov)}')
          print(f'NEW mean={sum(nv)/len(nv):.6f} min={min(nv)} max={max(nv)}')
          print(f'DELTA mean={sum(dif)/len(dif):.6f} min={min(dif)} max={max(dif)}')
          from collections import Counter
          print('DELTA_CLASSES',sorted(Counter(dif).items()))
          PY
