name: Issue144 independent unsigned 32bit SHR16 producer research
on:
  push:
    branches: [issue144-umul32-shr16-independent-clone-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clone-model:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generation syntax
        run: |
          python3 - <<'PY'
          import ast
          ast.parse(open('tools/issue144_shr16_independent_clone.py').read())
          ast.parse(open('tools/native_issue144_shr16_independent_clone.py').read())
          PY
      - name: Source-assembled relocated independent 32x32 core, three profiles and interleaved calls
        run: python3 tools/issue144_shr16_independent_clone.py --limit 2409
      - name: Install checksum-pinned native VICE
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Native VICE three profile original and clone public result proof
        run: python3 tools/native_issue144_shr16_independent_clone.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue144-independent-clone-cpu-qualification
          path: |
            validation/review/ISSUE144_SHR16_STANDALONE_CLONE_CPU_MODEL.json
            validation/review/ISSUE144_SHR16_INDEPENDENT_CLONE_NATIVE_VICE.json
          if-no-files-found: warn
