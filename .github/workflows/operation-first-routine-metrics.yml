name: Generate 56-operation speed and footprint catalog
on:
  push:
    branches:
      - docs/individual-operation-metrics-20261021
    paths:
      - tools/report_operation_first_metrics.py
      - .github/workflows/operation-first-routine-metrics.yml
  pull_request:
    paths:
      - tools/report_operation_first_metrics.py
      - docs/OPERATION_FIRST_ROUTINE_METRICS.md
      - benchmarks/OPERATION_FIRST_VARIANT_METRICS.csv
      - validation/OPERATION_FIRST_VARIANT_METRICS.json
      - .github/workflows/operation-first-routine-metrics.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-reseal:
    if: github.event_name == 'push' && github.ref == 'refs/heads/docs/individual-operation-metrics-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently benchmark every public API and link all source variants
        run: python3 tools/report_operation_first_metrics.py
      - name: Remove temporary Python bytecode before package audit
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Reseal full immutable distribution after publishing measured files
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          root=Path(".")
          def reseal():
              paths=sorted((p for p in root.rglob("*") if p.is_file()
                  and ".git" not in p.parts and p.name!="SHA256SUMS.txt"),
                  key=lambda p: p.as_posix())
              (root/"SHA256SUMS.txt").write_text(
                  "\n".join(hashlib.sha256(p.read_bytes()).hexdigest()
                  +"  "+p.as_posix() for p in paths)+"\n")
          for i in range(6):
              prior=(root/"validation/PACKAGE_AUDIT.json").read_bytes()
              reseal()
              subprocess.run(["python3","tools/package_audit.py"],check=True)
              if prior==(root/"validation/PACKAGE_AUDIT.json").read_bytes():
                  break
          else:
              raise RuntimeError("SHA package audit did not stabilize")
          reseal()
          subprocess.run(["python3","tools/package_audit.py"],check=True)
          assert prior==(root/"validation/PACKAGE_AUDIT.json").read_bytes()
          PY
      - name: Commit source-measured metrics and exact checksums
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/OPERATION_FIRST_ROUTINE_METRICS.md \
            benchmarks/OPERATION_FIRST_VARIANT_METRICS.csv \
            validation/OPERATION_FIRST_VARIANT_METRICS.json \
            SHA256SUMS.txt validation/PACKAGE_AUDIT.json
          git diff --cached --quiet || git commit -m 'perf: publish measured 56-operation source variants and checksum seal'
          git push origin "HEAD:$GITHUB_REF_NAME"
  verify-published-data:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all source SHA, cycles, RAM/ZP, stack and chart rows
        run: python3 tools/report_operation_first_metrics.py --verify
