name: Source-built standalone Turbo32 native REU preflight
on:
  pull_request:
    paths:
      - 'tools/reu_turbo32_standalone_package.py'
      - 'tools/test_reu_turbo32_standalone_package.py'
      - 'tools/native_reu_turbo32_standalone.py'
      - 'tools/reu_remaining_source_modules.py'
      - 'relocatable_source/turbo/turbo32_*'
      - '.github/workflows/reu-turbo32-native-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-reu-512k-and-16m:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source/CPU-model Turbo32 independent package proof
        run: |
          python3 -m unittest discover -s tools -p 'test_reu_remaining_source_modules.py' -v
          python3 -m unittest discover -s tools -p 'test_reu_turbo32_standalone_package.py' -v
      - name: Install pinned VICE x64sc build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build exact VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Native REU Turbo32 upload, two batches, absent hardware and mirror rejection
        run: |
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_reu_turbo32_standalone.py --out build/reu-native/turbo32-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turbo32-reu-physical-dma-preflight
          path: build/reu-native/turbo32-preflight.json
          retention-days: 14
