name: Issue144 V2V3 normal resident 47-cycle ISQRT32 integration
on:
  push:
    branches: [issue144-isqrt32-normalresident-production-v23-20261015]
  pull_request:
    paths:
      - 'tools/issue144_isqrt32_normal_resident_screen.py'
      - 'tools/native_issue144_isqrt32_normal_resident.py'
      - 'tools/source_relocation.py'
      - 'relocatable_source/v2_pareto_fast/**'
      - 'relocatable_source/v3_reu_512k/**'
      - '.github/workflows/issue144-isqrt32-normal-resident-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-built normal V2 and V3, both relocations, paired public sqrt and mixed ISQRT16
        run: python3 tools/issue144_isqrt32_normal_resident_screen.py --count 1200
      - name: Canonical generator reproducibly retains the final-owner seed
        run: |
          python3 tools/generate_sources.py
          git diff --exit-code -- relocatable_source/v2_pareto_fast/math_relocatable.asm relocatable_source/v3_reu_512k/math_relocatable.asm relocatable_source/SOURCE_GENERATION.json
      - name: Build all four V2/V3 source layouts
        run: |
          for profile in v2_pareto_fast v3_reu_512k; do
            for layout in reference alternate; do
              python3 tools/assemble_sources.py --profile "$profile" --config-kind "$layout" --out build_issue144_isqrt32
            done
          done
  native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned VICE NMOS 6510 emulator
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Actual x64sc resident public calls in V2/V3, reference/alternate and V3 real 512KiB REU
        run: python3 tools/native_issue144_isqrt32_normal_resident.py
