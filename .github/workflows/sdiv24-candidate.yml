name: Signed division candidate

on:
  push:
    branches:
      - opt/signed-divmod-campaign-20261008
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  signed-divmod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reference profiles
        run: |
          make reference
          python3 tools/build_hybrid.py --config-kind reference
      - name: Report SDIV32/16 candidate geometry
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from assemble_sources import preprocess
          from mini6502 import Assembler
          for profile in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              src=Path('relocatable_source')/profile/'math_relocatable.asm'
              cfg=Path('relocatable_source')/profile/'math_config_reference.inc'
              mem,labels,const=Assembler().assemble(preprocess(src,cfg))
              print(profile)
              for n in ('D32F_PUBLIC','D32F_PUBLIC_END','D32F_DIV_S32_16','D32F_PREFIX_END','D32F_DIV_U32_16'):
                  print(' ',n,hex(labels.get(n,const.get(n,0))))
              print(' adapter_bytes',labels['D32F_PUBLIC_END']-labels['D32F_PUBLIC'])
              print(' prefix_bytes',labels['D32F_PREFIX_END']-labels['D32F_DIV_S32_16'])
          PY
      - name: Install rebuilt candidate images
        run: |
          for p in v2_pareto_fast v3_reu_512k v4_reu_16m; do
            cp "build_source/reference/$p/math_${p}_source_built.prg" "$p/resident/math_${p}_game_math.prg"
            cp "build_source/reference/$p/math_api.inc" "$p/resident/math_api.inc"
          done
          cp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg
          cp build_hybrid/reference/v5_hybrid_lowzp/math_api.inc v5_hybrid_lowzp/resident/math_api.inc
      - name: Validate and benchmark signed division family
        run: |
          for p in v2_pareto_fast v3_reu_512k v4_reu_16m v5_hybrid_lowzp; do
            python3 tools/validate_signed_division.py --profile "$p" --out "/tmp/${p}_SIGNED_DIVISION.json"
            cat "/tmp/${p}_SIGNED_DIVISION.json"
          done
