name: SDIV24 candidate

on:
  push:
    branches:
      - opt/signed-divmod-campaign-20261008
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  v2-sdiv24:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reference profiles
        run: make reference
      - name: Report SDIV32/16 candidate geometry
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from assemble_sources import preprocess
          from mini6502 import Assembler
          src=Path('relocatable_source/v2_pareto_fast/math_relocatable.asm')
          cfg=Path('relocatable_source/v2_pareto_fast/math_config_reference.inc')
          mem,labels,const=Assembler().assemble(preprocess(src,cfg))
          for n in ('D32F_PUBLIC','D32F_OUTPUT','D32F_PUBLIC_END','D32F_DIV_S32_16','D32F_PREFIX_END','D32F_DIV_U32_16'):
              print(n, hex(labels.get(n,const.get(n,0))))
          print('adapter_bytes', labels['D32F_PUBLIC_END']-labels['D32F_PUBLIC'])
          print('prefix_bytes', labels['D32F_PREFIX_END']-labels['D32F_DIV_S32_16'])
          PY
      - name: Install rebuilt V2 candidate image
        run: |
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          cp build_source/reference/v2_pareto_fast/math_api.inc v2_pareto_fast/resident/math_api.inc
      - name: Validate and benchmark V2 signed division
        run: |
          python3 tools/validate_signed_division.py --profile v2_pareto_fast --out /tmp/SDIV24_CANDIDATE.json
          cat /tmp/SDIV24_CANDIDATE.json
