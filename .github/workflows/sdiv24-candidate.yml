name: Signed division candidate

on:
  push:
    branches:
      - opt/signed-divmod-campaign-20261008
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  signed-divmod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate package publication artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def write_manifest():
              root=Path('.')
              files=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
              with open('SHA256SUMS.txt','w') as out:
                  for p in files:
                      out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n")
          write_manifest()
          PY
          # First pass refreshes PACKAGE_AUDIT.json against the current tree.
          python3 tools/package_audit.py
          # PACKAGE_AUDIT.json is itself checksummed, so regenerate once more
          # and verify a second pass is byte-stable.
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          files=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          with open('SHA256SUMS.txt','w') as out:
              for p in files:
                  out.write(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n")
          PY
          python3 tools/package_audit.py
      - name: Commit package publication artifacts
        run: |
          if ! git diff --quiet -- SHA256SUMS.txt validation/PACKAGE_AUDIT.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add SHA256SUMS.txt validation/PACKAGE_AUDIT.json
            git commit -m "Refresh signed DIV/MOD package publication artifacts"
            git push
          fi
      - name: Upload package publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-divmod-package-artifacts
          path: |
            SHA256SUMS.txt
            validation/PACKAGE_AUDIT.json
          if-no-files-found: error
          retention-days: 1
      - name: Build reference profiles
        run: |
          make reference
          python3 tools/build_hybrid.py --config-kind reference
      - name: Report SDIV32/16 candidate geometry
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from assemble_sources import preprocess
          from mini6502 import Assembler
          for profile in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              src=Path('relocatable_source')/profile/'math_relocatable.asm'
              cfg=Path('relocatable_source')/profile/'math_config_reference.inc'
              mem,labels,const=Assembler().assemble(preprocess(src,cfg))
              print(profile)
              for n in ('D32F_PUBLIC','D32F_PUBLIC_END','D32F_DIV_S32_16','D32F_PREFIX_END','D32F_DIV_U32_16'):
                  print(' ',n,hex(labels.get(n,const.get(n,0))))
              print(' adapter_bytes',labels['D32F_PUBLIC_END']-labels['D32F_PUBLIC'])
              print(' prefix_bytes',labels['D32F_PREFIX_END']-labels['D32F_DIV_S32_16'])
          PY
      - name: Diagnose V5 SDIV32/32 ownership
        run: |
          python3 - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import assemble_sources as asm
          from tools.build_hybrid import load_prg
          cfg=Path('relocatable_source/v5_hybrid_lowzp/math_config_reference.inc')
          with tempfile.TemporaryDirectory() as td:
              out=Path(td)
              man=asm.build('v1_balanced',cfg,out)
              base,_lo,_hi=load_prg(out/man['output_prg'])
              final,_flo,_fhi=load_prg(Path('build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg'))
              for a,b,name in ((0x5E00,0x5E0C,'public'),(0xC12C,0xC222,'signed_wrapper'),(0x2A00,0x2B80,'magnitude_core')):
                  dif=[x for x in range(a,b) if base[x]!=final[x]]
                  print(name,hex(a),hex(b-1),'diff_count',len(dif),'first',hex(dif[0]) if dif else 'none')
                  for x in dif[:24]:
                      print(f'  {x:04X}: {base[x]:02X}->{final[x]:02X}')
              for x in (0x5E06,0x5E09,0xC12C,0xC13E,0xC1AD,0x2A00,0x2A2E):
                  print(f'bytes {x:04X}:',base[x:x+16].hex(),'=>',final[x:x+16].hex())
          PY
      - name: Install rebuilt candidate images
        run: |
          for p in v1_balanced v2_pareto_fast v3_reu_512k v4_reu_16m; do
            cp "build_source/reference/$p/math_${p}_source_built.prg" "$p/resident/math_${p}_game_math.prg"
            cp "build_source/reference/$p/math_api.inc" "$p/resident/math_api.inc"
          done
          cp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg
          cp build_hybrid/reference/v5_hybrid_lowzp/math_api.inc v5_hybrid_lowzp/resident/math_api.inc
      - name: Validate and benchmark signed division family
        run: |
          for p in v1_balanced v2_pareto_fast v3_reu_512k v4_reu_16m v5_hybrid_lowzp; do
            python3 tools/validate_signed_division.py --profile "$p" --out "/tmp/${p}_SIGNED_DIVISION.json"
            cat "/tmp/${p}_SIGNED_DIVISION.json"
          done
