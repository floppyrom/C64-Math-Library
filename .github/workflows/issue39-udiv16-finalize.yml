name: One-shot issue39 UDIV16 publication
on:
  push:
    branches: [issue39-udiv16-dead-branch-transplant]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and qualify all source maps and V5 hybrid
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference
          python3 tools/assemble_sources.py --profile all --config-kind alternate
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          python3 tools/validate_source_build.py all --build build_source/alternate --out validation/source_relocation
          python3 tools/verify_deterministic_rebuild.py
      - name: Republish mirrors and exhaustive/regression division proofs
        run: |
          python3 tools/publish_standalone_sources.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/validate_unsigned_division.py
          python3 tools/validate_signed_division.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
      - name: Republish performance and source catalogs
        run: |
          python3 tools/finalize_issue39_udiv16.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
      - name: Clean transient outputs and seal package
        run: |
          rm .github/workflows/issue39-udiv16-finalize.yml
          rm -rf build_source build_hybrid build_hybrid_repeat build_pareto
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          root=Path('.')
          def seal():
              paths=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=str)
              (root/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n' for p in paths))
          for _ in range(5):
              seal()
              subprocess.run(['python3','tools/package_audit.py'],check=True)
          seal()
          PY
          python3 tools/package_audit.py
      - name: Commit publication results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish issue39 UDIV16/UMOD16 micro-optimization proof and checksums'
          git push origin HEAD:issue39-udiv16-dead-branch-transplant
