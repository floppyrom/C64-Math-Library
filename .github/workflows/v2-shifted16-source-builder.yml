name: Historical V2 shifted16 full public source qualification

on:
  pull_request:
    paths:
      - 'tools/selective_v2_shifted_u3216.py'
      - 'tools/selective_speed_udiv16_shl8.py'
      - 'tools/selective_linker.py'
      - 'tools/test_selective_v2_shifted16_builder.py'
      - 'tools/native_selective_v2_shifted16.py'
      - '.github/workflows/v2-shifted16-source-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-assemble historical V2 and run complete public ABI regression
        run: |
          python3 -m compileall -q tools/selective_v2_shifted_u3216.py tools/test_selective_v2_shifted16_builder.py tools/native_selective_v2_shifted16.py tools/selective_speed_udiv16_shl8.py tools/selective_linker.py
          python3 tools/selective_v2_shifted_u3216.py
          python3 -m unittest discover -s tools -p 'test_selective_v2_shifted16_builder.py' -v

  native-vice:
    needs: source-and-model
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install native headless VICE dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned headless VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Confirm native emulator and exercise 192 shifted16 public calls
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_v2_shifted16.py
