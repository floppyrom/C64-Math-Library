    branches:
      - issue144-u3216-highdiv-q01-producer-screen-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-highword:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Paired shipped 16/16 helper and high-D q0/1 6510 CPU model
        run: python tools/issue144_u3216_highdiv_q01_stage_screen.py
