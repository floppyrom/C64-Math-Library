name: Research SMUL32 q2 tail BCC

on:
  push:
    branches:
      - opt/smul32-q2-tail-bcc

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate V2-V4 candidate
        run: python3 tools/bench_smul32_q2_tail_bcc.py
