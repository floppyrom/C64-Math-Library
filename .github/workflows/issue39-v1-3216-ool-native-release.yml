name: Issue39 V1/V5 32-16 source-installed native VICE release proof
on:
  push:
    branches: [issue39-v1-3216-ool-source-trial]
    paths:
      - 'tools/native_issue39_v1_3216_ool_source_release.py'
      - 'tools/finalize_issue39_v1_3216_ool_native.py'
      - '.github/workflows/issue39-v1-3216-ool-native-release.yml'
  pull_request:
    paths:
      - 'tools/native_issue39_v1_3216_ool_source_release.py'
      - 'tools/finalize_issue39_v1_3216_ool_native.py'
      - '.github/workflows/issue39-v1-3216-ool-native-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-source-installed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-v1-3216-ool-source-trial
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Pin official VICE r46274 Debian headless package
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Run 384 actual x64sc calls on old/new source-installed V1 and V5 full residents
        run: python3 tools/native_issue39_v1_3216_ool_source_release.py
      - name: Seal native proof, documentation, status and package audit
        if: github.event_name == 'push'
        run: python3 tools/finalize_issue39_v1_3216_ool_native.py
      - name: Commit native qualification only after all checks pass
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: seal 384 native VICE source-installed V1/V5 calls and package'
          git push origin HEAD:issue39-v1-3216-ool-source-trial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-v1-v5-3216-installed-native
          path: validation/review/ISSUE39_V1_3216_OOL_RELEASE_NATIVE.json
