name: Issue144 signed SHR16 quadrant screen (research only)
on:
  push:
    branches: [issue144-signed-shr16-hybrid-screen-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-shr16-model:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and research model syntax
        run: |
          python3 -m py_compile tools/issue144_signed_shr16_hybrid_research.py
      - name: Focused ABI, output and cycle screen
        run: python3 tools/issue144_signed_shr16_hybrid_research.py --limit 256
      - name: Full 2409 operand pairs on all three profiles
        run: python3 tools/issue144_signed_shr16_hybrid_research.py --limit 2409
      - name: Signed nonnegative specialist full same-input screen
        run: python3 tools/issue144_signed_nonnegative_shr16_optin.py --limit 2409
      - name: Source-assemble signed public entry installer and prove reversible patch
        run: python3 tools/issue144_signed_nonnegative_install_restore.py
      - name: Install checksum-pinned headless VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Real x64sc baseline and both signed source variants, V2 V3 V4
        run: python3 tools/native_issue144_signed_shr16_hybrid.py
      - name: Native x64sc nonnegative signed 32-bit SHR16 public entry proof
        run: python3 tools/native_issue144_signed_nonnegative_shr16.py
      - name: Stage only native-qualified signed specialist and rejected research, seal release
        if: github.event_name == 'push'
        run: python3 tools/stage_issue144_signed_shr16.py
      - name: Commit evidence, both changelogs and package seal
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue144: seal domain-qualified signed SHR16 optional and research'
          git push origin HEAD:issue144-signed-shr16-hybrid-screen-20261015
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue144-signed-shr16-architecture-cpu-model
          path: |
            validation/review/ISSUE144_SIGNED_SHR16_HYBRID_RESEARCH.json
            validation/review/ISSUE144_SIGNED_SHR16_HYBRID_NATIVE_VICE.json
            validation/review/ISSUE144_SIGNED_NONNEGATIVE_SHR16_OPTIN_MODEL.json
            validation/review/ISSUE144_SIGNED_NONNEGATIVE_SHR16_NATIVE_VICE.json
            validation/review/ISSUE144_SIGNED_NONNEGATIVE_INSTALLER_MODEL.json
          if-no-files-found: warn
