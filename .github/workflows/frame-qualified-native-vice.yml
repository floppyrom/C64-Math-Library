name: Frame-qualified exact installer PRG native VICE ABI

on:
  pull_request:
    paths:
      - 'tools/native_frame_qualified_config.py'
      - 'tools/test_native_frame_qualified_config.py'
      - 'tools/frame_qualified_config.py'
      - 'tools/mixed3_frame_parity.py'
      - '.github/workflows/frame-qualified-native-vice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-verified-binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify four pinned CLI PRG builds without an emulator
        run: |
          python3 -m compileall -q tools/native_frame_qualified_config.py tools/test_native_frame_qualified_config.py
          python3 -m unittest discover -s tools -p 'test_native_frame_qualified_config.py' -v
      - name: Install pinned VICE build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned x64sc r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Execute four exact frame-qualified installer binaries in native VICE
        run: |
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_frame_qualified_config.py
