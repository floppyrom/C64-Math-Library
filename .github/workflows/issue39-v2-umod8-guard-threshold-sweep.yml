name: Issue39 V2 UMOD8 guard boundary exhaustive
on:
  push:
    branches: [issue39-v2-umod8-guard-threshold-sweep]
    paths:
      - '.github/workflows/issue39-v2-umod8-guard-threshold-sweep.yml'
  pull_request:
    paths:
      - 'tools/screen_issue39_v2_umod8_guard_thresholds.py'
      - '.github/workflows/issue39-v2-umod8-guard-threshold-sweep.yml'
permissions:
  contents: read
jobs:
  exhaustive-v2-umod8-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Full domain two-path threshold sweep, ABI and replay
        run: python3 tools/screen_issue39_v2_umod8_guard_thresholds.py --out /tmp/issue39_v2_umod8_guard.json
      - uses: actions/upload-artifact@v4
        with:
          name: issue39-v2-umod8-exhaustive-guard-sweep
          path: /tmp/issue39_v2_umod8_guard.json
