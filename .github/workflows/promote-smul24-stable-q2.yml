name: Promote SMUL24 stable q2 input
# promotion trigger

on:
  push:
    branches:
      - research/smul24-stable-input-q2-v1

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  promote:
    if: github.event.head_commit.message == 'trigger SMUL24 stable q2 promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/smul24-stable-input-q2-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build all fixed and hybrid artifacts
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate

      - name: Promote V1-V5 resident images
        run: |
          cp build_source/reference/v1_balanced/math_v1_balanced_source_built.prg v1_balanced/resident/math_v1_balanced_game_math.prg
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          cp build_source/reference/v3_reu_512k/math_v3_reu_512k_source_built.prg v3_reu_512k/resident/math_v3_reu_512k_game_math.prg
          cp build_source/reference/v4_reu_16m/math_v4_reu_16m_source_built.prg v4_reu_16m/resident/math_v4_reu_16m_game_math.prg
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu v4_reu_16m/reu/c64_math_v4_16m_game_math.reu
          cp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg

      - name: Regenerate and validate promoted sources
        run: |
          python3 tools/generate_sources.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/publish_standalone_sources.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_smul24_directout.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Write SMUL24 evidence and changelogs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          sm=json.loads((root/'validation/review/SIGNED_MULTIPLY_VALIDATION.json').read_text())
          ps=('v1_balanced','v2_pareto_fast','v3_reu_512k','v4_reu_16m','v5_hybrid_lowzp')
          baseline={
            'v1_balanced':513.4964715649647,
            'v2_pareto_fast':469.1818181818182,
            'v3_reu_512k':468.81610626816104,
            'v4_reu_16m':469.2200083022001,
            'v5_hybrid_lowzp':512.8742216687422,
          }
          canon={p:sm['profiles'][p]['SMUL24'] for p in ps}
          evidence={
            'status':'PASS','date':'2026-10-06',
            'optimization':'Reuse stable public Y2 (MATH_IO+$06) in the X<0,Y>=0 signed correction instead of saving it into a self-modified immediate before the producer.',
            'resource_contract':{'public_abi_changed':False,'zp_changed':False,'persistent_stack_changed':False},
            'canonical':canon,
            'baseline_mean_cycles':baseline,
            'delta_mean_cycles':{p:canon[p]['mean_cycles']-baseline[p] for p in ps},
            'focused_q2':{
              'delta_cycles':-2.0,
              'description':'20,070-ish edge+random X<0,Y>=0 focused corpus; every tested q2 call is exactly two cycles faster in V1-V4.',
              'errors':0
            }
          }
          (root/'validation/review/SMUL24_STABLE_INPUT_Q2.json').write_text(json.dumps(evidence,indent=2)+'\n')
          oldvals={
            'v1_balanced':'513.496472','v2_pareto_fast':'469.181818','v3_reu_512k':'468.816106',
            'v4_reu_16m':'469.220008','v5_hybrid_lowzp':'512.874222'
          }
          newvals={p:f"{canon[p]['mean_cycles']:.6f}" for p in ps}
          for path in [root/'PERFORMANCE.md',root/'docs/SIGNED_IMPLEMENTATIONS.md',root/'docs/VERSION_SELECTION.md',
                       root/'v1_balanced/README.md',root/'v2_pareto_fast/README.md',root/'v3_reu_512k/README.md',
                       root/'v4_reu_16m/README.md',root/'v5_hybrid_lowzp/README.md']:
            if not path.exists(): continue
            t=path.read_text()
            for p in ps: t=t.replace(oldvals[p],newvals[p])
            path.write_text(t)
          summary=' / '.join(newvals[p] for p in ps)
          p=root/'CHANGELOG.md'; t=p.read_text()
          entry=(
            '## 2026-10-06 — SMUL24 stable-input q2 correction\n\n'
            '- Removed the mixed-sign X<0,Y>=0 Y2 self-modifying save; the signed correction now re-reads stable public input MATH_IO+$06.\n'
            f'- Canonical V1/V2/V3/V4/V5 SMUL24 means are **{summary} cycles**.\n'
            '- The focused q2 path is exactly **2 cycles faster** with no ABI, ZP, stack-page, or table changes.\n'
            '- Signed-multiply, multiply-refresh, direct-output, deterministic rebuild, published-source, Turbo relocation/boundary, and package gates pass.\n\n')
          if 'SMUL24 stable-input q2 correction' not in t: p.write_text(entry+t)
          p=root/'CSDB_CHANGELOG.txt'; t=p.read_text()
          entry=(
            '2026-10-06 SMUL24 STABLE-INPUT Q2\n'
            '- X<0,Y>=0 correction reuses stable MATH_IO Y2 instead of an SMC save; exact -2 cycles on q2.\n'
            f'- Canonical V1/V2/V3/V4/V5 means: {summary}.\n\n')
          if 'SMUL24 STABLE-INPUT Q2' not in t: p.write_text(entry+t)
          PY

      - name: Regenerate indexes after docs
        run: |
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py

      - name: Refresh release hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          sha=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads((root/'RELEASE_STATUS.json').read_text())
          fixed=('v1_balanced','v2_pareto_fast','v3_reu_512k','v4_reu_16m')
          for p in fixed:
            s['reference_prg_sha256'][p]=sha(root/'build_source/reference'/p/f'math_{p}_source_built.prg')
            s['alternate_prg_sha256'][p]=sha(root/'build_source/alternate'/p/f'math_{p}_source_built.prg')
          s['reference_prg_sha256']['v5_hybrid_lowzp']=sha(root/'build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg')
          s['alternate_prg_sha256']['v5_hybrid_lowzp']=sha(root/'build_hybrid/alternate/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg')
          for p in ('v3_reu_512k','v4_reu_16m'):
            s['reference_reu_sha256'][p]=sha(root/'build_source/reference'/p/f'c64_math_{p}_source_built.reu')
            s['alternate_reu_sha256'][p]=sha(root/'build_source/alternate'/p/f'c64_math_{p}_source_built.reu')
          s['date']='2026-10-06'
          (root/'RELEASE_STATUS.json').write_text(json.dumps(s,indent=2)+'\n')
          PY

      - name: Final promoted validation
        run: |
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_smul24_directout.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Remove research and promotion scaffolding
        run: |
          rm -f .github/workflows/research-smul24-stable-q2.yml
          rm -f .github/workflows/promote-smul24-stable-q2.yml
          rm -f tools/bench_smul24_stable_q2.py
          rm -rf build_source build_hybrid

      - name: Refresh package manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py

      - name: Commit promoted SMUL24 artifacts
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No promotion changes"
          else
            git commit -m "Promote SMUL24 stable-input q2 correction"
            git push origin HEAD:research/smul24-stable-input-q2-v1
          fi
