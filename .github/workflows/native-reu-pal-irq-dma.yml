name: Source-linked native REU PAL VIC IRQ SID timing probe
on:
  push:
    branches: [engineering/reu-pal-vic-irq-qualification-20261021]
    paths:
      - 'tools/native_reu_pal_irq_dma.py'
      - 'tools/test_native_reu_pal_irq_dma.py'
      - 'docs/TURBO16_REU_PAL_IRQ_DMA.md'
      - '.github/workflows/native-reu-pal-irq-dma.yml'
  pull_request:
    paths:
      - 'tools/native_reu_pal_irq_dma.py'
      - 'docs/TURBO16_REU_PAL_IRQ_DMA.md'
      - '.github/workflows/native-reu-pal-irq-dma.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reu-pal-irq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measured-native-pal-reu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact physical co-load and overlay contracts
        run: |
          python3 -m py_compile tools/native_reu_pal_irq_dma.py
          python3 -m unittest discover -s tools -p 'test_native_reu_pal_irq_dma.py' -v
          python3 -m unittest discover -s tools -p 'test_reu_user_setup.py' -v
      - name: Native pinned VICE build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build SHA-qualified VICE x64sc r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Cold-start repeated eight-case native REU PAL matrix, without diagnostic warmup
        run: |
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          for i in 1 2 3; do
            python3 tools/native_reu_pal_irq_dma.py --out "build/reu-pal/cold-repeat-$i.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths=[Path(f"build/reu-pal/cold-repeat-{i}.json") for i in (1,2,3)]
          runs=[json.loads(p.read_text()) for p in paths]
          assert all(r["status"]=="PASS_NATIVE_PAL_REU_IRQ_SID_CIA_BOUNDED_PROBE" for r in runs)
          assert all(len(r["results"])==8 for r in runs)
          first={x["case"]:x for x in runs[0]["results"]}
          assert len(first)==8
          out={}
          for name,base in sorted(first.items()):
            peers=[next(x for x in r["results"] if x["case"]==name) for r in runs]
            assert all(p["source_reu_prg_sha256"]==base["source_reu_prg_sha256"]
                       and p["source_stock_prg_sha256"]==base["source_stock_prg_sha256"]
                       and p["caller_zero_page_restored"] and p["stock_fallback_still_correct"]
                       for p in peers)
            out[name]=[p["native_cia_phi2_slots"] for p in peers]
          p=Path("build/reu-pal/cold-repeat-comparison.json")
          p.write_text(json.dumps({"status":"THREE_COLD_NATIVE_EIGHT_CASE_MATRICES_PASS",
              "historical_16m_irq_interaction":"retested_cold_without_diagnostic_warmup",
              "slots_by_case":out},indent=2,sort_keys=True)+"\n")
          print("THREE_COLD_NATIVE_EIGHT_CASE_MATRICES_PASS")
          PY
      - name: Upload exact raw timings and checksum-linked image identity
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reu-pal-irq-vic-cia-timing
          path: build/reu-pal/
          retention-days: 14
