name: Issue144 native VICE direct-slice specialist research
on:
  push:
    branches: [issue144-shr16-direct-slice-overlay-research-20261014]
    paths:
      - tools/native_issue144_shr16_overlay.py
      - tools/native_issue144_shr16_batch_source.py
      - optional/issue144_v2_umul32_shr16_exclusive/overlay_begin_end.asm
      - .github/workflows/issue144-shr16-native-research.yml
  pull_request:
    branches: [main]
    paths:
      - tools/native_issue144_shr16_overlay.py
      - tools/native_issue144_shr16_batch_source.py
      - optional/issue144_v2_umul32_shr16_exclusive/overlay_begin_end.asm
      - .github/workflows/issue144-shr16-native-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-specialist:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile specialist native test script
        run: python3 -m py_compile tools/native_issue144_shr16_overlay.py
      - name: Install checksum-pinned native VICE
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Native x64sc baseline vs exclusive patched SHR16 output
        run: python3 tools/native_issue144_shr16_overlay.py
      - name: Execute source-assembled BEGIN/END in native x64sc
        run: python3 tools/native_issue144_shr16_batch_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue144-native-shr16-specialist-research
          path: |
            validation/review/ISSUE144_SHR16_OVERLAY_NATIVE_VICE_RESEARCH.json
            validation/review/ISSUE144_V2_SHR16_BEGIN_END_NATIVE_VICE.json
          if-no-files-found: warn
