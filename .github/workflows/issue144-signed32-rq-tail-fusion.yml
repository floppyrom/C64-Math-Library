name: Issue144 B signed32 combined QR research
on:
  push:
    branches: [issue144-b-signed32-rq-tail-fusion-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test unrestricted signed32/16 DIV and MOD quadrant cycles across three profiles and two maps
        run: python3 tools/issue144_signed32_rq_tail_fusion_screen.py --random-per-quadrant 500
