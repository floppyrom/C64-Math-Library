name: Promote SMUL24 direct-output

on:
  push:
    branches:
      - optimize-smul24-directout

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-smul24-directout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/smul24-proof.yml
          rm -f .github/workflows/promote-smul24.yml

      - name: Build all profile maps and validate direct-output source
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          python3 tools/validate_smul24_directout.py

      - name: Promote V1-V5 resident PRGs
        run: |
          cp build_source/reference/v1_balanced/math_v1_balanced_source_built.prg \
             v1_balanced/resident/math_v1_balanced_game_math.prg
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg \
             v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          cp build_source/reference/v3_reu_512k/math_v3_reu_512k_source_built.prg \
             v3_reu_512k/resident/math_v3_reu_512k_game_math.prg
          cp build_source/reference/v4_reu_16m/math_v4_reu_16m_source_built.prg \
             v4_reu_16m/resident/math_v4_reu_16m_game_math.prg
          cp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg \
             v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg

      - name: Regenerate authoritative signed evidence
        run: |
          python3 tools/validate_signed_multiply.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/publish_standalone_sources.py
          python3 tools/validate_smul24_directout.py

      - name: Update SMUL24 performance documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          root=Path('.')
          val=json.loads((root/'validation/review/SIGNED_MULTIPLY_VALIDATION.json').read_text())
          direct=json.loads((root/'validation/multiply_refresh/SMUL24_DIRECTOUT_VALIDATION.json').read_text())
          profiles=('v1_balanced','v2_pareto_fast','v3_reu_512k','v4_reu_16m','v5_hybrid_lowzp')
          stats={p:val['profiles'][p]['SMUL24'] for p in profiles}

          perf=root/'PERFORMANCE.md'
          t=perf.read_text()
          old='| `MATH_SMUL24` | `mul_s24_s24_s48` | 531.496472 | 487.181818 | 486.816106 | 487.220008 | 530.874222 |'
          new='| `MATH_SMUL24` | `mul_s24_s24_s48` | ' + ' | '.join(f"{stats[p]['mean_cycles']:.6f}" for p in profiles) + ' |'
          assert old in t,(old,new)
          perf.write_text(t.replace(old,new))

          doc=root/'docs/MULTIPLY_REFRESH_2026-09-20.md'
          t=doc.read_text()
          oldrow='| `MATH_SMUL24` | V1 | **531.496472** | 474–591 | 2,409 |\n| `MATH_SMUL24` | V2/V3/V4 | **487.181818 / 486.816106 / 487.220008** | 430–550 overall | 2,409 each |'
          newrow=(f"| `MATH_SMUL24` | V1 | **{stats['v1_balanced']['mean_cycles']:.6f}** | {stats['v1_balanced']['min_cycles']}–{stats['v1_balanced']['max_cycles']} | 2,409 |\n"
                  f"| `MATH_SMUL24` | V2/V3/V4 | **{stats['v2_pareto_fast']['mean_cycles']:.6f} / {stats['v3_reu_512k']['mean_cycles']:.6f} / {stats['v4_reu_16m']['mean_cycles']:.6f}** | "
                  f"{min(stats[p]['min_cycles'] for p in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'))}–{max(stats[p]['max_cycles'] for p in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'))} overall | 2,409 each |")
          assert oldrow in t
          t=t.replace(oldrow,newrow)
          anchor='On the shared 10,324-case comparison this removes exactly **18 cycles on every call** in both representative implementation families.'
          extra=(' On 2026-10-06 the same direct-output lifetime optimization was applied to the signed FAST24 composition: '
                 'the low three product bytes are final before any signed upper-half correction, so they now land directly in public result RAM. '
                 f"The all-profile signed proof covers {direct['results']['v1_balanced']['reference']['cases']:,} cases per map and preserves every four-quadrant result/cycle vector across relocation. "
                 'The change removes exactly **18 cycles from every SMUL24 call** without changing the 24-ZP/table contract.')
          assert anchor in t
          doc.write_text(t.replace(anchor,anchor+extra))

          ch=root/'CHANGELOG.md'
          entry='\n'.join([
              '## 2026-10-06 — all-profile SMUL24 direct-output optimization',
              '',
              '- Applied the same low-result lifetime optimization used by UMUL24 to the private FAST24 four-quadrant signed composition in all five fixed profiles.',
              '- Product bytes Z0-Z2 are written directly to public result RAM once their pointer-low aliases are dead; mixed-sign correction still operates only on the upper 24 bits in Y/A/X.',
              f"- V1/V5 signed validation means become **{stats['v1_balanced']['mean_cycles']:.6f} / {stats['v5_hybrid_lowzp']['mean_cycles']:.6f}** cycles; V2/V3/V4 become **{stats['v2_pareto_fast']['mean_cycles']:.6f} / {stats['v3_reu_512k']['mean_cycles']:.6f} / {stats['v4_reu_16m']['mean_cycles']:.6f}**.",
              '- The transformation is a constant **-18 cycles per call**: three ZP stores become absolute public stores (+3 cycles total), while three 7-cycle ZP-to-public copy pairs disappear (-21).',
              '- 24-ZP ownership, table geometry, signed quadrant logic, ABI, and persistent stack usage are unchanged. Reference/alternate vectors and V1/V5 inheritance remain identical.',
              '',
              ''
          ])
          ch.write_text(entry+ch.read_text())

          cs=root/'CSDB_CHANGELOG.txt'
          cs.write_text(
              f"2026-10-06 SMUL24 DIRECT-OUTPUT\n- All five profiles save exactly 18 cycles/call. "
              f"V1 {stats['v1_balanced']['mean_cycles']:.6f}, V2/V3/V4 "
              f"{stats['v2_pareto_fast']['mean_cycles']:.6f}/{stats['v3_reu_512k']['mean_cycles']:.6f}/{stats['v4_reu_16m']['mean_cycles']:.6f}, "
              f"V5 {stats['v5_hybrid_lowzp']['mean_cycles']:.6f}. 24-ZP/table and signed quadrant contracts unchanged.\n\n"
              + cs.read_text())

          rs=root/'RELEASE_STATUS.json'
          o=json.loads(rs.read_text())
          o['date']='2026-10-06'
          note=(f"All-profile public SMUL24 direct-output update: V1/V5 "
                f"{stats['v1_balanced']['mean_cycles']:.6f}/{stats['v5_hybrid_lowzp']['mean_cycles']:.6f}, "
                f"V2/V3/V4 {stats['v2_pareto_fast']['mean_cycles']:.6f}/{stats['v3_reu_512k']['mean_cycles']:.6f}/{stats['v4_reu_16m']['mean_cycles']:.6f}; "
                "exactly 18 cycles removed from every call, with 24-ZP/table/quadrant contracts unchanged.")
          if note not in o.get('notes',[]): o.setdefault('notes',[]).append(note)
          rs.write_text(json.dumps(o,indent=2)+'\n')
          PY

      - name: Regenerate consolidated/public indexes
        run: |
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Rebuild and verify deterministic resident images
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          python3 tools/validate_smul24_directout.py
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/verify_hybrid_deterministic.py

      - name: Refresh release PRG hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads((root/'RELEASE_STATUS.json').read_text())
          for p in ('v1_balanced','v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              s['reference_prg_sha256'][p]=sha(root/'build_source/reference'/p/f'math_{p}_source_built.prg')
              s['alternate_prg_sha256'][p]=sha(root/'build_source/alternate'/p/f'math_{p}_source_built.prg')
          p='v5_hybrid_lowzp'
          s['reference_prg_sha256'][p]=sha(root/'build_hybrid/reference'/p/'math_v5_hybrid_lowzp_game_math.prg')
          s['alternate_prg_sha256'][p]=sha(root/'build_hybrid/alternate'/p/'math_v5_hybrid_lowzp_game_math.prg')
          (root/'RELEASE_STATUS.json').write_text(json.dumps(s,indent=2)+'\n')
          PY

      - name: Refresh package contract
        run: |
          rm -rf build_source build_hybrid
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py

      - name: Commit promoted SMUL24 release
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Promote all-profile SMUL24 direct-output path"
          git push origin HEAD:optimize-smul24-directout
