name: Exact seven-API frame installer native VICE qualification

on:
  pull_request:
    paths:
      - 'tools/native_seven_frame_installer.py'
      - 'tools/test_native_seven_frame_installer.py'
      - 'tools/mixed_seven_frame_parity.py'
      - 'tools/frame_evidence_replay.py'
      - '.github/workflows/native-seven-frame-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-exact-seven-prgs:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm two source-replayed exact binary outputs with no emulator
        run: |
          python3 -m compileall -q tools/native_seven_frame_installer.py tools/test_native_seven_frame_installer.py
          python3 -m unittest discover -s tools -p 'test_native_seven_frame_installer.py' -v
      - name: Install pinned VICE dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned x64sc r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Verify VICE build and seven distinct public operations on two exact PRGs
        run: |
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_seven_frame_installer.py
