# Branch-scoped maintenance for experimental Turbo16 REU PR #383.
# Produces the package's complete SHA seal and deterministic audit JSON.
name: Reseal Turbo16 REU draft package manifest
on:
  push:
    branches:
      - engineering/turbo16-reu-native-preflight-package-20261021
      - engineering/operation-first-turbo16-reu-optin-20261021
permissions:
  contents: write
jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate complete package file hashes and audit until stable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          root=Path('.')
          path=root/'SHA256SUMS.txt'
          def all_files():
              return sorted((x for x in root.rglob('*') if x.is_file()
                  and '.git' not in x.parts and x.name != 'SHA256SUMS.txt'),
                  key=lambda x: x.as_posix())
          def reseal():
              rows=[hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.as_posix()
                    for f in all_files()]
              path.write_text('\n'.join(rows)+'\n')
          for i in range(6):
              before=(root/'validation/PACKAGE_AUDIT.json').read_bytes()
              reseal()
              subprocess.run(['python3','tools/package_audit.py'],check=True)
              after=(root/'validation/PACKAGE_AUDIT.json').read_bytes()
              if before == after:
                  break
          else:
              raise RuntimeError('package audit failed to stabilize')
          reseal()
          subprocess.run(['python3','tools/package_audit.py'],check=True)
          assert before == (root/'validation/PACKAGE_AUDIT.json').read_bytes()
          PY
      - name: Commit only sealed checksum and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SHA256SUMS.txt validation/PACKAGE_AUDIT.json
          git diff --cached --quiet || git commit -m 'reu: seal independent preflight package contents and audit'
          git push origin "HEAD:$GITHUB_REF_NAME"
