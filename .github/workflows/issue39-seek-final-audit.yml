name: Issue39 SEEK final family and speed-one resource screen
on:
  push:
    branches: [issue39-seek-final-family-audit-20261014]
    paths:
      - tools/validate_issue39_seek_family_final.py
      - .github/workflows/issue39-seek-final-audit.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  family-disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source generation and five-profile source-map build
        run: |
          python3 -m py_compile tools/validate_issue39_seek_family_final.py
          python3 tools/generate_seek_sources.py --check
          python3 tools/generate_sources.py
          for kind in reference alternate; do
            python3 tools/assemble_sources.py --profile all --config-kind "$kind"
            python3 tools/build_hybrid.py --config-kind "$kind"
          done
      - name: Final SEEK family public ABI and screened fastpath code-size audit
        run: python3 tools/validate_issue39_seek_family_final.py
      - name: Permanent mixed-safety and placement regression
        run: |
          python3 tools/validate_issue136_seek_divmod_mixed.py
          python3 tools/validate_seek_placement.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-seek-final-resource-screen
          if-no-files-found: warn
          path: validation/review/ISSUE39_SEEK_FAMILY_FINAL_AUDIT_2026-10-14.json
