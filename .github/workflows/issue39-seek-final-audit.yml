name: Issue39 SEEK final family and speed-one resource screen
on:
  push:
    branches: [issue39-seek-final-family-audit-20261014]
    paths:
      - tools/validate_issue39_seek_family_final.py
      - .github/workflows/issue39-seek-final-audit.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  family-disposition:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-seek-final-family-audit-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source generation and five-profile source-map build
        run: |
          python3 -m py_compile tools/validate_issue39_seek_family_final.py
          python3 tools/generate_seek_sources.py --check
          python3 tools/generate_sources.py
          for kind in reference alternate; do
            python3 tools/assemble_sources.py --profile all --config-kind "$kind"
            python3 tools/build_hybrid.py --config-kind "$kind"
          done
      - name: Final SEEK family public ABI and screened fastpath code-size audit
        run: python3 tools/validate_issue39_seek_family_final.py
      - name: Permanent mixed-safety and placement regression
        run: |
          python3 tools/validate_issue136_seek_divmod_mixed.py
          python3 tools/validate_seek_placement.py
      - name: Stage final resource audit, changelogs and SHA-256 package seal
        if: github.event_name == 'push'
        run: python3 tools/stage_issue39_seek_family_completion.py
      - name: Commit only a green source-backed SEEK family audit
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/review/ISSUE39_SEEK_FAMILY_FINAL_AUDIT_2026-10-14.json \
            docs/ISSUE39_SEEK_FAMILY_COMPLETION_2026-10-14.md \
            RELEASE_STATUS.json CHANGELOG.md CSDB_CHANGELOG.txt \
            SHA256SUMS.txt validation/PACKAGE_AUDIT.json
          git diff --cached --quiet || git commit -m 'issue39: seal completed SEEK8/16 audit and rejected resource-overlap candidate'
          git push origin HEAD:issue39-seek-final-family-audit-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-seek-final-resource-screen
          if-no-files-found: warn
          path: validation/review/ISSUE39_SEEK_FAMILY_FINAL_AUDIT_2026-10-14.json
