name: Issue39 normalize branch candidate VICE proof
on:
  push:
    branches: [issue39-normalize-log-branch-collapse-trial-20261014]
    paths:
      - .github/workflows/issue39-normalize-log-branch-native.yml
      - tools/native_issue39_normalize_branch.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline-versus-reduced-log-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-normalize-log-branch-collapse-trial-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate optimized reference resident images without publishing
        run: |
          make reference
          python3 tools/build_hybrid.py --config-kind reference
      - name: Install SHA-pinned x64sc headless
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Compare original versus optimized signed normalizer in VICE
        run: python3 tools/native_issue39_normalize_branch.py
      - name: Seal candidate research evidence and check package
        run: |
          python3 - <<'PY'
          import subprocess,sys
          from tools.stage_issue39_v1_3216_ool_release import reseal
          subprocess.run(["make","clean"],check=True)
          for _ in range(3):
              reseal()
              subprocess.run([sys.executable,"tools/package_audit.py"],check=True)
          PY
      - name: Commit candidate native proof without replacing production residents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: certify native VICE normalizer branch candidate parity'
          git push origin HEAD:issue39-normalize-log-branch-collapse-trial-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-normalize-log-branch-native
          path: validation/review/ISSUE39_NORMALIZE_BRANCH_COLLAPSE_NATIVE_2026-10-14.json
