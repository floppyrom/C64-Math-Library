name: Diagnose SDIV16 PRG diff
on:
  push:
    branches:
      - research/sdiv16-pp-late-copy-v1
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/diagnose_sdiv16_prg_diff.py
      - run: python3 tools/diagnose_sdiv32_lockstep.py
