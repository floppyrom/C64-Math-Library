name: Issue39 one-shot candidate publication
on:
  push:
    branches:
      - issue39-q23-zero-bypass
permissions:
  contents: write
jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[issue39-published]')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact candidate reference and alternate images
        shell: bash
        run: |
          set -euo pipefail
          make reference
          make alternate
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          cp build_source/reference/v1_balanced/math_v1_balanced_source_built.prg v1_balanced/resident/math_v1_balanced_game_math.prg
          cp build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg
          make reference
          make alternate
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate
          cmp v1_balanced/resident/math_v1_balanced_game_math.prg build_source/reference/v1_balanced/math_v1_balanced_source_built.prg
          cmp v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg build_hybrid/reference/v5_hybrid_lowzp/math_v5_hybrid_lowzp_game_math.prg
      - name: Run all-profile unsigned and signed validation and identical-input benchmarks
        run: |
          set -euo pipefail
          python3 tools/validate_unsigned_division.py
          python3 tools/validate_signed_division.py
          python3 tools/benchmark_unsigned_common_corpus.py
          python3 tools/benchmark_unsigned_3216_workloads.py
          python3 tools/audit_issue39_zero_high_bypass.py
          python3 tools/validate_udiv32_qone_bound.py
          python3 tools/validate_udiv32_q23_bound.py
      - name: Rebuild relocation, V5 hybrid and publication artifacts
        run: |
          set -euo pipefail
          python3 tools/validate_source_build.py all --build build_source/alternate --out validation/source_relocation
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_hybrid.py
          python3 tools/finalize_issue39_zero_high_bypass.py
          python3 tools/publish_standalone_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
      - name: Remove temporary snapshot/publisher, seal all package hashes, and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_source build_hybrid build_hybrid_repeat build_pareto tools/__pycache__
          rm -f .github/workflows/issue39-snapshot.yml .github/workflows/issue39-publish.yml
          python3 - <<'PY'
          import hashlib,subprocess,pathlib
          root=pathlib.Path('.')
          tracked=[pathlib.Path(s) for s in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if s]
          tracked.append(pathlib.Path('validation/review/UDIV32_ZERO_HIGH_BYPASS_PAIRED.json'))
          targets=sorted({p for p in tracked if p.is_file() and p.name!='SHA256SUMS.txt'},key=str)
          def seal():
              (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n' for p in targets))
          seal()
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          import hashlib,subprocess,pathlib
          root=pathlib.Path('.')
          tracked=[pathlib.Path(s) for s in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if s]
          tracked.append(pathlib.Path('validation/review/UDIV32_ZERO_HIGH_BYPASS_PAIRED.json'))
          targets=sorted({p for p in tracked if p.is_file() and p.name!='SHA256SUMS.txt'},key=str)
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n' for p in targets))
          before=(root/'validation/PACKAGE_AUDIT.json').read_bytes()
          subprocess.run(['python3','tools/package_audit.py'],check=True)
          assert before==(root/'validation/PACKAGE_AUDIT.json').read_bytes(),'package seal is unstable'
          PY
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[issue39-published] Publish verified zero-high divider bypass and synchronized artifacts"
          git push origin HEAD:issue39-q23-zero-bypass
