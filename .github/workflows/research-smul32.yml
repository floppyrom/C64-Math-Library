name: Research SMUL32 bounded candidate

on:
  push:
    branches:
      - research/smul32-bounded-sum-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bounded-smul32:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and benchmark V2 candidate
        run: python3 tools/bench_smul32_bounded_candidate.py
      - name: Build candidate reference artifacts
        run: |
          python3 tools/assemble_sources.py --profile v2_pareto_fast --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile v3_reu_512k --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile v4_reu_16m --config-kind reference --out build_source
      - name: Promote candidates in ephemeral checkout
        run: |
          for p in v2_pareto_fast v3_reu_512k v4_reu_16m; do
            cp build_source/reference/$p/math_${p}_source_built.prg $p/resident/math_${p}_game_math.prg
            cp build_source/reference/$p/math_api.inc $p/resident/math_api.inc
          done
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu v4_reu_16m/reu/c64_math_v4_16m_game_math.reu
      - name: Full signed multiply validation
        run: python3 tools/validate_signed_multiply.py
      - name: Multiply refresh validation
        run: python3 tools/benchmark_multiply_refresh.py
