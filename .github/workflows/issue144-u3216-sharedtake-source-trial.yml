name: Issue144 U3216 shared-take full-public source trial
on:
  pull_request:
    paths:
      - optional/issue144_u3216_sharedtake_fullwidth/**
      - .github/workflows/issue144-u3216-sharedtake-source-trial.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  public-abi-source-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply opt-in source only inside isolated CI checkout
        run: cp optional/issue144_u3216_sharedtake_fullwidth/udiv32_16_sharedtake.inc relocatable_source/division/udiv32_16_split_direct.inc
      - name: Build V1-V5 reference and alternate profiles
        run: make reference alternate
      - name: Stage source-build directories expected by the integrated validator
        run: |
          mkdir -p build_u3216
          cp -a build_source/reference build_u3216/reference
          cp -a build_source/alternate build_u3216/alternate
      - name: V2-V4 paired full-public correctness, carry, input and map compatibility
        run: python3 tools/validate_udiv32_16_integrated.py
      - name: Install pinned VICE r46274 for native public ABI
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Native V2-V4 full-public alternating DIV/MOD stock-versus-candidate
        run: python3 tools/issue144_u3216_fullcall_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue144-u3216-sharedtake-full-public-source-trial
          path: validation/research/UDIV32_16_INTEGRATED.json
