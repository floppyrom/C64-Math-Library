name: Turbo16 fast research

on:
  push:
    branches:
      - opt/mod-isqrt-fast24-turbo-20261007
    paths:
      - 'tools/research_turbo16_shifted134.py'
      - 'relocatable_source/turbo/turbo16_overlay.asm'
      - 'relocatable_source/turbo/turbo16_shifted134_candidate.asm'
      - '.github/workflows/turbo16-research-fast.yml'
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/research_turbo16_shifted134.py
