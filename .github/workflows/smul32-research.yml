name: SMUL32 research proof

on:
  push:
    branches:
      - research/smul32-compact-summation

permissions:
  contents: read

jobs:
  prove-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build V2 research candidate
        run: python3 tools/assemble_sources.py --profile v2_pareto_fast --config-kind reference --out build_source
      - name: Validate and benchmark SMUL32 candidate
        run: python3 tools/research_smul32_candidate.py
