name: Issue39 UMUL24 V2-V4 no-carry CLC research proof
on:
  push:
    branches: [issue39-v2v4-umul24-nocarry-clc-proof]
    paths:
      - tools/screen_issue39_umul24_nocarry_clc.py
      - tools/native_issue39_umul24_nocarry_clc.py
      - .github/workflows/issue39-umul24-nocarry-clc-proof.yml
  pull_request:
    paths:
      - tools/screen_issue39_umul24_nocarry_clc.py
      - tools/native_issue39_umul24_nocarry_clc.py
      - .github/workflows/issue39-umul24-nocarry-clc-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-model-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test published source and transient RTS/NOP candidate over both relocation maps
        run: python3 tools/screen_issue39_umul24_nocarry_clc.py --output /tmp/issue39-umul24-clc-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-umul24-clc-cpu-model
          path: /tmp/issue39-umul24-clc-proof.json
