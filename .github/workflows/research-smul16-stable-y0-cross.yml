name: Research SMUL16 stable Y0 cross-profile
on:
  push:
    branches:
      - research/smul16-stable-y0-promotion-v1
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benchmark SMUL16 stable-Y0 across fixed profiles
        run: python3 tools/bench_smul16_stable_y0_cross.py
