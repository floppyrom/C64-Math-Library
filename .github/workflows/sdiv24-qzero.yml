name: Signed24 quotient-zero hot-kernel research

on:
  pull_request:
    paths:
      - routines/divide/sdiv24_smod24_qzero_zerozp.asm
      - tools/selective_linker.py
      - tools/test_selective_sdiv24_qzero.py
      - tools/native_selective_sdiv24_qzero.py
      - docs/SDIV24_ABS_QZERO_RESEARCH.md
      - .github/workflows/sdiv24-qzero.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile regression
        run: python3 -m compileall -q tools/test_selective_sdiv24_qzero.py tools/native_selective_sdiv24_qzero.py tools/selective_linker.py
      - name: Matched ABI, zero-quotient and cycle trade-off at both memory maps
        run: python3 -m unittest discover -s tools -p 'test_selective_sdiv24_qzero.py' -v

  native-vice-r46284:
    needs: paired-model
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install pinned upstream headless build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Source-build VICE r46284 with checksum-pinned submodule
        env:
          VICE_JOBS: "2"
        run: bash tools/vice/build_headless.sh
      - name: Paired native signed24 public calls (both relocations)
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_sdiv24_qzero.py
