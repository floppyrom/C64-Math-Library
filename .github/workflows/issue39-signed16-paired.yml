name: Issue39 16-bit signed paired architecture screen

on:
  push:
    branches:
      - issue39-udiv16-umod16-signed-paired-audit
  pull_request:
    paths:
      - 'tools/audit_issue39_signed16_common.py'
      - '.github/workflows/issue39-signed16-paired.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-signed16:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Same-input SMOD16 and SDIV16 five-profile 6502 comparisons
        run: python3 tools/audit_issue39_signed16_common.py
      - name: Upload paired timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue39-signed16-paired-screen
          path: |
            validation/review/ISSUE39_SIGNED16_SAME_INPUT_AUDIT.json
            benchmarks/ISSUE39_SIGNED16_SAME_INPUT_AUDIT.csv
          retention-days: 14
          if-no-files-found: warn
