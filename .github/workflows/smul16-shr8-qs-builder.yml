name: Historical signed16 SHR8 quarter-square source qualification

on:
  pull_request:
    paths:
      - 'tools/selective_smul16_shr8_quartersquare.py'
      - 'tools/selective_speed_smul16_shr8.py'
      - 'tools/test_selective_smul16_shr8_qs.py'
      - 'tools/test_smul16_shr8_qs_frames.py'
      - 'tools/native_selective_smul16_shr8_qs.py'
      - 'tools/selective_linker.py'
      - '.github/workflows/smul16-shr8-qs-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-shr8-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Signed Q8.8 public output, same-corpus speed and private RAM budgets
        run: |
          python3 -m compileall -q tools/selective_smul16_shr8_quartersquare.py tools/selective_speed_smul16_shr8.py tools/test_selective_smul16_shr8_qs.py tools/test_smul16_shr8_qs_frames.py tools/native_selective_smul16_shr8_qs.py tools/selective_linker.py
          python3 tools/selective_smul16_shr8_quartersquare.py
          python3 -m unittest discover -s tools -p 'test_selective_smul16_shr8_qs.py' -v
          python3 -m unittest discover -s tools -p 'test_smul16_shr8_qs_frames.py' -v

  native-vice:
    needs: signed-shr8-model
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install headless VICE build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned native VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Verify exact signed Q24 output from source-linked SHR8 dual entries
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_smul16_shr8_qs.py
