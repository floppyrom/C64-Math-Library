name: Issue39 UMUL24 no-carry CLC removal full production stage
on:
  push:
    branches: [issue39-umul24-rts-no-clc-production]
    paths:
      - tools/stage_issue39_umul24_no_carry_rts_release.py
      - .github/workflows/issue39-umul24-no-carry-rts-stage.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage-and-reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-umul24-rts-no-clc-production
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build all maps and stage exact V2-V4 resident binaries; refresh public tables and package audits
        run: python3 tools/stage_issue39_umul24_no_carry_rts_release.py
      - name: Commit qualified source-built release stage only if all gates pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: stage V2-V4 no-carry RTS optimization and synchronized release indexes'
          git push origin HEAD:issue39-umul24-rts-no-clc-production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-umul24-no-carry-rts-source-stage
          path: validation/review/ISSUE39_UMUL24_NO_CARRY_RTS_RELEASE_2026-10-13.json
