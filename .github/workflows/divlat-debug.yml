name: Division latency debug
on:
  push:
    branches: [ opt/udiv32-16-latency-20261007 ]
  workflow_dispatch:
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile v2_pareto_fast --config-kind reference --out build_u3216
          python3 tools/debug_divlat_trace.py
          python3 tools/find_division_common_holes.py
          python3 tools/debug_divlat_quick.py
          python3 tools/research_udiv24_crossover.py
# trace workflow active
