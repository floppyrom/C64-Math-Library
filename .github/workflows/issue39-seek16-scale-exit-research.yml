name: Issue39 SEEK16 init Euclidean scale fallthrough research
on:
  push:
    branches: [issue39-seek16-euclid-exit-optimization-20261014]
    paths:
      - .github/workflows/issue39-seek16-scale-exit-research.yml
      - tools/research_issue39_seek16_scale_exit.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seek16-scale-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-seek16-euclid-exit-optimization-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate authoritative SEEK source/standalone from kernel
        run: python3 tools/generate_seek_sources.py
      - name: Rebuild all five profiles under reference and alternate maps
        run: make reference alternate hybrid
      - name: Verify generated SEEK source and independent relocation
        run: |
          python3 tools/generate_seek_sources.py --check
          python3 tools/validate_seek_placement.py
      - name: Test paired SEEK16 init public ABI, all 248 state bytes and exact cycle savings
        run: python3 tools/research_issue39_seek16_scale_exit.py
      - name: Package audit with newly sealed research sources
        run: |
          python3 - <<'PY'
          import subprocess,sys
          from tools.stage_issue39_v1_3216_ool_release import reseal
          subprocess.run(["make","clean"],check=True)
          for _ in range(3):
              reseal()
              subprocess.run([sys.executable,"tools/package_audit.py"],check=True)
          PY
      - name: Commit unchanged-release research proof only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'research(issue39): certify SEEK16 INIT scale exit cycles without publishing binaries'
          git push origin HEAD:issue39-seek16-euclid-exit-optimization-20261014
      - uses: actions/upload-artifact@v4
        if: always
        with:
          name: issue39-seek16-scale-exit-research
          path: validation/review/ISSUE39_SEEK16_SCALE_EXIT_RESEARCH_2026-10-14.json
