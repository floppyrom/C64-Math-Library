  workflow_dispatch:

concurrency:
  group: operation-first-builder-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  selection-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check builder and regression scripts before running tests
        run: python3 -m compileall -q tools/math_builder.py tools/selective_linker.py tools/selective_atan2.py tools/test_math_builder.py tools/test_selective_linker.py tools/test_selective_atan2.py tools/test_selective_multiply.py tools/test_selective_umul16_shr8.py tools/test_selective_fast_umul16_shr8.py tools/test_selective_speed_umul16_shr8.py tools/selective_speed_umul16_shr8.py tools/test_selective_umul8.py tools/native_selective_linker.py tools/native_selective_atan2.py tools/native_selective_multiply.py tools/native_selective_fast_umul8.py tools/selective_fast_umul8.py tools/test_selective_fast_umul8.py tools/selective_umul8_v1.py tools/test_selective_umul8_v1.py tools/native_selective_umul8_v1.py tools/selective_fast_umul16.py tools/test_selective_fast_umul16.py tools/native_selective_fast_umul16.py tools/selective_speed_umul16.py tools/test_selective_speed_umul16.py tools/selective_speed_udiv8.py tools/test_selective_speed_udiv8.py tools/selective_smul8.py tools/test_selective_smul8.py tools/native_selective_smul8.py tools/test_selective_umod8.py tools/native_selective_umod8.py tools/test_selective_umod8_variants.py tools/test_selective_umod8_speed.py tools/selective_speed_umod8.py tools/test_selective_speed_umod8.py tools/native_selective_umod8_variants.py tools/selective_speed.py tools/test_selective_speed.py tools/selective_isqrt16.py tools/selective_seek8.py tools/selective_seek16.py tools/test_selective_seek8.py tools/native_selective_seek8.py tools/test_selective_seek16.py tools/native_selective_seek16.py tools/test_selective_u3216.py tools/test_selective_udiv16_shl8.py tools/native_selective_udiv16_shl8.py tools/test_selective_urecip16_q16.py tools/native_selective_urecip16_q16.py tools/test_selective_umul24.py tools/native_selective_umul24.py tools/native_selective_u3216.py tools/test_selective_u24.py tools/native_selective_u24.py tools/test_selective_udiv24_v2.py tools/selective_udiv24_v2.py tools/test_selective_u3216_accum.py tools/test_selective_isqrt16.py tools/native_selective_isqrt16.py tools/test_selective_isqrt32.py tools/native_selective_isqrt32.py tools/test_selective_isqrt32_v2.py tools/native_selective_isqrt32_v2.py tools/test_selective_speed_isqrt32.py tools/selective_speed_isqrt32.py tools/test_selective_dist8.py tools/native_selective_dist8.py tools/test_selective_udiv8.py tools/native_selective_udiv8.py tools/test_selective_udiv8_v2v5.py tools/native_selective_udiv8_v2v5.py tools/test_selective_sdiv8.py tools/native_selective_sdiv8.py tools/selective_trig8.py tools/test_selective_trig8.py tools/native_selective_trig8.py tools/selective_dist8_accurate.py tools/test_selective_dist8_accurate.py tools/native_selective_dist8_accurate.py tools/mini6502.py routines/atan2/tables.py routines/standalone_lab/portable/native_vice.py
      - name: Validate operation catalog and no-binary safety
        run: |
          python3 tools/test_math_builder.py
          python3 tools/test_selective_linker.py
          python3 tools/test_selective_atan2.py
          python3 tools/test_selective_multiply.py
          python3 tools/test_selective_umul16_shr8.py
          python3 tools/test_selective_umul8.py
          python3 tools/test_selective_fast_umul8.py
          python3 tools/test_selective_umul8_v1.py
          python3 tools/test_selective_fast_umul16.py
          python3 tools/test_selective_fast_umul16_shr8.py
          python3 tools/test_selective_speed_umul16_shr8.py
          python3 tools/test_selective_smul8.py
          python3 tools/test_selective_umod8.py
          python3 tools/test_selective_umod8_variants.py
          python3 tools/test_selective_umod8_speed.py
          python3 tools/test_selective_speed_umod8.py
          python3 tools/test_selective_speed_umul16.py
          python3 tools/test_selective_speed_udiv8.py
          python3 tools/test_selective_speed.py
          python3 tools/test_selective_isqrt16.py
          python3 tools/test_selective_isqrt32.py
          python3 tools/test_selective_isqrt32_v2.py
          python3 tools/test_selective_speed_isqrt32.py
          python3 tools/test_selective_seek8.py
          python3 tools/test_selective_seek16.py
          python3 tools/test_selective_u3216.py
          python3 tools/test_selective_udiv16_shl8.py
          python3 tools/test_selective_urecip16_q16.py
          python3 tools/test_selective_umul24.py
          python3 tools/test_selective_u24.py
          python3 tools/test_selective_udiv24_v2.py
          python3 tools/test_selective_u3216_accum.py
          python3 tools/test_selective_dist8.py
          python3 tools/test_selective_udiv8.py
          python3 tools/test_selective_udiv8_v2v5.py
          python3 tools/test_selective_sdiv8.py
          python3 tools/test_selective_trig8.py
          python3 tools/test_selective_dist8_accurate.py
      - name: Smoke-test source SHA provenance
        run: >-
          python3 tools/math_builder.py
          --operation UMUL16 --operation ISQRT16
          --validate-sources --preview > /dev/null

  native-vice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checksum-pinned headless VICE
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Validate 16-bit and 32-bit linked binaries at two RAM maps
        run: python3 tools/native_selective_linker.py
      - name: Validate compact and fast ATAN2 linked binaries at two RAM maps
        run: python3 tools/native_selective_atan2.py
      - name: Validate zero-ZP UMUL16 and shifted UMUL16 linked binaries at two RAM maps
        run: python3 tools/native_selective_multiply.py
      - name: Validate quarter-square UMUL8 linked PRGs in native VICE
        run: python3 tools/native_selective_fast_umul8.py
      - name: Validate original V1 UMUL8 with four-byte ZP at two relocations in native VICE
        run: python3 tools/native_selective_umul8_v1.py
      - name: Validate independently linked quarter-square UMUL16 in VICE
        run: python3 tools/native_selective_fast_umul16.py
      - name: Validate original UMOD8 fast and writable fallback in native VICE
        run: python3 tools/native_selective_umod8.py
      - name: Validate source-exact V2 and V5 UMOD8 fast fallback in native VICE
        run: python3 tools/native_selective_umod8_variants.py
      - name: Validate original writable-SMC SMUL8 signed products in native VICE
        run: python3 tools/native_selective_smul8.py
      - name: Validate historical V2 highword seeded ISQRT32 and portable reference in VICE
        run: python3 tools/native_selective_isqrt32_v2.py
      - name: Validate source-linked ISQRT32 full-width radix-four zero-ZP in VICE
        run: python3 tools/native_selective_isqrt32.py
      - name: Validate source-linked optimized ISQRT16 at two RAM maps
        run: python3 tools/native_selective_isqrt16.py
      - name: Validate source-linked shared UDIV24 and UMOD24 in native VICE
        run: python3 tools/native_selective_u24.py
      - name: Validate shared UDIV32_16 and UMOD32_16 portable kernels in VICE
        run: python3 tools/native_selective_u3216.py
      - name: Validate zero-ZP UDIV16_SHL8 at two native VICE maps
        run: python3 tools/native_selective_udiv16_shl8.py
      - name: Native VICE exact reciprocal Q16 at two maps
        run: python3 tools/native_selective_urecip16_q16.py
      - name: Native VICE 24-bit unsigned multiplication at two maps
        run: python3 tools/native_selective_umul24.py
      - name: Validate SEEK16 shared entries and persistent state in native VICE
        run: python3 tools/native_selective_seek16.py
      - name: Validate SEEK8 shared entries and persistent state in native VICE
        run: python3 tools/native_selective_seek8.py
      - name: Validate source-linked historical DIST8_FAST at two RAM maps
        run: python3 tools/native_selective_dist8.py
      - name: Validate historical V1 UDIV8 native RAM and ZP relocations
        run: python3 tools/native_selective_udiv8.py
      - name: Validate original V2/V5 UDIV8 native at two RAM and ZP placements
        run: python3 tools/native_selective_udiv8_v2v5.py
      - name: Validate historical shared SDIV8 and SMOD8 in native VICE
        run: python3 tools/native_selective_sdiv8.py
      - name: Validate three trig APIs and shared sine page in native VICE
        run: python3 tools/native_selective_trig8.py
      - name: Validate original accurate DIST8 RAM and ZP historical kernels
        run: python3 tools/native_selective_dist8_accurate.py
