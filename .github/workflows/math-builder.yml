          python3 tools/test_selective_dist8.py
          python3 tools/test_selective_udiv8.py
          python3 tools/test_selective_udiv8_v2v5.py
          python3 tools/test_selective_sdiv8.py
          python3 tools/test_selective_trig8.py
          python3 tools/test_selective_dist8_accurate.py
      - name: Upload 32/32 divisor-stratified CPU cycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u3232-stratified-cycle-tails
          path: build/u3232_stratified_cycles.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Build operation-first default configuration (no profiles)
        run: |
          make builder OUT="$RUNNER_TEMP/opmath"
          test -s "$RUNNER_TEMP/opmath/math_selective.prg"
          test -s "$RUNNER_TEMP/opmath/math_api.inc"
          python3 - "$RUNNER_TEMP/opmath/selective_manifest.json" <<'PYJSON'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert {e['api'] for e in m['operations']} == {'MATH_UMUL16','MATH_UDIV16','MATH_ISQRT16'}
          assert m['resource_use']['main_ram_total_bytes'] == 1318
          assert m['resource_use']['zero_page_bytes'] == 2
          PYJSON
      - name: Smoke-test source SHA provenance
        run: >-
          python3 tools/math_builder.py
          --operation UMUL16 --operation ISQRT16
          --validate-sources --preview > /dev/null

  native-vice:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checksum-pinned headless VICE
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
