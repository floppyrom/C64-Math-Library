name: Fix UMUL24 package self-checksum

on:
  push:
    branches:
      - optimize-umul24-directout

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-umul24-directout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove one-shot workflow and refresh package-audit hash
        run: |
          rm -f .github/workflows/fix-umul24-package.yml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('validation/PACKAGE_AUDIT.json')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          s=Path('SHA256SUMS.txt')
          lines=[]
          found=False
          for line in s.read_text().splitlines():
              if line.endswith('  validation/PACKAGE_AUDIT.json'):
                  lines.append(f'{h}  validation/PACKAGE_AUDIT.json')
                  found=True
              else:
                  lines.append(line)
          assert found
          s.write_text('\n'.join(sorted(lines))+'\n')
          print('PACKAGE_AUDIT_SHA256',h)
          PY
      - name: Require deterministic package audit
        run: |
          cp validation/PACKAGE_AUDIT.json /tmp/package_before.json
          python3 tools/package_audit.py
          cmp /tmp/package_before.json validation/PACKAGE_AUDIT.json
      - name: Commit checksum repair
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix UMUL24 package audit checksum"
          git push origin HEAD:optimize-umul24-directout
