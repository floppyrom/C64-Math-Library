name: Issue144 portable source snapshot
on:
  push:
    branches: [issue144-full-frontier-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Produce source-only snapshot (no .git)
        run: |
          tar -czf /tmp/c64ml-issue144-source.tgz --exclude=.git .
          ls -lh /tmp/c64ml-issue144-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: issue144-source-snapshot
          path: /tmp/c64ml-issue144-source.tgz
          retention-days: 2
