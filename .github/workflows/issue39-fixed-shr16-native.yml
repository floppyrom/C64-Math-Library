name: Issue39 fixed signed and unsigned SHR16 native VICE release proof
on:
  push:
    branches: [issue39-fixed-multiply-shr16-tail-20261014]
    paths:
      - tools/native_issue39_fixed_shr16_tail.py
      - tools/finalize_issue39_fixed_shr16_native.py
      - .github/workflows/issue39-fixed-shr16-native.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-native-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-fixed-multiply-shr16-tail-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install version pinned native VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Prove 480 installed original/candidate public calls including signed output and stack
        run: python3 tools/native_issue39_fixed_shr16_tail.py
      - name: Seal SHA-256 and release status only after native public proof
        run: python3 tools/finalize_issue39_fixed_shr16_native.py
      - name: Publish qualifying native evidence to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue39: certify fixed shifted result native x64sc output equivalence'
          git push origin HEAD:issue39-fixed-multiply-shr16-tail-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-fixed-shr16-native
          path: validation/review/ISSUE39_FIXED_SHR16_NATIVE_2026-10-14.json
