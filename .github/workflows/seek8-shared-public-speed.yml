name: Original shared SEEK8 four-entry public speed qualification

on:
  pull_request:
    paths:
      - 'tools/selective_speed_seek8.py'
      - 'tools/test_selective_speed_seek8.py'
      - 'tools/selective_linker.py'
      - '.github/workflows/seek8-shared-public-speed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-public-speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve one authentic SEEK8 DDA producer and benchmark four original entries
        run: |
          python3 -m compileall -q tools/selective_speed_seek8.py tools/test_selective_speed_seek8.py tools/selective_linker.py
          python3 -m unittest discover -s tools -p 'test_selective_speed_seek8.py' -v
          python3 -m unittest discover -s tools -p 'test_selective_seek8.py' -v

  native-vice:
    needs: source-public-speed
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install pinned headless VICE prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned native VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Verify original shared SEEK8 four-entry CPU semantics at both RAM origins
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_seek8.py
