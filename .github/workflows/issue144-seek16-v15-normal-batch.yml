name: Issue144 SEEK16 V1/V5 normal resident batch public and VICE gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [issue144-seek16-v15-batched-init-20261016]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seek16-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generator and all five SEEK source contracts
        run: |
          python3 -m py_compile tools/seek_kernel.py tools/generate_seek_sources.py tools/issue144_seek16_v15_normal_batch_qualify.py
          python3 tools/generate_seek_sources.py --check
      - name: Paired V1/V5 source-built public INIT, 8 slots, all three STEP modes
        run: python3 tools/issue144_seek16_v15_normal_batch_qualify.py --moves 64
      - name: Install SHA-256 pinned native VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Independently compare actual native VICE old/new public SEEK output
        run: python3 tools/issue144_seek16_v15_normal_batch_qualify.py --moves 64 --native --write
      - name: Seal native evidence, both changelogs and package SHA256 integrity
        if: github.event_name == 'push'
        run: python3 tools/stage_issue144_seek16_v15_normal_batch.py
      - name: Commit qualified source research and manifest back to research branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue144: seal V1/V5 resident SEEK16 native qualification and package manifest'
          git push origin HEAD:issue144-seek16-v15-batched-init-20261016
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue144-seek16-v15-resident-evidence
          path: validation/review/ISSUE144_SEEK16_V15_NORMAL_BATCH_2026-10-16.json
