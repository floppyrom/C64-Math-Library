name: Signed V2 hybrid 32/32 public builder qualification

on:
  pull_request:
    paths:
      - 'tools/selective_linker.py'
      - 'tools/selective_signed_hybrid_u3232.py'
      - 'tools/test_selective_signed_hybrid_u3232.py'
      - 'tools/native_selective_signed_hybrid_u3232.py'
      - '.github/workflows/signed-v2-3232-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-model-public:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-link V2 signed32/32 with strict full-public ABI
        run: |
          python3 -m compileall -q tools/selective_signed_hybrid_u3232.py tools/selective_linker.py tools/test_selective_signed_hybrid_u3232.py tools/native_selective_signed_hybrid_u3232.py
          python3 -m unittest discover -s tools -p 'test_selective_signed_hybrid_u3232.py' -v
          python3 tools/selective_signed_hybrid_u3232.py

  native-vice:
    needs: cpu-model-public
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install pinned VICE native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned headless VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Check signed DIV/MOD public image at two placements
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_signed_hybrid_u3232.py
