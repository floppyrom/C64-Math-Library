name: One-shot Issue39 32/16 workload audit publication
on:
  push:
    branches: [issue39-udiv3216-workload-methodology]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full 30,720-call workload proof
        run: |
          python3 tools/benchmark_unsigned_3216_workloads.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          filename=root/'validation/review/UNSIGNED_3216_WORKLOAD_AUDIT.json'
          proof=json.loads(filename.read_text())
          assert proof['status']=='PASS' and proof['total_calls']==30720
          stats=root/'RELEASE_STATUS.json'
          st=json.loads(stats.read_text())
          st['issue39_unsigned_3216_multiworkload_2026_10_11']={
            'status':'PASS',
            'documentation':'docs/ISSUE39_UDIV32_16_WORKLOAD_DECISION_2026-10-11.md',
            'reported_calls':30720,
            'scenario_count':6,
            'same_input_across_profiles':True,
            'report_sha256':hashlib.sha256(filename.read_bytes()).hexdigest(),
            'resident_binaries_changed':False,
            'public_abi_changed':False,
            'rejected_q01_source_published':False,
            'unsigned_family_completed':False}
          stats.write_text(json.dumps(st,indent=2)+'\n')
          PY
      - name: Verify unchanged resident binaries and public source rankings
        run: |
          python3 tools/validate_public_catalog.py
          python3 tools/generate_public_indexes.py
          git diff --exit-code -- benchmarks/BEST_PROFILE_RESULTS.csv
      - name: Remove disposable workflow and seal audited package
        run: |
          rm .github/workflows/issue39-3216-workload-publish-temp.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess
          root=Path('.')
          def seal():
            paths=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=str)
            (root/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n' for p in paths))
          for _ in range(5):
            seal()
            subprocess.run(['python3','tools/package_audit.py'],check=True)
          seal()
          PY
          python3 tools/package_audit.py
      - name: Commit public workload proof, dual changelogs and checksums
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish issue39 unsigned 32/16 multiworkload evidence and release hashes'
          git push origin HEAD:issue39-udiv3216-workload-methodology
