name: Historical reciprocal threshold source qualification

on:
  pull_request:
    paths:
      - 'tools/selective_recip16_threshold.py'
      - 'tools/selective_recip16_table.py'
      - 'tools/test_recip16_table_builder.py'
      - 'tools/native_recip16_table.py'
      - 'tools/selective_speed_recip16.py'
      - 'tools/test_recip16_threshold_builder.py'
      - 'tools/native_recip16_threshold.py'
      - 'tools/selective_linker.py'
      - '.github/workflows/recip16-threshold-source-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-assemble V3/V4-inspired stock reciprocal and test full ABI
        run: |
          python3 -m compileall -q tools/selective_recip16_threshold.py tools/selective_speed_recip16.py tools/test_recip16_threshold_builder.py tools/native_recip16_threshold.py tools/selective_recip16_table.py tools/test_recip16_table_builder.py tools/native_recip16_table.py tools/selective_linker.py
          python3 tools/selective_recip16_threshold.py
          python3 tools/selective_recip16_table.py
          python3 -m unittest discover -s tools -p 'test_recip16_threshold_builder.py' -v
          python3 -m unittest discover -s tools -p 'test_recip16_table_builder.py' -v

  native-vice:
    needs: source-and-model
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install pinned native VICE dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned native VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Validate both relocated Q16 public entries under headless VICE
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_recip16_threshold.py
          python3 tools/native_recip16_table.py
