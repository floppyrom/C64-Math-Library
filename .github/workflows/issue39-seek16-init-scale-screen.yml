name: Issue39 SEEK16 Euclidean INIT loop research
on:
  push:
    branches: [issue39-seek16-init-scale-qualify-20261014]
    paths:
      - .github/workflows/issue39-seek16-init-scale-screen.yml
      - tools/issue39_seek16_init_scale_screen.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  five-profile-full-frame-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue39-seek16-init-scale-qualify-20261014
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and benchmark all SEEK8/16 INIT and stepper paths
        run: python3 tools/issue39_seek16_init_scale_screen.py
      - name: Seal reproducible research and validate package
        run: |
          python3 - <<'PY'
          import subprocess,sys
          from tools.stage_issue39_v1_3216_ool_release import reseal
          subprocess.run(["make","clean"],check=True)
          for _ in range(3):
              reseal()
              subprocess.run([sys.executable,"tools/package_audit.py"],check=True)
          PY
      - name: Save source, native generated mirrors and research evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'research(issue39): preserve full SEEK16 scaler benchmark and generated source'
          git push origin HEAD:issue39-seek16-init-scale-qualify-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-seek16-init-scale-research
          path: validation/review/ISSUE39_SEEK16_INIT_SCALE_LOOP_RESEARCH_2026-10-14.json
