name: Research SMUL24 inline dispatch cross-profile
on:
  push:
    branches:
      - research/smul24-inline-dispatch-promotion-v1
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Map SMUL24 packing
        run: python3 tools/map_smul24_inline.py
      - name: Benchmark inline SMUL24 dispatcher across fixed profiles
        run: python3 tools/bench_smul24_inline_dispatch_cross.py
