name: Research V1/V5 SMUL16 stable Y0

on:
  push:
    branches:
      - research/smul16-v1-stable-y0-v1

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benchmark V1/V5 stable-Y0 candidate
        run: python3 tools/bench_smul16_v1_stable_y0.py
