name: Issue144 V4 REU ISQRT32 rotate6 in-place Pareto optin
on:
  push:
    branches: [issue144-v4reu-isqrt-rotate6-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-native-reu-and-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical same-input 4,130 V4 REU model checks, exact flags, actual assembler BEGIN END restore
        run: python3 tools/issue144_v4_reu_rotate6_peephole.py
      - name: Install SHA256-pinned native VICE x64sc
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Real native x64sc against actual V4 16MiB REU image and full status equality
        run: python3 tools/native_issue144_v4_reu_rotate6.py
      - name: Publish source-only production-preserving release seal and both changelogs
        if: github.event_name == 'push'
        run: python3 tools/stage_issue144_v4_reu_rotate6_release.py
      - name: Commit reproducible source evidence and deterministic SHA seal
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue144: seal V4 REU ISQRT32 rotate6 CPU/native Pareto point'
          git push origin HEAD:issue144-v4reu-isqrt-rotate6-20261015
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue144-v4reu-isqrt-rotate6-proof
          path: |
            validation/review/ISSUE144_V4_REU_ISQRT32_ROTATE6_MODEL.json
            validation/review/ISSUE144_V4_REU_ISQRT32_ROTATE6_NATIVE_VICE.json
