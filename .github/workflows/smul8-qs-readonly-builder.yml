name: Read-only signed8 quarter-square Pareto source qualification

on:
  pull_request:
    paths:
      - 'tools/selective_smul8_qs_readonly.py'
      - 'tools/selective_speed_smul8.py'
      - 'tools/test_selective_smul8_qs_readonly.py'
      - 'tools/test_smul8_qs_pareto_bench.py'
      - 'tools/test_smul8_qs_paired_frames.py'
      - 'tools/test_selective_smul8.py'
      - 'tools/native_smul8_qs_readonly.py'
      - 'tools/selective_linker.py'
      - '.github/workflows/smul8-qs-readonly-builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exhaustive 65536 signed pairs, immutable program and historical source safety
        run: |
          python3 -m compileall -q tools/selective_smul8_qs_readonly.py tools/selective_speed_smul8.py tools/test_selective_smul8_qs_readonly.py tools/test_smul8_qs_pareto_bench.py tools/test_smul8_qs_paired_frames.py tools/test_selective_smul8.py tools/native_smul8_qs_readonly.py tools/selective_linker.py
          python3 tools/selective_smul8_qs_readonly.py
          python3 -m unittest discover -s tools -p 'test_selective_smul8_qs_readonly.py' -v
          python3 -m unittest discover -s tools -p 'test_smul8_qs_pareto_bench.py' -v
          python3 -m unittest discover -s tools -p 'test_smul8_qs_paired_frames.py' -v
          python3 -m unittest discover -s tools -p 'test_selective_smul8.py' -v

  pinned-vice:
    needs: source-model
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install native VICE prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned native VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Verify stock 6510 read-only signed8 public entry on two layouts
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_smul8_qs_readonly.py
