name: Issue39 native VICE V1 32-16 out-of-line zero screen
on:
  push:
    branches: [issue39-v1-3216-rare-zero-outofline-screen]
  pull_request:
    paths:
      - 'tools/native_issue39_v1_3216_outofline_zero.py'
      - 'tools/screen_issue39_v1_3216_outofline_zero.py'
      - '.github/workflows/issue39-v1-3216-rare-zero-native.yml'
  workflow_dispatch:

jobs:
  native-v1-full-residents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official pinned VICE r46274 and verify checksum
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Full resident native V1 old/new public 32/16 checks
        run: |
          python3 tools/native_issue39_v1_3216_outofline_zero.py --out /tmp/issue39_v1_3216_native_vice.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue39-v1-3216-rare-zero-native
          path: /tmp/issue39_v1_3216_native_vice.json
