name: Finalize signed core reuse
# V4 ACME accumulator syntax is verified before publication.
# Legacy game-math aggregate is rebuilt before audit.

on:
  push:
    branches:
      - opt/signed-core-reuse-liftable-20261008
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build all candidate maps
        run: |
          make reference
          make alternate
          python3 tools/build_hybrid.py --config-kind reference
          python3 tools/build_hybrid.py --config-kind alternate

      - name: Install rebuilt reference images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          root=Path('.')
          for p in ('v1_balanced','v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              d=root/'build_source/reference'/p
              m=json.loads((d/'source_build_manifest.json').read_text())
              shutil.copy2(d/m['output_prg'], root/p/'resident'/f'math_{p}_game_math.prg')
              ri=m.get('reu_image')
              if ri:
                  src=d/ri['file']
                  dst=next((root/p/'reu').glob('*.reu'))
                  shutil.copy2(src,dst)
          d=root/'build_hybrid/reference/v5_hybrid_lowzp'
          m=json.loads((d/'source_build_manifest.json').read_text())
          shutil.copy2(d/m['output_prg'],root/'v5_hybrid_lowzp/resident/math_v5_hybrid_lowzp_game_math.prg')
          PY

      - name: Validate installed source builds and arithmetic
        run: |
          python3 tools/validate_source_build.py all --build build_source/alternate --out validation/source_relocation
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_unsigned_division.py
          python3 tools/validate_signed_division.py
          python3 tools/validate_muldiv16.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_isqrt32_fast.py
          python3 tools/validate_hybrid.py
          python3 tools/test_hybrid_config.py
          python3 tools/verify_hybrid_deterministic.py

      - name: Regenerate signed and standalone publication
        run: |
          python3 tools/publish_native_signed_sources.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/validate_signed_layout.py
          python3 tools/publish_standalone_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          python3 tools/finalize_signed_core_reuse.py

      - name: Validate custom composition and release gates
        run: |
          make pareto-validate
          make turbo
          make turbo-boundary
          python3 tools/benchmark_normalize_profile_parity.py
          python3 tools/validate_atan2_dispatch.py
          python3 tools/benchmark_seek_profiles.py
          sudo apt-get update
          sudo apt-get install -y acme
          python3 tools/verify_with_acme.py --kind all
          python3 tools/release_audit.py

      - name: Remove transient workflows and build trees
        run: |
          rm -f .github/workflows/acme-debug.yml
          rm -f .github/workflows/signed-core-candidate.yml
          rm -f .github/workflows/signed-core-finalize.yml
          rm -rf build_source build_hybrid build_hybrid_repeat build_pareto
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Reseal package and checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          def seal():
              files=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
              (root/'SHA256SUMS.txt').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n" for p in files))
          seal()
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          files=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n" for p in files))
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          files=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text(''.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n" for p in files))
          PY
          python3 tools/package_audit.py

      - name: Commit finalized publication
        run: |
          git config user.name "C64 Math Library CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Finalize signed core reuse and liftable MULDIV16 publication"
          git push origin HEAD:opt/signed-core-reuse-liftable-20261008
