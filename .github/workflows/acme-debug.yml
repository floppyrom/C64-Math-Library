name: ACME V4 diagnostic

on:
  push:
    branches:
      - opt/signed-core-reuse-liftable-20261008

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and install exact candidate V4 image
        run: |
          make reference
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil
          d=Path('build_source/reference/v4_reu_16m')
          m=json.loads((d/'source_build_manifest.json').read_text())
          shutil.copy2(d/m['output_prg'],Path('v4_reu_16m/resident/math_v4_reu_16m_game_math.prg'))
          PY
      - name: Regenerate canonical sources from candidate image
        run: python3 tools/generate_sources.py
      - name: Inspect exact ACME stage and run V4 only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq acme
          python3 - <<'PY'
          from pathlib import Path
          import re, sys, shutil
          sys.path.insert(0,'tools')
          from assemble_sources import expand_source_file
          p=Path('relocatable_source/v4_reu_16m/math_relocatable.asm')
          txt=expand_source_file(p,preserve_config_include=True)
          stage=Path('/tmp/acme-v4')
          stage.mkdir(parents=True,exist_ok=True)
          (stage/'math_relocatable.asm').write_text(txt)
          shutil.copy2('relocatable_source/v4_reu_16m/math_config_reference.inc',stage/'math_config.inc')
          lines=txt.splitlines()
          print('TOTAL_LINES',len(lines))
          for i,line in enumerate(lines,1):
              if re.search(r'(?<![A-Za-z0-9_])a(?![A-Za-z0-9_])',line,re.I):
                  print('A_TOKEN',i,repr(line))
          for i in range(13910,13951):
              if i<=len(lines): print(f'CTX {i:05d}: {lines[i-1]}')
          PY
          cd /tmp/acme-v4
          set +e
          acme -f cbm -o acme.prg math_relocatable.asm >acme.out 2>acme.err
          rc=$?
          set -e
          echo "ACME_RC=$rc"
          cat acme.out
          tail -120 acme.err
          if grep -q "line " acme.err; then
            n=$(grep -o 'line [0-9]*' acme.err | tail -1 | awk '{print $2}')
            echo "REPORTED_LINE=$n"
            lo=$((n-8)); [ $lo -lt 1 ] && lo=1
            hi=$((n+8))
            nl -ba math_relocatable.asm | sed -n "${lo},${hi}p"
          fi
          exit 0
