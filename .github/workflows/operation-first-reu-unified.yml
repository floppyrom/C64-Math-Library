name: Unified operation-first REU builder acceptance
on:
  pull_request:
    paths:
      - 'tools/configure_math.py'
      - 'tools/math_builder.py'
      - 'tools/reu_unified_setup.py'
      - 'tools/test_reu_unified_user_setup.py'
      - 'tools/reu_qs16_standalone_package.py'
      - '.github/workflows/operation-first-reu-unified.yml'
  push:
    paths:
      - 'tools/configure_math.py'
      - 'tools/math_builder.py'
      - 'tools/reu_unified_setup.py'
      - 'tools/test_reu_unified_user_setup.py'
      - '.github/workflows/operation-first-reu-unified.yml'
jobs:
  global-configuration-and-preserved-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify operation-first Turbo16/Turbo32/QS16 acceptance and deterministic rebuild
        run: |
          python3 -m unittest discover -s tools -p 'test_reu_unified_user_setup.py' -v
          python3 -m unittest discover -s tools -p 'test_reu_user_setup.py' -v
