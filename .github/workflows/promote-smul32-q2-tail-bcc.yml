name: Promote SMUL32 q2 tail BCC

on:
  push:
    branches:
      - opt/smul32-q2-tail-bcc

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opt/smul32-q2-tail-bcc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture A/B evidence
        run: python3 tools/bench_smul32_q2_tail_bcc.py

      - name: Build reference and alternate artifacts
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source

      - name: Promote V2-V4 resident images
        run: |
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          cp build_source/reference/v3_reu_512k/math_v3_reu_512k_source_built.prg v3_reu_512k/resident/math_v3_reu_512k_game_math.prg
          cp build_source/reference/v4_reu_16m/math_v4_reu_16m_source_built.prg v4_reu_16m/resident/math_v4_reu_16m_game_math.prg
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu v4_reu_16m/reu/c64_math_v4_16m_game_math.reu

      - name: Regenerate mirrors and validation
        run: |
          python3 tools/generate_sources.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/publish_standalone_sources.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Update SMUL32 documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          ps=('v2_pareto_fast','v3_reu_512k','v4_reu_16m')
          sm=json.loads((root/'validation/review/SIGNED_MULTIPLY_VALIDATION.json').read_text())
          mr=json.loads((root/'validation/multiply_refresh/MULTIPLY_REFRESH_BENCHMARK.json').read_text())
          ev=json.loads((root/'validation/review/SMUL32_Q2_TAIL_BCC.json').read_text())
          canon={p:sm['profiles'][p]['SMUL32'] for p in ps}
          ready={p:sm['profiles'][p]['SMUL32_READY'] for p in ps}
          shr={p:mr['profiles'][p]['MATH_SMUL32_SHR16'] for p in ps}
          triple=' / '.join(f"{canon[p]['mean_cycles']:.6f}" for p in ps)
          readytr=' / '.join(f"{ready[p]['mean_cycles']:.6f}" for p in ps)
          sh=ev['results']['shared']['v2_pareto_fast']
          q2=ev['results']['q2']['v2_pareto_fast']
          shrmean=shr['v2_pareto_fast']['mean_cycles']
          shrrange=f"{shr['v2_pareto_fast']['min_cycles']}–{shr['v2_pareto_fast']['max_cycles']}"

          p=root/'docs/SMUL32_FAST31_V2.md'; t=p.read_text()
          oldvals={'712.935243':f"{canon['v2_pareto_fast']['mean_cycles']:.6f}",
                   '713.365297':f"{canon['v3_reu_512k']['mean_cycles']:.6f}",
                   '713.431714':f"{canon['v4_reu_16m']['mean_cycles']:.6f}"}
          for old,new in oldvals.items(): t=t.replace(old,new)
          t=t.replace('**782.219674 cycles mean (695–906)**',f"**{shrmean:.6f} cycles mean ({shrrange})**")
          t=t.replace('**725.257812 / 725.672852 / 723.503906**',f"**{readytr}**")
          marker='The fixed-point derivative `MATH_SMUL32_SHR16` is now'
          para=(
            "\nA final **q2 page-layout micro-pass** exploits a known-clear carry after the "
            "`ADC #1 / BCS` tail: the three-byte `JMP` to signed correction becomes an "
            "always-taken two-byte `BCC` with the same three-cycle execution cost. The one-byte "
            "shrink moves the hot q2 `c4b` continuation from $5600 to $55FF, eliminating its "
            "taken page-cross penalty without changing arithmetic, ZP usage, stack usage, the "
            "four-row producer, or the public ABI. On the shared 20,324-case corpus the mean "
            f"improves from **{sh['baseline']['mean']:.6f} to {sh['candidate']['mean']:.6f} cycles** "
            f"({sh['delta']:.6f}); on the 20,070-case q2-focused corpus it improves from "
            f"**{q2['baseline']['mean']:.6f} to {q2['candidate']['mean']:.6f}**, and the worst case "
            f"drops **{q2['baseline']['max']} → {q2['candidate']['max']}**.\n\n"
          )
          if 'q2 page-layout micro-pass' not in t:
              loc=t.find(marker)
              if loc<0: raise SystemExit('SMUL32 doc insertion marker missing')
              t=t[:loc]+para+t[loc:]
          p.write_text(t)

          living=[root/'PERFORMANCE.md',root/'docs/SMUL32_COMPACT126.md',
                  root/'docs/VERSION_SELECTION.md',root/'docs/SIGNED_IMPLEMENTATIONS.md',
                  root/'v2_pareto_fast/README.md',root/'v3_reu_512k/README.md',
                  root/'v4_reu_16m/README.md']
          oldtr='712.935243 / 713.365297 / 713.431714'
          for p in living:
              if not p.exists(): continue
              t=p.read_text().replace(oldtr,triple)
              # PERFORMANCE's summary table still carried the pre-q2 public values.
              t=t.replace('| `MATH_SMUL32` | `mul_s32_s32_s64` | 744.569946 | 715.605230 | 716.033209 | 716.090079 | 743.913242 |',
                          f"| `MATH_SMUL32` | `mul_s32_s32_s64` | 744.569946 | {canon['v2_pareto_fast']['mean_cycles']:.6f} | {canon['v3_reu_512k']['mean_cycles']:.6f} | {canon['v4_reu_16m']['mean_cycles']:.6f} | 743.913242 |")
              t=t.replace('| `MATH_SMUL32_SHR16` | `mul_s32_s32_s48_shr16` | 812.998853 | 784.998853 | 784.998853 | 784.998853 | 812.998853 |',
                          f"| `MATH_SMUL32_SHR16` | `mul_s32_s32_s48_shr16` | 812.998853 | {shrmean:.6f} | {shrmean:.6f} | {shrmean:.6f} | 812.998853 |")
              p.write_text(t)

          p=root/'CHANGELOG.md'; t=p.read_text()
          entry=(
            '## 2026-10-06 — SMUL32 q2 page-layout micro-optimization\n\n'
            '- Replaced a carry-known three-byte JMP in the V2/V3/V4 q2 bounded tail with an always-taken two-byte BCC; execution cost is unchanged at that site, while the one-byte shrink pulls the hot c4b continuation back onto page $55.\n'
            f'- Canonical SMUL32 means are **{triple} cycles**; min remains **630**, max improves **841 → 840**.\n'
            f"- Shared 20,324-case mean improves **{sh['baseline']['mean']:.6f} → {sh['candidate']['mean']:.6f}** ({sh['delta']:.6f}); q2-focused mean improves **{q2['baseline']['mean']:.6f} → {q2['candidate']['mean']:.6f}**.\n"
            f'- MATH_SMUL32_SHR16 is **{shrmean:.6f} cycles mean ({shrrange})**. The 31-ZP / zero-persistent-stack contract, producer and ABI are unchanged.\n\n'
          )
          if 'SMUL32 q2 page-layout micro-optimization' not in t: p.write_text(entry+t)

          p=root/'CSDB_CHANGELOG.txt'; t=p.read_text()
          entry=(
            '2026-10-06 SMUL32 Q2 PAGE-LAYOUT MICRO-OPTIMIZATION\n'
            '- V2/V3/V4 shorten one carry-known q2 bounded-tail transfer from JMP to BCC, keeping the hot continuation on one page.\n'
            f'- Canonical means: {triple}; min 630, max 840.\n'
            f"- Shared 20,324-case mean: {sh['candidate']['mean']:.6f}; q2-focused mean: {q2['candidate']['mean']:.6f}.\n"
            '- 31-ZP, zero persistent stack, producer and public ABI unchanged.\n\n'
          )
          if 'SMUL32 Q2 PAGE-LAYOUT MICRO-OPTIMIZATION' not in t: p.write_text(entry+t)
          PY

      - name: Regenerate indexes after docs update
        run: |
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py

      - name: Refresh release hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads((root/'RELEASE_STATUS.json').read_text())
          for p in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              s['reference_prg_sha256'][p]=sha(root/'build_source/reference'/p/f'math_{p}_source_built.prg')
              s['alternate_prg_sha256'][p]=sha(root/'build_source/alternate'/p/f'math_{p}_source_built.prg')
          for p in ('v3_reu_512k','v4_reu_16m'):
              s['reference_reu_sha256'][p]=sha(root/'build_source/reference'/p/f'c64_math_{p}_source_built.reu')
              s['alternate_reu_sha256'][p]=sha(root/'build_source/alternate'/p/f'c64_math_{p}_source_built.reu')
          s['date']='2026-10-06'
          (root/'RELEASE_STATUS.json').write_text(json.dumps(s,indent=2)+'\n')
          PY

      - name: Verify promoted artifacts
        run: |
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/validate_turbo_relocation.py
          python3 tools/validate_turbo_boundary_sweep.py

      - name: Remove research scaffolding
        run: |
          rm -f .github/workflows/research-smul32-q2-tail-bcc.yml
          rm -f .github/workflows/promote-smul32-q2-tail-bcc.yml
          rm -f tools/bench_smul32_q2_tail_bcc.py
          rm -rf build_source

      - name: Refresh package manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          def refresh():
              fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
              (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          refresh()
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'),key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py

      - name: Commit promoted artifacts
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No promotion changes to commit"
          else
            git commit -m "Promote SMUL32 q2 tail layout optimization"
            git push origin HEAD:opt/smul32-q2-tail-bcc
          fi
