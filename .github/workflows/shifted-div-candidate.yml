name: Shifted DIV candidate

on:
  push:
    branches:
      - opt/shifted-div-recip-campaign-20261008
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reference profiles
        run: make reference
      - name: Install candidate residents
        run: |
          for p in v1_balanced v2_pareto_fast v3_reu_512k v4_reu_16m; do
            cp "build_source/reference/$p/math_${p}_source_built.prg" "$p/resident/math_${p}_game_math.prg"
            cp "build_source/reference/$p/math_api.inc" "$p/resident/math_api.inc"
          done
      - name: Validate unsigned shifted divide and reciprocal
        run: |
          for p in v2_pareto_fast v3_reu_512k v4_reu_16m; do
            python3 tools/validate_unsigned_division.py --profile "$p" --out "/tmp/${p}_unsigned.json"
            python3 - "$p" "/tmp/${p}_unsigned.json" <<'PY'
          import json,sys
          p,path=sys.argv[1:3]
          j=json.load(open(path))
          r=j['profiles'][p] if 'profiles' in j else j[p]
          for n in ('MATH_UDIV16_SHL8','MATH_URECIP16_Q16'): print(p,n,r[n])
          PY
          done
      - name: Validate signed shifted divide
        run: |
          for p in v2_pareto_fast v3_reu_512k v4_reu_16m; do
            python3 tools/validate_signed_division.py --profile "$p" --out "/tmp/${p}_signed.json"
            python3 - "$p" "/tmp/${p}_signed.json" <<'PY'
          import json,sys
          p,path=sys.argv[1:3]
          j=json.load(open(path))
          r=j['profiles'][p] if 'profiles' in j else j[p]
          print(p,'MATH_SDIV16_SHL8',r['MATH_SDIV16_SHL8'])
          PY
          done
