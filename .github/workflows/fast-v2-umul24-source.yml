name: Source-linked V2 biased quarter-square UMUL24 candidate

on:
  pull_request:
    paths:
      - 'tools/selective_v2_fast_umul24.py'
      - 'tools/test_research_v2_umul24.py'
      - 'tools/selective_speed_umul24.py'
      - 'tools/test_selective_v2_umul24_builder.py'
      - 'tools/native_selective_v2_umul24_builder.py'
      - 'tools/selective_linker.py'
      - 'examples/operation-first-umul24-speed.json'
      - 'docs/V2_UMUL24_QUARTERSQUARE_TRANSPLANT.md'
      - '.github/workflows/fast-v2-umul24-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-model-relocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Relocate original V2 UMUL24 and prove full public product at two origins
        run: |
          python3 -m compileall -q tools/selective_v2_fast_umul24.py tools/test_research_v2_umul24.py
          python3 -m unittest discover -s tools -p 'test_research_v2_umul24.py' -v
      - name: Verify matched full public speed and installer source-linked resource bounds
        run: |
          python3 -m compileall -q tools/selective_speed_umul24.py tools/test_selective_v2_umul24_builder.py
          python3 -m unittest discover -s tools -p 'test_selective_v2_umul24_builder.py' -v
          make builder-speed SPEED_CONFIG=examples/operation-first-umul24-speed.json OUT=build_fast_umul24
          test -s build_fast_umul24/math_selective.prg
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("build_fast_umul24/selective_manifest.json").read_text())
          assert len(d["operations"])==1
          assert d["operations"][0]["variant"]=="link:v2-quarter-square"
          assert d["resource_use"]["zero_page_bytes"]==24
          PY

  native-vice:
    needs: source-model-relocation
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install pinned headless VICE r46284 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git make gcc g++ autoconf automake libtool pkg-config bison flex texinfo dos2unix xa65 gettext libpng-dev zlib1g-dev libreadline-dev
      - name: Build pinned native headless VICE r46284
        env:
          VICE_JOBS: '2'
        run: bash tools/vice/build_headless.sh
      - name: Check source-linked biased V2 UMUL24 both relocations and no-profile full ABI
        run: |
          mkdir -p "$HOME/.local/state/vice"
          export VICE_WRAPPER="$PWD/.vice-build/r46284/bin/x64sc"
          bash tools/vice/verify_headless.sh "$VICE_WRAPPER"
          python3 tools/native_selective_v2_umul24_builder.py
