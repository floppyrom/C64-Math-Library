name: Issue144 SEEK16 safe relocated INIT research
on:
  push:
    branches: [issue144-seek16-relocated-screen-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model-native-vice:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact model state plus subsequent STEP and reserved memory
        run: python3 tools/issue144_seek16_k1_relocate.py
      - name: Install known native headless VICE
        run: |
          curl -fL --retry 3 --connect-timeout 20 'https://github.com/VICE-Team/svn-mirror/releases/download/r46274/headlessvice_3.10%2Br46274.deb' -o /tmp/headlessvice.deb
          echo '5d85ab7b73e9b32007ac7f844603e101fdd7009c47d1898216bfff4b2a44996a  /tmp/headlessvice.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/headlessvice.deb
          echo "VICE_WRAPPER=$(command -v x64sc)" >> "$GITHUB_ENV"
      - name: Native source-backed $19F0/$1A00-preserving real VICE
        run: python3 tools/native_issue144_seek16_k1_relocate.py
      - name: Stage research-only documentation and seal source
        if: github.event_name == 'push'
        run: python3 tools/stage_issue144_seek_research.py
      - name: Commit research-only records and auditable source
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'issue144: publish relocated seek INIT research without resident promotion'
          git push origin HEAD:issue144-seek16-relocated-screen-20261015
      - uses: actions/upload-artifact@v4
        with:
          name: issue144-seek16-k1-research
          if-no-files-found: warn
          path: |
            validation/review/ISSUE144_SEEK16_K1_RELOCATED_RESEARCH.json
            validation/review/ISSUE144_SEEK16_K1_RELOCATED_NATIVE_VICE.json
