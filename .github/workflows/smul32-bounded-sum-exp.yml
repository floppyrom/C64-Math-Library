name: SMUL32 bounded-sum experiment

on:
  push:
    branches:
      - smul32-bounded-sum-exp
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  v2-smul32:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble V2 reference source
        run: |
          python3 tools/assemble_sources.py --profile v2_pareto_fast --config-kind reference --out build_source
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg \
             v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
      - name: Profile remaining SMUL32 branches
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          import random
          from tools.validate_signed_multiply import load_profile, wr
          from tools.assemble_sources import ROOT, preprocess
          from tools.mini6502 import Assembler, REV

          src=ROOT/'relocatable_source/v2_pareto_fast/math_relocatable.asm'
          cfg=ROOT/'relocatable_source/v2_pareto_fast/math_config_reference.inc'
          mem,labels,const=Assembler().assemble(preprocess(src,cfg))

          def run_profile(tag,lo_name,hi_name,pairs):
              lo=labels[lo_name]; hi=labels[hi_name]
              pcs={pc for pc in range(lo,hi) if mem.get(pc) in REV and REV[mem[pc]][1]=='rel'}
              cpu,api=load_profile('v2_pareto_fast')
              stat=defaultdict(lambda:[0,0])
              orig=cpu.step
              def step():
                  pc0=cpu.pc; c0=cpu.cycles
                  oc=orig()
                  if pc0 in pcs:
                      stat[pc0][0]+=1; stat[pc0][1]+=cpu.cycles-c0
                  return oc
              cpu.step=step
              for x,y in pairs:
                  wr(cpu.mem,0xC000,x,4); wr(cpu.mem,0xC004,y,4)
                  cpu.call(api['MATH_SMUL32'],2_000_000)
              labs=sorted((v,k) for k,v in labels.items() if lo<=v<hi)
              for pc in sorted(pcs):
                  n,cy=stat.get(pc,(0,0))
                  if not n: continue
                  op,mode=REV[mem[pc]]
                  off=mem[pc+1]; off=off-256 if off&128 else off
                  target=(pc+2+off)&0xffff
                  cross=int(((pc+2)&0xff00)!=(target&0xff00))
                  avg=cy/n; taken=(avg-2)/(1+cross)
                  prev=[(ad,nm) for ad,nm in labs if ad<=pc]
                  nm=prev[-1][1] if prev else ''
                  print(f'{tag}BR {pc:04X} {op.upper()} -> {target:04X} label={nm} n={n} taken={taken:.6f} cross={cross}')

          rng=random.Random(0x51304252)
          pp=[(rng.randrange(0x80000000),rng.randrange(0x80000000)) for _ in range(10000)]
          nn=[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000,1<<32)) for _ in range(10000)]
          run_profile('Q0','S32V28_q0_fast_core_start','S32V28_q0_cg_code_end',pp)
          run_profile('NN','S32V28_fast_base_core_start','S32V28_cg_code_end',nn)
          PY
      - name: Sweep remaining summation carry sites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import random, re, shutil, subprocess
          from tools.validate_signed_multiply import load_profile, test_entry

          src=Path('relocatable_source/v2_pareto_fast/smul32_fast31_v29.inc')
          base=src.read_text()
          rng=random.Random(0x53333243)
          corpora={
              'base':[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000,1<<32)) for _ in range(6000)],
              'q0':[(rng.randrange(0x80000000),rng.randrange(0x80000000)) for _ in range(6000)],
              'q1':[(rng.randrange(0x80000000),rng.randrange(0x80000000,1<<32)) for _ in range(6000)],
              'q2':[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000)) for _ in range(6000)],
          }
          blocks={
              'base':('S32V28_summation:','S32V28_cg_code_end:','S32V28_'),
              'q0':('S32V28_q0_summation:','S32V28_q0_cg_code_end:','S32V28_q0_'),
              'q1':('S32V28_q1_summation:','S32V28_q1_cg_code_end:','S32V28_q1_'),
              'q2':('S32V28_q2_summation:','S32V28_q2_cg_code_end:','S32V28_q2_'),
          }

          def coldify(text, group, site):
              start,end,p=blocks[group]
              a=text.index(start); b=text.index(end,a)
              q=text[a:b]
              handler=''
              if site=='c2a':
                  pat=(r'(        adc S32V28_z20\n)'
                       r'        bcc '+re.escape(p)+r'c2a_done\n'
                       r'        inc S32V28_z30\n'
                       r'        beq ('+re.escape(p)+r'c2a_overflow(?:_tramp)?)\n'
                       r'        clc\n'
                       +re.escape(p)+r'c2a_done:\n')
                  m=re.search(pat,q)
                  if not m: return None
                  ov=m.group(2)
                  repl=(m.group(1)+f'        bcs {p}test_c2a_carry\n'
                        +f'{p}c2a_done:\n')
                  q=q[:m.start()]+repl+q[m.end():]
                  handler=(f'{p}test_c2a_carry:\n'
                           '        inc S32V28_z30\n'
                           f'        beq {ov}\n'
                           '        clc\n'
                           f'        jmp {p}c2a_done\n\n')
              elif site=='c3a':
                  pat=(r'(        adc S32V28_z03\n)'
                       r'        bcc '+re.escape(p)+r'c3a_done\n'
                       r'        inx\n'
                       r'        clc\n'
                       +re.escape(p)+r'c3a_done:\n')
                  m=re.search(pat,q)
                  if not m: return None
                  repl=(m.group(1)+f'        bcs {p}test_c3a_carry\n'
                        +f'{p}c3a_done:\n')
                  q=q[:m.start()]+repl+q[m.end():]
                  handler=(f'{p}test_c3a_carry:\n'
                           '        inx\n'
                           '        clc\n'
                           f'        jmp {p}c3a_done\n\n')
              elif site=='c3b':
                  pat=(r'(        adc S32V28_z30\n)'
                       r'        bcc '+re.escape(p)+r'c3b_done\n'
                       r'        inx\n'
                       r'        beq ('+re.escape(p)+r'c3b_overflow(?:_tramp)?)\n'
                       r'        clc\n'
                       +re.escape(p)+r'c3b_done:\n')
                  m=re.search(pat,q)
                  if not m: return None
                  ov=m.group(2)
                  repl=(m.group(1)+f'        bcs {p}test_c3b_carry\n'
                        +f'{p}c3b_done:\n')
                  q=q[:m.start()]+repl+q[m.end():]
                  handler=(f'{p}test_c3b_carry:\n'
                           '        inx\n'
                           f'        beq {ov}\n'
                           '        clc\n'
                           f'        jmp {p}c3b_done\n\n')
              elif site=='c4b':
                  pat=(r'(        adc S32V28_z31\n)'
                       r'        bcc '+re.escape(p)+r'c4b_done\n'
                       r'        iny\n'
                       r'        beq ('+re.escape(p)+r'c4b_overflow)\n'
                       r'        clc\n'
                       +re.escape(p)+r'c4b_done:\n')
                  m=re.search(pat,q)
                  if not m: return None
                  ov=m.group(2)
                  repl=(m.group(1)+f'        bcs {p}test_c4b_carry\n'
                        +f'{p}c4b_done:\n')
                  q=q[:m.start()]+repl+q[m.end():]
                  handler=(f'{p}test_c4b_carry:\n'
                           '        iny\n'
                           f'        beq {ov}\n'
                           '        clc\n'
                           f'        jmp {p}c4b_done\n\n')
              else:
                  raise ValueError(site)
              # Put the cold handler immediately after the hot-path RTS block
              # and before the existing helper island, preserving branch reach.
              ins=q.find(p+'c4a_carry:')
              if ins < 0:
                  ins=q.find(p+'c2a_overflow')
              q=q[:ins]+handler+q[ins:]
              return text[:a]+q+text[b:]

          def run_candidate(name,text,pairs):
              src.write_text(text)
              shutil.rmtree('build_sweep',ignore_errors=True)
              p=subprocess.run(['python3','tools/assemble_sources.py','--profile','v2_pareto_fast',
                                '--config-kind','reference','--out','build_sweep'],
                               text=True,capture_output=True)
              if p.returncode:
                  tail=(p.stderr.strip().splitlines()[-1] if p.stderr.strip() else '')
                  print('SWEEP',name,'ASSEMBLY_FAIL',tail)
                  return
              shutil.copy2('build_sweep/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg',
                           'v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg')
              cpu,api=load_profile('v2_pareto_fast')
              r=test_entry(cpu,api['MATH_SMUL32'],32,pairs)
              print(f'SWEEP {name} mean={r["mean_cycles"]:.6f} min={r["min_cycles"]} max={r["max_cycles"]} errors={r["errors"]}')

          for group,pairs in corpora.items():
              run_candidate(group+'-baseline',base,pairs)
              for site in ('c2a','c3a','c3b','c4b'):
                  cand=coldify(base,group,site)
                  if cand is None:
                      print('SWEEP',group+'-'+site,'PATCH_MISS')
                  else:
                      run_candidate(group+'-'+site,cand,pairs)

          src.write_text(base)
          shutil.rmtree('build_sweep',ignore_errors=True)
          subprocess.run(['python3','tools/assemble_sources.py','--profile','v2_pareto_fast',
                          '--config-kind','reference','--out','build_sweep'],check=True)
          shutil.copy2('build_sweep/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg',
                       'v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg')
          PY
      - name: Prototype q1 fused signed correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import random, shutil, subprocess
          from tools.validate_signed_multiply import load_profile, test_entry

          src=Path('relocatable_source/v2_pareto_fast/smul32_fast31_v29.inc')
          base=src.read_text()
          old='''        txa
                  adc S32V28_z13
                  bcs S32V28_q1_c4a_carry
          S32V28_q1_c4a_done:
                  adc S32V28_z31
                  bcc S32V28_q1_c4b_done
                  iny
                  beq S32V28_q1_c4b_overflow
                  clc
          S32V28_q1_c4b_done:
                  adc S32V28_z22
                  tax

                  tya
                  adc S32V28_z32
                  bcs S32V28_q1_c5a_carry
          S32V28_q1_c5a_done:
                  adc S32V28_z23
                  tay

                  lda S32V28_z33
                  adc S32V28_z24
                  bcs S32V28_q1_final_carry
          S32V28_q1_signed_correction_ready:
                  sta S32V28_z33
                  txa
                  sec
                  sbc MATH_IO
                  sta MATH_IO+$0C
                  tya
                  sbc S32V28_x1
                  sta MATH_IO+$0D
                  lda S32V28_z33
                  sbc S32V28_x2
                  sta MATH_IO+$0E
                  lda S32V28_r7
                  sbc S32V28_x3
                  sta MATH_IO+$0F
          '''
          new='''        ; Fuse -(X<<32) into the high-column summation.  The binder
                  ; already holds ~x0 in the q1 neg-low SMC operand and ~x1..~x3
                  ; in the persistent pointer lows, so the signed correction is
                  ; just a fifth high-column addend plus the two's-complement +1.
                  txa
                  adc S32V28_z13
                  bcs S32V28_q1_c4a_carry
          S32V28_q1_c4a_done:
                  adc S32V28_z31
                  bcc S32V28_q1_c4b_done
                  iny
                  beq S32V28_q1_c4b_overflow
                  clc
          S32V28_q1_c4b_done:
                  adc S32V28_z22
                  bcc S32V28_q1_f_c4c_done
                  iny
                  bne S32V28_q1_f_c4c_clc
                  inc S32V28_z33
                  bne S32V28_q1_f_c4c_clc
                  inc S32V28_r7
          S32V28_q1_f_c4c_clc:
                  clc
          S32V28_q1_f_c4c_done:
                  adc S32V28_q1__neg_lo_0+1
                  bcc S32V28_q1_f_c4d_done
                  iny
                  bne S32V28_q1_f_c4d_clc
                  inc S32V28_z33
                  bne S32V28_q1_f_c4d_clc
                  inc S32V28_r7
          S32V28_q1_f_c4d_clc:
                  clc
          S32V28_q1_f_c4d_done:
                  adc #1
                  bcc S32V28_q1_f_c4e_done
                  iny
                  bne S32V28_q1_f_c4e_clc
                  inc S32V28_z33
                  bne S32V28_q1_f_c4e_clc
                  inc S32V28_r7
          S32V28_q1_f_c4e_clc:
                  clc
          S32V28_q1_f_c4e_done:
                  sta MATH_IO+$0C

                  tya
                  adc S32V28_z32
                  bcs S32V28_q1_c5a_carry
          S32V28_q1_c5a_done:
                  adc S32V28_z23
                  bcc S32V28_q1_f_c5b_done
                  inc S32V28_z24
                  bne S32V28_q1_f_c5b_clc
                  inc S32V28_r7
          S32V28_q1_f_c5b_clc:
                  clc
          S32V28_q1_f_c5b_done:
                  adc S32V28_neg_lo_1
                  sta MATH_IO+$0D

                  lda S32V28_z33
                  adc S32V28_z24
                  bcc S32V28_q1_f_c6a_done
                  inc S32V28_r7
                  clc
          S32V28_q1_f_c6a_done:
                  adc S32V28_neg_lo_2
                  sta MATH_IO+$0E
                  lda S32V28_r7
                  adc S32V28_neg_lo_3
                  sta MATH_IO+$0F
          '''
          if old not in base:
              raise SystemExit('q1 fusion patch anchor not found')
          cand=base.replace(old,new,1)
          src.write_text(cand)
          shutil.rmtree('build_fused',ignore_errors=True)
          p=subprocess.run(['python3','tools/assemble_sources.py','--profile','v2_pareto_fast',
                            '--config-kind','reference','--out','build_fused'],
                           text=True,capture_output=True)
          if p.returncode:
              print('FUSEDQ1 ASSEMBLY_FAIL')
              print(p.stderr)
          else:
              shutil.copy2('build_fused/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg',
                           'v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg')
              cpu,api=load_profile('v2_pareto_fast')
              rng=random.Random(0x46555345)
              pairs=[(rng.randrange(0x80000000),rng.randrange(0x80000000,1<<32)) for _ in range(20000)]
              r=test_entry(cpu,api['MATH_SMUL32'],32,pairs)
              print('FUSEDQ1 PN',r)
              if not r['errors']:
                  e=[0,1,2,3,0x7ffffffe,0x7fffffff]
                  n=[0x80000000,0x80000001,0xfffffffe,0xffffffff]
                  edge=[(x,y) for x in e for y in n]
                  cpu,api=load_profile('v2_pareto_fast')
                  print('FUSEDQ1 EDGE',test_entry(cpu,api['MATH_SMUL32'],32,edge))
          src.write_text(base)
          shutil.rmtree('build_fused',ignore_errors=True)
          subprocess.run(['python3','tools/assemble_sources.py','--profile','v2_pareto_fast',
                          '--config-kind','reference','--out','build_fused'],check=True)
          shutil.copy2('build_fused/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg',
                       'v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg')
          PY
      - name: Validate and print signed multiply timing
        run: |
          python3 tools/validate_signed_multiply.py --profile v2_pareto_fast
          python3 - <<'PY'
          import json
          p=json.load(open('validation/review/SIGNED_MULTIPLY_VALIDATION.json'))
          print(json.dumps(p['profiles']['v2_pareto_fast']['SMUL32'], indent=2))
          print(json.dumps(p['profiles']['v2_pareto_fast']['SMUL32_READY'], indent=2))
          PY
          python3 - <<'PY'
          import random
          from tools.validate_signed_multiply import load_profile, test_entry
          cpu,api=load_profile('v2_pareto_fast')
          rng=random.Random(0x534D554C)
          quadrants={
              'PP':[(rng.randrange(0x80000000),rng.randrange(0x80000000)) for _ in range(10000)],
              'PN':[(rng.randrange(0x80000000),rng.randrange(0x80000000,1<<32)) for _ in range(10000)],
              'NP':[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000)) for _ in range(10000)],
              'NN':[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000,1<<32)) for _ in range(10000)],
          }
          for name,pairs in quadrants.items():
              r=test_entry(cpu,api['MATH_SMUL32'],32,pairs)
              print('QUADRANT',name,r)
          PY
