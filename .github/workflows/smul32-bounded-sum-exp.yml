name: SMUL32 bounded-sum experiment

on:
  push:
    branches:
      - smul32-bounded-sum-exp
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  v2-smul32:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble V2 reference source
        run: |
          python3 tools/assemble_sources.py --profile v2_pareto_fast --config-kind reference --out build_source
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg \
             v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
      - name: Sweep late-column addition order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from itertools import permutations
          import random, shutil, subprocess
          from tools.validate_signed_multiply import load_profile, test_entry

          src=Path('relocatable_source/v2_pareto_fast/smul32_fast31_v29.inc')
          base=src.read_text()
          specs=[
              ('Q0','S32V28_q0_summation:','S32V28_q0_cg_code_end:','S32V28_q0_',
               lambda r:[(r.randrange(0x80000000),r.randrange(0x80000000)) for _ in range(3000)]),
              ('Q1','S32V28_q1_summation:','S32V28_q1_cg_code_end:','S32V28_q1_',
               lambda r:[(r.randrange(0x80000000),r.randrange(0x80000000,1<<32)) for _ in range(3000)]),
              ('NN','S32V28_summation:','S32V28_cg_code_end:','S32V28_',
               lambda r:[(r.randrange(0x80000000,1<<32),r.randrange(0x80000000,1<<32)) for _ in range(3000)]),
          ]

          def reorder(text,start,end,prefix,c4,c5):
              a=text.index(start); b=text.index(end,a); q=text[a:b]
              old4=[f'adc S32V28_z13',f'adc S32V28_z31',f'adc S32V28_z22']
              old5=[f'adc S32V28_z32',f'adc S32V28_z23']
              # These five forms occur exactly once in each summation block.
              for i,x in enumerate(old4):
                  if q.count(x)!=1: raise RuntimeError((prefix,x,q.count(x)))
                  q=q.replace(x,f'ADC4_{i}')
              for i,x in enumerate(old5):
                  if q.count(x)!=1: raise RuntimeError((prefix,x,q.count(x)))
                  q=q.replace(x,f'ADC5_{i}')
              vals4=['S32V28_z13','S32V28_z31','S32V28_z22']
              vals5=['S32V28_z32','S32V28_z23']
              for i,v in enumerate(c4): q=q.replace(f'ADC4_{i}',f'adc {v}')
              for i,v in enumerate(c5): q=q.replace(f'ADC5_{i}',f'adc {v}')
              return text[:a]+q+text[b:]

          for si,(tag,start,end,prefix,mkpairs) in enumerate(specs):
              rng=random.Random(0x4F524400+si)
              pairs=mkpairs(rng)
              for p4 in permutations(['S32V28_z13','S32V28_z31','S32V28_z22']):
                  for p5 in permutations(['S32V28_z32','S32V28_z23']):
                      cand=reorder(base,start,end,prefix,p4,p5)
                      src.write_text(cand)
                      shutil.rmtree('build_order',ignore_errors=True)
                      p=subprocess.run(['python3','tools/assemble_sources.py','--profile','v2_pareto_fast',
                                        '--config-kind','reference','--out','build_order'],
                                       text=True,capture_output=True)
                      name='/'.join(x[-3:] for x in p4)+'+'+'/'.join(x[-3:] for x in p5)
                      if p.returncode:
                          print('ORD',tag,name,'ASSEMBLY_FAIL')
                          continue
                      shutil.copy2('build_order/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg',
                                   'v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg')
                      cpu,api=load_profile('v2_pareto_fast')
                      r=test_entry(cpu,api['MATH_SMUL32'],32,pairs)
                      print(f'ORD {tag} {name} mean={r["mean_cycles"]:.6f} errors={r["errors"]}')
          src.write_text(base)
          PY
      - name: Validate and print signed multiply timing
        run: |
          python3 tools/validate_signed_multiply.py --profile v2_pareto_fast
          python3 - <<'PY'
          import json
          p=json.load(open('validation/review/SIGNED_MULTIPLY_VALIDATION.json'))
          print(json.dumps(p['profiles']['v2_pareto_fast']['SMUL32'], indent=2))
          print(json.dumps(p['profiles']['v2_pareto_fast']['SMUL32_READY'], indent=2))
          PY
          python3 - <<'PY'
          import random
          from tools.validate_signed_multiply import load_profile, test_entry
          cpu,api=load_profile('v2_pareto_fast')
          rng=random.Random(0x534D554C)
          quadrants={
              'PP':[(rng.randrange(0x80000000),rng.randrange(0x80000000)) for _ in range(10000)],
              'PN':[(rng.randrange(0x80000000),rng.randrange(0x80000000,1<<32)) for _ in range(10000)],
              'NP':[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000)) for _ in range(10000)],
              'NN':[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000,1<<32)) for _ in range(10000)],
          }
          for name,pairs in quadrants.items():
              r=test_entry(cpu,api['MATH_SMUL32'],32,pairs)
              print('QUADRANT',name,r)
          PY
