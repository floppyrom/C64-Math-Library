name: SMUL32 bounded-sum experiment

on:
  push:
    branches:
      - smul32-bounded-sum-exp
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  v2-smul32:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble V2 reference source
        run: |
          python3 tools/assemble_sources.py --profile v2_pareto_fast --config-kind reference --out build_source
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg \
             v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
      - name: Decompose q2 carry candidates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import random, shutil, subprocess
          from tools.validate_signed_multiply import load_profile, test_entry

          src=Path('relocatable_source/v2_pareto_fast/smul32_fast31_v29.inc')
          base=src.read_text()
          rng=random.Random(0x51324341)
          pairs=[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000)) for _ in range(5000)]

          def patch(text, which):
              a=text.index('S32V28_q2_summation:')
              b=text.index('S32V28_q2_cg_code_end:',a)
              q=text[a:b]
              cold=''
              if 'c4a' in which:
                  q=q.replace(
'''        txa
        adc S32V28_z13
        bcc S32V28_q2_c4a_done
        iny
        clc
S32V28_q2_c4a_done:
''',
'''        txa
        adc S32V28_z13
        bcs S32V28_q2_test_c4a_carry
S32V28_q2_c4a_done:
''')
                  cold+='''S32V28_q2_test_c4a_carry:
        iny
        clc
        jmp S32V28_q2_c4a_done

'''
              if 'c5a' in which:
                  q=q.replace(
'''        tya
        adc S32V28_z32
        bcc S32V28_q2_c5a_done
        inc S32V28_z24
        clc
S32V28_q2_c5a_done:
''',
'''        tya
        adc S32V28_z32
        bcs S32V28_q2_test_c5a_carry
S32V28_q2_c5a_done:
''')
                  cold+='''S32V28_q2_test_c5a_carry:
        inc S32V28_z24
        clc
        jmp S32V28_q2_c5a_done

'''
              if 'final' in which:
                  q=q.replace(
'''        lda S32V28_z33
        adc S32V28_z24
        bcc S32V28_q2_signed_correction
        inc S32V28_r7
S32V28_q2_signed_correction:
''',
'''        lda S32V28_z33
        adc S32V28_z24
        bcs S32V28_q2_test_final_carry
S32V28_q2_signed_correction:
''')
                  cold+='''S32V28_q2_test_final_carry:
        inc S32V28_r7
        jmp S32V28_q2_signed_correction

'''
              m=q.index('S32V28_q2_c2a_overflow:')
              q=q[:m]+cold+q[m:]
              return text[:a]+q+text[b:]

          variants=[(),('c4a',),('c5a',),('final',),('c4a','c5a'),('c5a','final'),('c4a','final')]
          for which in variants:
              src.write_text(patch(base,which))
              shutil.rmtree('build_q2cand',ignore_errors=True)
              p=subprocess.run(['python3','tools/assemble_sources.py','--profile','v2_pareto_fast',
                                '--config-kind','reference','--out','build_q2cand'],
                               text=True,capture_output=True)
              name='+'.join(which) or 'baseline'
              if p.returncode:
                  print('Q2CAND',name,'ASSEMBLY_FAIL',p.stderr.strip().splitlines()[-1] if p.stderr.strip() else '')
                  continue
              shutil.copy2('build_q2cand/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg',
                           'v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg')
              cpu,api=load_profile('v2_pareto_fast')
              r=test_entry(cpu,api['MATH_SMUL32'],32,pairs)
              print(f'Q2CAND {name} mean={r["mean_cycles"]:.6f} min={r["min_cycles"]} max={r["max_cycles"]} errors={r["errors"]}')
          src.write_text(base)
          shutil.rmtree('build_q2cand',ignore_errors=True)
          subprocess.run(['python3','tools/assemble_sources.py','--profile','v2_pareto_fast',
                          '--config-kind','reference','--out','build_q2cand'],check=True)
          shutil.copy2('build_q2cand/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg',
                       'v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg')
          PY
      - name: Validate and print signed multiply timing
        run: |
          python3 tools/validate_signed_multiply.py --profile v2_pareto_fast
          python3 - <<'PY'
          import json
          p=json.load(open('validation/review/SIGNED_MULTIPLY_VALIDATION.json'))
          print(json.dumps(p['profiles']['v2_pareto_fast']['SMUL32'], indent=2))
          print(json.dumps(p['profiles']['v2_pareto_fast']['SMUL32_READY'], indent=2))
          PY
          python3 - <<'PY'
          import random
          from tools.validate_signed_multiply import load_profile, test_entry
          cpu,api=load_profile('v2_pareto_fast')
          rng=random.Random(0x534D554C)
          quadrants={
              'PP':[(rng.randrange(0x80000000),rng.randrange(0x80000000)) for _ in range(10000)],
              'PN':[(rng.randrange(0x80000000),rng.randrange(0x80000000,1<<32)) for _ in range(10000)],
              'NP':[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000)) for _ in range(10000)],
              'NN':[(rng.randrange(0x80000000,1<<32),rng.randrange(0x80000000,1<<32)) for _ in range(10000)],
          }
          for name,pairs in quadrants.items():
              r=test_entry(cpu,api['MATH_SMUL32'],32,pairs)
              print('QUADRANT',name,r)
          PY
