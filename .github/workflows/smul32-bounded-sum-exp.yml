name: SMUL32 FAST31 summation experiment

on:
  push:
    branches:
      - smul32-bounded-sum-exp
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  smul32-fast31:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Save shipped V2 baseline
        run: |
          mkdir -p /tmp/smul32-baseline
          cp v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg /tmp/smul32-baseline/v2.prg

      - name: Assemble V2-V4 reference sources
        run: |
          for p in v2_pareto_fast v3_reu_512k v4_reu_16m; do
            python3 tools/assemble_sources.py --profile "$p" --config-kind reference --out build_source
            cp "build_source/reference/$p/math_${p}_source_built.prg"                "$p/resident/math_${p}_game_math.prg"
          done
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu              v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu              v4_reu_16m/reu/c64_math_v4_16m_game_math.reu

      - name: Full signed multiply validation V2-V4
        run: |
          for p in v2_pareto_fast v3_reu_512k v4_reu_16m; do
            python3 tools/validate_signed_multiply.py --profile "$p"
            cp validation/review/SIGNED_MULTIPLY_VALIDATION.json "/tmp/${p}_signed.json"
          done

      - name: Measure multiply-refresh derivatives
        run: |
          python3 tools/benchmark_multiply_refresh.py
          python3 - <<'PY'
          import json
          d=json.load(open('validation/multiply_refresh/MULTIPLY_REFRESH_BENCHMARK.json'))
          for p in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              print('SHR16',p,d['profiles'][p]['MATH_SMUL32_SHR16'])
          PY

      - name: Published and shared-corpus SMUL32 timings
        run: |
          python3 - <<'PY'
          import json, random
          from tools.validate_signed_multiply import load_profile, test_entry

          profiles=['v2_pareto_fast','v3_reu_512k','v4_reu_16m']
          for p in profiles:
              d=json.load(open('/tmp/'+p+'_signed.json'))
              r=d['profiles'][p]
              print('PUBLISHED',p,'SMUL32',r['SMUL32'])
              print('PUBLISHED',p,'SMUL32_READY',r['SMUL32_READY'])

          rng=random.Random(0x534D3334)
          edge=[0,1,2,3,7,15,16,31,63,127,128,255,
                0x7ffffffe,0x7fffffff,0x80000000,0x80000001,
                0xfffffffe,0xffffffff]
          pairs=[(x,y) for x in edge for y in edge]
          pairs += [(rng.randrange(1<<32),rng.randrange(1<<32)) for _ in range(20000)]
          seen={}
          for p in profiles:
              cpu,api=load_profile(p)
              r=test_entry(cpu,api['MATH_SMUL32'],32,pairs)
              print('SHARED',p,r)
              seen[p]=r
          means={p:seen[p]['mean_cycles'] for p in profiles}
          if len(set(means.values())) != 1:
              raise SystemExit('shared-corpus SMUL32 means differ: '+repr(means))
          if any(seen[p]['errors'] for p in profiles):
              raise SystemExit('shared-corpus errors')
          PY

      - name: Exact-corpus A/B against shipped V2 baseline
        run: |
          cp v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg /tmp/smul32-baseline/v2-candidate.prg
          python3 - <<'PY'
          import random, shutil
          from tools.validate_signed_multiply import load_profile, test_entry

          profile='v2_pareto_fast'
          resident='v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg'
          rng=random.Random(0x534D3334)
          edge=[0,1,2,3,7,15,16,31,63,127,128,255,
                0x7ffffffe,0x7fffffff,0x80000000,0x80000001,
                0xfffffffe,0xffffffff]
          pairs=[(x,y) for x in edge for y in edge]
          pairs += [(rng.randrange(1<<32),rng.randrange(1<<32)) for _ in range(20000)]

          def measure(label, src):
              shutil.copyfile(src,resident)
              cpu,api=load_profile(profile)
              r=test_entry(cpu,api['MATH_SMUL32'],32,pairs)
              print('AB',label,r)
              if r['errors']:
                  raise SystemExit(label+' errors')
              return r

          cand=measure('CANDIDATE','/tmp/smul32-baseline/v2-candidate.prg')
          base=measure('BASELINE','/tmp/smul32-baseline/v2.prg')
          print('AB DELTA mean',cand['mean_cycles']-base['mean_cycles'],
                'min',cand['min_cycles']-base['min_cycles'],
                'max',cand['max_cycles']-base['max_cycles'])
          if cand['mean_cycles'] >= base['mean_cycles']:
              raise SystemExit('candidate is not faster on exact shared corpus')
          PY

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/smul32-bounded-sum-exp'
    needs: smul32-fast31
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smul32-bounded-sum-exp
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build reference and alternate artifacts
        run: |
          python3 tools/generate_sources.py
          python3 tools/assemble_sources.py --profile all --config-kind reference --out build_source
          python3 tools/assemble_sources.py --profile all --config-kind alternate --out build_source

      - name: Promote V2-V4 reference resident images
        run: |
          cp build_source/reference/v2_pareto_fast/math_v2_pareto_fast_source_built.prg \
             v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg
          cp build_source/reference/v3_reu_512k/math_v3_reu_512k_source_built.prg \
             v3_reu_512k/resident/math_v3_reu_512k_game_math.prg
          cp build_source/reference/v4_reu_16m/math_v4_reu_16m_source_built.prg \
             v4_reu_16m/resident/math_v4_reu_16m_game_math.prg
          cp build_source/reference/v3_reu_512k/c64_math_v3_reu_512k_source_built.reu \
             v3_reu_512k/reu/c64_math_v3_512k_game_math.reu
          cp build_source/reference/v4_reu_16m/c64_math_v4_reu_16m_source_built.reu \
             v4_reu_16m/reu/c64_math_v4_16m_game_math.reu

      - name: Regenerate source mirrors and performance evidence
        run: |
          python3 tools/generate_sources.py
          python3 tools/publish_native_signed_sources.py
          python3 tools/publish_standalone_sources.py
          python3 tools/validate_signed_multiply.py
          python3 tools/benchmark_multiply_refresh.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py
          python3 tools/generate_consolidated_routine_table.py
          python3 tools/generate_public_indexes.py
          python3 tools/validate_public_catalog.py
          python3 tools/validate_standalone_sources.py
          python3 tools/verify_deterministic_rebuild.py

      - name: Refresh release hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          s=json.loads((root/'RELEASE_STATUS.json').read_text())
          for p in ('v2_pareto_fast','v3_reu_512k','v4_reu_16m'):
              s['reference_prg_sha256'][p]=sha(root/'build_source/reference'/p/f'math_{p}_source_built.prg')
              s['alternate_prg_sha256'][p]=sha(root/'build_source/alternate'/p/f'math_{p}_source_built.prg')
          for p in ('v3_reu_512k','v4_reu_16m'):
              s['reference_reu_sha256'][p]=sha(root/'build_source/reference'/p/f'c64_math_{p}_source_built.reu')
              s['alternate_reu_sha256'][p]=sha(root/'build_source/alternate'/p/f'c64_math_{p}_source_built.reu')
          s['date']='2026-10-06'
          (root/'RELEASE_STATUS.json').write_text(json.dumps(s,indent=2)+'\n')
          PY

      - name: Verify promoted binaries
        run: |
          python3 tools/verify_deterministic_rebuild.py
          python3 tools/validate_signed_multiply.py
          python3 tools/validate_signed_layout.py
          python3 tools/validate_published_signed_sources.py

      - name: Remove experiment workflow and refresh package manifest
        run: |
          rm .github/workflows/smul32-bounded-sum-exp.yml
          rm -rf build_source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.')
          fs=sorted((p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.name!='SHA256SUMS.txt'), key=lambda p:str(p))
          (root/'SHA256SUMS.txt').write_text('\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}" for p in fs)+'\n')
          PY
          python3 tools/package_audit.py

      - name: Commit promoted SMUL32 artifacts
        run: |
          git config user.name "c64-math-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No promotion changes to commit"
          else
            git commit -m "Promote optimized SMUL32 FAST31 summation"
            git push origin HEAD:smul32-bounded-sum-exp
          fi

