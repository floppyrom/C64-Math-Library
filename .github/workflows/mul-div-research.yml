name: MUL_DIV research

on:
  push:
    paths:
      - 'research/mul_div/**'
      - 'tools/mini6502.py'
      - 'v2_pareto_fast/resident/math_v2_pareto_fast_game_math.prg'
      - 'v2_pareto_fast/resident/modules/pareto_umul8.a'
      - 'v2_pareto_fast/resident/modules/pareto_umul16.a'
      - '.github/workflows/mul-div-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-profile-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check corrected research
        run: |
          python -m py_compile \
            research/mul_div/generate_umuldiv16_pareto.py \
            research/mul_div/generate_umuldiv16_pareto_width.py \
            research/mul_div/benchmark_pareto_direct.py \
            research/mul_div/generate_prepared_fraction_pareto.py \
            research/mul_div/generate_prepared_fraction_pareto_inline.py \
            research/mul_div/prepared_fraction_pareto_model.py \
            research/mul_div/benchmark_prepared_fraction_pareto.py \
            research/mul_div/benchmark_quake64_nearclip_integration.py \
            research/mul_div/benchmark_wolf64_project_col.py \
            research/mul_div/model.py \
            research/mul_div/prepared_ratio_model.py
      - name: Actual-core exact MUL_DIV benchmark
        continue-on-error: true
        run: |
          set +e
          python research/mul_div/benchmark_pareto_direct.py --cases 5000 --json > /tmp/pareto_direct.json 2> /tmp/pareto_direct.stderr
          echo $? > /tmp/pareto_direct.exit
          exit 0
      - name: Actual-core prepared fraction benchmark
        continue-on-error: true
        run: |
          set +e
          python research/mul_div/benchmark_prepared_fraction_pareto.py --cases 5000 --json > /tmp/prepared_fraction_pareto.json 2> /tmp/prepared_fraction_pareto.stderr
          echo $? > /tmp/prepared_fraction_pareto.exit
          exit 0
      - name: Quake64 near-clip integration benchmark
        continue-on-error: true
        run: |
          set +e
          python research/mul_div/benchmark_quake64_nearclip_integration.py --cases 5000 --json > /tmp/quake64_nearclip_integration.json 2> /tmp/quake64_nearclip_integration.stderr
          echo $? > /tmp/quake64_nearclip_integration.exit
          exit 0
      - name: Wolf64 projection benchmark
        continue-on-error: true
        run: |
          set +e
          python research/mul_div/benchmark_wolf64_project_col.py --json > /tmp/wolf64_project_col.json 2> /tmp/wolf64_project_col.stderr
          echo $? > /tmp/wolf64_project_col.exit
          exit 0
      - name: Actual-core prepared fraction model
        continue-on-error: true
        run: |
          set +e
          python research/mul_div/prepared_fraction_pareto_model.py --cases 5000 --json > /tmp/prepared_fraction_pareto_model.json 2> /tmp/prepared_fraction_pareto_model.stderr
          echo $? > /tmp/prepared_fraction_pareto_model.exit
          exit 0
      - name: Independent arithmetic models
        continue-on-error: true
        run: |
          set +e
          python research/mul_div/model.py --cases 1000000 > /tmp/mul_div_model.txt 2> /tmp/mul_div_model.stderr
          echo $? > /tmp/mul_div_model.exit
          python research/mul_div/prepared_ratio_model.py --cases 100000 --json > /tmp/prepared_ratio_accuracy.json 2> /tmp/prepared_ratio_accuracy.stderr
          echo $? > /tmp/prepared_ratio_accuracy.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mul-div-profile-native-results
          path: |
            /tmp/pareto_direct.json
            /tmp/pareto_direct.stderr
            /tmp/pareto_direct.exit
            /tmp/prepared_fraction_pareto.json
            /tmp/prepared_fraction_pareto.stderr
            /tmp/prepared_fraction_pareto.exit
            /tmp/quake64_nearclip_integration.json
            /tmp/quake64_nearclip_integration.stderr
            /tmp/quake64_nearclip_integration.exit
            /tmp/wolf64_project_col.json
            /tmp/wolf64_project_col.stderr
            /tmp/wolf64_project_col.exit
            /tmp/prepared_fraction_pareto_model.json
            /tmp/prepared_fraction_pareto_model.stderr
            /tmp/prepared_fraction_pareto_model.exit
            /tmp/mul_div_model.txt
            /tmp/mul_div_model.stderr
            /tmp/mul_div_model.exit
            /tmp/prepared_ratio_accuracy.json
            /tmp/prepared_ratio_accuracy.stderr
            /tmp/prepared_ratio_accuracy.exit
